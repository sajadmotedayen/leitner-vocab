/* Single-turn Gemini call (no chat history) — used for inline suggestions such as
   "پیشنهاد معنی" / "پیشنهاد جمله نمونه" in the add-word form. */
/* Does one actual HTTP call to Gemini with a single specific key. Split out of geminiOnce so
   the rotation logic there can retry with a different key without duplicating the fetch code. */
async function geminiCallWithKey(key, systemPrompt, userMessage){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=' + encodeURIComponent(key);
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system_instruction: {parts:[{text: systemPrompt}]},
      contents: [{role:'user', parts:[{text:userMessage}]}]
    })
  });
  if(!res.ok){
    let detail = '';
    try{ const errData = await res.json(); detail = errData.error && errData.error.message ? ' — ' + errData.error.message : ''; }catch(e){}
    const err = new Error('HTTP '+res.status+detail);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  return (parts ? parts.map(p=>p.text||'').join('\n').trim() : '');
}

/* Single-turn Gemini call (no chat history), with automatic key rotation. If more than one API
   key is configured (the primary "کلید API" plus any "کلیدهای پشتیبان" from different Google
   accounts), and the given key comes back quota-exceeded (429) or unauthorized (401/403), the
   next configured key is tried automatically instead of failing right away. Whichever key ends
   up succeeding is promoted to the primary slot in settings, so every other AI feature in the
   app — which all read settings.key fresh right before calling this — picks up the working key
   on its very next call too, without needing its own rotation logic. */
async function geminiOnce(key, systemPrompt, userMessage){
  const settings = loadAiSettings();
  const pool = [key, ...(settings.extraKeys||[])].map(k=>(k||'').trim()).filter(Boolean);
  const orderedKeys = pool.length ? [...new Set(pool)] : [key];

  let lastErr = null;
  for(let i=0; i<orderedKeys.length; i++){
    const k = orderedKeys[i];
    try{
      const result = await geminiCallWithKey(k, systemPrompt, userMessage);
      if(k !== settings.key){
        // This key wasn't the primary one but it just worked — make it the primary so the rest
        // of the app stops hitting the exhausted/broken key first.
        const rest = orderedKeys.filter(x=>x!==k);
        saveAiSettings({ ...settings, key: k, extraKeys: rest });
      }
      return result;
    }catch(e){
      lastErr = e;
      const rotatable = e && (e.status===429 || e.status===401 || e.status===403);
      if(!rotatable || i===orderedKeys.length-1) throw e; // not a key-related error, or no more keys to try — surface it
      // otherwise: this key is exhausted/invalid — silently move on to the next one
    }
  }
  throw lastErr || new Error('درخواست به Gemini ناموفق بود.');
}

/* Cached (per exact source text, across the whole session) so the same English definition/
   example — which can legitimately show up more than once, e.g. shared between the quick-line
   summary and the full dictionary box — is only ever sent for translation once, never
   duplicated as a separate request. Returns null (never throws) if no key is configured or the
   request fails, so callers can just skip showing a translation rather than handle an error. */
const translationCache = {}; // kept for API compatibility with callers below
/* translateapi.ai (the original free-translation source for this) can't be called from the
   browser — it doesn't send Access-Control-Allow-Origin, so every request is blocked by CORS,
   and that can't be fixed client-side. Routing this through Gemini instead was tried, but that
   burns AI quota automatically on every single word tap, which isn't what's wanted here. So this
   is now a no-op: the free-dictionary box just stays English-only on its own (as it always did
   when no translation key was configured), and Persian meaning comes from the existing "🤖 معنی
   با هوش مصنوعی" button instead — which only calls Gemini when the user actually presses it. */
async function translateToFa(text){
  return null;
}

/* Ask Gemini for a suggested Persian meaning + optional example sentence for an English word.
   Requests strict JSON so it can be parsed reliably; falls back gracefully if parsing fails. */
async function fetchWordSuggestion(key, en){
  const systemPrompt = 'تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown، بدون توضیح اضافه) با دقیقاً این سه کلید برگردان: {"meaning": "معنی فارسی کوتاه و رایج‌ترین معنی کلمه", "definition": "یک توضیح آموزشی کوتاه به فارسی از معنای کلمه و نحوه استفاده از آن (نه ترجمه، بلکه توضیح)", "example": "یک جمله نمونه انگلیسی ساده و کوتاه که در آن از همان کلمه استفاده شده"}.';
  const userMessage = `کلمه انگلیسی: "${en}"`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{
    const obj = JSON.parse(cleaned);
    return { meaning: (obj.meaning||'').trim(), definition: (obj.definition||'').trim(), example: (obj.example||'').trim() };
  }catch(e){
    // Fallback: couldn't parse JSON, just surface the raw text as the meaning suggestion.
    return { meaning: cleaned, definition: '', example: '' };
  }
}

/* Ask Gemini for one fresh, random example sentence for a word (used during review, on demand).
   Optionally told which sentences were already generated for this card so it avoids repeating them. */
async function fetchRandomExample(key, en, fa, avoid){
  const avoidNote = (avoid && avoid.length)
    ? ` این جمله‌ها قبلاً برای همین کلمه ساخته شده‌اند، جمله جدید باید کاملاً متفاوت باشد و هیچ‌کدام از آن‌ها را تکرار نکند: ${avoid.map(s=>'"'+s+'"').join('، ')}.`
    : '';
  // Only the example sentence is requested — no translation, since the word's Persian meaning
  // is already known (saved on the word / shown from the "دستور زبان" tab) and re-translating
  // the example here would just repeat that same information in review mode.
  const systemPrompt = 'تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown، بدون توضیح اضافه) با دقیقاً این کلید برگردان: {"example": "یک جمله نمونه انگلیسی ساده، طبیعی و کوتاه که دقیقاً از همان کلمه انگلیسی داده‌شده استفاده می‌کند"}. هر بار باید جمله‌ای تازه با موقعیت یا زمینه‌ای متفاوت از قبل بسازی.';
  const userMessage = `کلمه انگلیسی: "${en}"${fa ? ` (معنی فارسی: ${fa})` : ''}.${avoidNote}`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{
    const obj = JSON.parse(cleaned);
    return { example: (obj.example||'').trim() };
  }catch(e){
    return { example: cleaned };
  }
}

/* Kicks off (or re-kicks off) generation of an example for the currently shown review card.
   Prefers reusing an example the word already has (its saved sentence, or anything "نمونه‌ها"
   produced earlier) — instant, no AI call, no repeats within the same card. Only falls back to
   asking the AI for a brand-new one once every saved example has already been shown. */
async function generateDeckExample(){
  const w = currentDeckWord();
  if(!w || !deckEl) return;
  deckInteracted = true;

  const unseen = deckExamplePool(w).filter(s => s!==deckExampleText && !deckExampleHistory.includes(s));
  if(unseen.length){
    if(deckExampleText) deckExampleHistory.push(deckExampleText);
    deckExampleText = unseen[Math.floor(Math.random()*unseen.length)];
    deckExampleSource = 'saved';
    deckExampleError = null;
    renderDeckCard();
    return;
  }

  const settings = loadAiSettings();
  if(!(settings.provider==='google' && settings.key)){
    deckExampleError = 'مثال ذخیره‌شده‌ی دیگری برای این کلمه نیست. برای ساخت مثال تازه با هوش مصنوعی، از تنظیمات کلید رایگان Gemini را وارد کن.';
    renderDeckCard();
    return;
  }
  deckExampleLoading = true;
  deckExampleError = null;
  renderDeckCard();
  try{
    const res = await fetchRandomExample(settings.key, w.en, w.fa, deckExampleHistory);
    if(currentDeckWord() !== w) return; // user moved to another card meanwhile
    if(deckExampleText) deckExampleHistory.push(deckExampleText);
    deckExampleText = res.example || '';
    deckExampleSource = 'ai';
  }catch(e){
    if(currentDeckWord() !== w) return;
    deckExampleError = 'ساخت مثال ناموفق بود: ' + (e && e.message ? e.message : e);
  }finally{
    if(currentDeckWord() === w){
      deckExampleLoading = false;
      renderDeckCard();
    }
  }
}

/* ---------- Pronunciation (real recorded audio, fetched online — no API key needed) ----------
   Uses the free dictionaryapi.dev service, which returns mp3 URLs of native speakers saying
   the word when available — often more than one, in different accents. We prefer an American
   recording when there's a choice, falling back to whatever is available otherwise. Looked up
   on demand (only when the speaker button is clicked) and cached in memory so repeat clicks on
   the same word don't re-fetch. */
const pronunciationCache = {}; // lowercased word -> audio URL, or null if confirmed unavailable
let pronunciationAudio = null; // currently playing Audio element, so a new click stops the previous one

/* Shared raw fetch+cache for the dictionaryapi.dev entry — used by both the pronunciation
   lookup above and the full free-dictionary fallback box below, so a word looked up once (for
   its audio, say) doesn't trigger a second network request when its definitions are needed too.
   Returns the raw parsed JSON array from the API, or null if the word wasn't found / the
   request failed for any reason (offline, blocked, rate-limited, etc). */
const dictionaryApiRawCache = {}; // lowercased word -> raw API array, or null if unavailable
async function fetchDictionaryApiRaw(en){
  const key = (en||'').trim().toLowerCase();
  if(!key) return null;
  if(key in dictionaryApiRawCache) return dictionaryApiRawCache[key];
  try{
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(key));
    if(!res.ok){ dictionaryApiRawCache[key] = null; return null; }
    const data = await res.json();
    dictionaryApiRawCache[key] = Array.isArray(data) ? data : null;
  }catch(e){ dictionaryApiRawCache[key] = null; }
  return dictionaryApiRawCache[key];
}

/* dictionaryapi.dev audio filenames usually encode the accent, e.g. ".../en-us-word.mp3" or
   ".../word-uk.mp3". Picks the American one when there's a choice; otherwise just the first. */
function pickPreferredAccentUrl(urls){
  if(!urls.length) return null;
  const isAccent = (u, code) => new RegExp(`(^|[\\/\\-_])${code}([\\-_.]|$)`, 'i').test(u);
  const us = urls.find(u => isAccent(u, 'us'));
  return us || urls[0];
}

async function getPronunciationUrl(en){
  const key = (en||'').trim().toLowerCase();
  if(!key) return null;
  if(key in pronunciationCache) return pronunciationCache[key];
  const data = await fetchDictionaryApiRaw(key);
  const urls = [];
  if(Array.isArray(data)){
    for(const entry of data){
      const phonetics = Array.isArray(entry.phonetics) ? entry.phonetics : [];
      phonetics.forEach(p=>{ if(p.audio && p.audio.trim()) urls.push(p.audio.trim()); });
    }
  }
  let url = pickPreferredAccentUrl(urls);
  if(url && url.startsWith('//')) url = 'https:' + url;
  pronunciationCache[key] = url;
  return url;
}

/* ---------- Free dictionary fallback (dictionaryapi.dev) — a full definitions/examples/
   synonyms lookup, grouped and labeled by part of speech, shown as a nicely categorized box.
   Unlike the AI (Gemini) explanations elsewhere in the app, this needs no API key and no quota,
   so it's used specifically for the moments the AI can't help: no key configured yet, a failed/
   filtered/quota-exhausted AI call, or no internet access to Google's API (e.g. no VPN from
   Iran) while dictionaryapi.dev is still reachable. It never replaces the AI content — it's an
   alternate, always-available source shown alongside or instead of it. ---------- */
const POS_FA_LABELS = {
  noun:'اسم', verb:'فعل', adjective:'صفت', adverb:'قید', pronoun:'ضمیر',
  preposition:'حرف اضافه', conjunction:'حرف ربط', interjection:'صوت',
  numeral:'عدد', article:'حرف تعریف', determiner:'معین‌کننده'
};

/* Turns the raw dictionaryapi.dev response into { phonetic, groups:[{pos, definitions:[{definition,
   example, synonyms}], synonyms}] } — capped to keep the box readable (max 3 definitions per part
   of speech, max 6 synonym chips per group) rather than dumping the API's full raw output. */
function parseFreeDictionaryEntry(data){
  if(!Array.isArray(data) || !data.length) return null;
  let phonetic = '';
  const groups = [];
  for(const entry of data){
    if(!phonetic){
      phonetic = (entry.phonetic||'').trim();
      if(!phonetic && Array.isArray(entry.phonetics)){
        const withText = entry.phonetics.find(p=> p.text && p.text.trim());
        if(withText) phonetic = withText.text.trim();
      }
    }
    const meanings = Array.isArray(entry.meanings) ? entry.meanings : [];
    meanings.forEach(m=>{
      const pos = (m.partOfSpeech||'').trim();
      const rawDefs = Array.isArray(m.definitions) ? m.definitions : [];
      const definitions = rawDefs.slice(0,3).map(d=>({
        definition: (d.definition||'').trim(),
        example: (d.example||'').trim(),
        synonyms: Array.isArray(d.synonyms) ? d.synonyms.filter(Boolean) : []
      })).filter(d=> d.definition);
      if(!definitions.length) return;
      const groupSynonyms = Array.isArray(m.synonyms) ? m.synonyms.filter(Boolean) : [];
      groups.push({ pos, definitions, synonyms: groupSynonyms.slice(0,6) });
    });
  }
  if(!groups.length) return null;
  return { phonetic, groups };
}

/* Cached at the parsed-entry level too (separate from the raw-response cache above), so re-
   opening the same word's fallback box during a session doesn't re-parse or re-render from
   scratch — negligible cost either way, but keeps the call sites simple (`await` once, get the
   ready-to-render shape back). */
const freeDictionaryEntryCache = {};
async function fetchFreeDictionaryLookup(en){
  const key = (en||'').trim().toLowerCase();
  if(!key) return null;
  if(key in freeDictionaryEntryCache) return freeDictionaryEntryCache[key];
  const raw = await fetchDictionaryApiRaw(key);
  const parsed = parseFreeDictionaryEntry(raw);
  freeDictionaryEntryCache[key] = parsed;
  return parsed;
}

/* Renders the parsed entry as a categorized box: a header row with the phonetic transcription,
   then one group per part of speech (colored pill label), each with a numbered definitions list
   (with an italic example under any definition that has one) and a row of synonym chips. Each
   definition/example gets an empty "-fa" placeholder line right under it (unique id, scoped to
   this render via `boxSeq`) — left empty here and filled in afterwards by
   augmentFreeDictionaryTranslations() if a TranslateAPI.ai key is configured, so the box works
   perfectly fine on its own (English-only) even when it isn't. */
let freeDictBoxSeq = 0;
function freeDictionaryBoxHtml(entry){
  if(!entry || !entry.groups.length) return '';
  const boxSeq = ++freeDictBoxSeq;
  const groupsHtml = entry.groups.map((g, gi)=>{
    const posLabel = POS_FA_LABELS[g.pos] || g.pos || '';
    const defsHtml = g.definitions.map((d, di)=>{
      const defFaId = `fd-${boxSeq}-def-${gi}-${di}-fa`;
      const exFaId = `fd-${boxSeq}-ex-${gi}-${di}-fa`;
      return `<li class="wd-freedict-def">${escapeHtml(d.definition)}<div class="wd-freedict-fa" id="${defFaId}"></div>${d.example ? `<div class="wd-freedict-example">"${escapeHtml(d.example)}"</div><div class="wd-freedict-fa" id="${exFaId}"></div>` : ''}</li>`;
    }).join('');
    const synHtml = g.synonyms.length
      ? `<div class="wd-freedict-syn-row">${g.synonyms.map(s=>`<span class="wd-freedict-syn-chip">${escapeHtml(s)}</span>`).join('')}</div>`
      : '';
    return `<div class="wd-freedict-group">
      ${posLabel ? `<span class="wd-freedict-pos">${escapeHtml(posLabel)}</span>` : ''}
      <ol class="wd-freedict-deflist">${defsHtml}</ol>
      ${synHtml}
    </div>`;
  }).join('');
  return `<div class="wd-freedict-box" data-fd-seq="${boxSeq}">
    <div class="wd-freedict-head">
      <span class="wd-freedict-title">📕 دیکشنری آزاد (بدون نیاز به هوش مصنوعی)</span>
      ${entry.phonetic ? `<span class="wd-freedict-phonetic">${escapeHtml(entry.phonetic)}</span>` : ''}
    </div>
    ${groupsHtml}
  </div>`;
}

/* No-op for now: was filling the "-fa" placeholder lines with a Persian translation, but the
   free translation source (translateapi.ai) is blocked by CORS and can't be called from the
   browser, and auto-routing through Gemini instead would burn AI quota on every word tap. So the
   free-dictionary box just stays English-only, exactly as it does when translateToFa() is a
   no-op — kept as a function (rather than removed) in case a working free/CORS-friendly
   translation source gets added later. */
async function augmentFreeDictionaryTranslations(containerEl, entry){
  return;
}

/* Fetches and mounts the free-dictionary fallback box inside `wrapEl` (any container element),
   showing a spinner while loading and a friendly not-found note if the word isn't in
   dictionaryapi.dev's database (it only covers English headwords, so multi-word phrases/idioms
   and rarer inflected forms often come back empty — that's fine, it's a bonus source, not the
   only one). Safe to call even if `wrapEl` is null/removed from the DOM by the time it resolves. */
async function mountFreeDictionaryFallback(wrapEl, en){
  if(!wrapEl) return;
  wrapEl.innerHTML = `<div class="ai-msg"><span class="spinner"></span> در حال جست‌وجو در دیکشنری آزاد...</div>`;
  let entry = null;
  try{ entry = await fetchFreeDictionaryLookup(en); }catch(e){ entry = null; }
  if(!wrapEl.isConnected) return;
  if(!entry){
    wrapEl.innerHTML = `<div class="ai-note">این کلمه در دیکشنری آزاد پیدا نشد. می‌تونی از دکمه‌ی 🔗 بالا دیکشنری‌های دیگه رو هم امتحان کنی.</div>`;
    return;
  }
  wrapEl.innerHTML = freeDictionaryBoxHtml(entry);
  augmentFreeDictionaryTranslations(wrapEl, entry); // best-effort, fills in translations if configured — doesn't block the English content already shown
}

/* Plays the pronunciation for `en` and gives quick visual feedback on the button that
   triggered it (🔈 while loading, 🔇 briefly if no audio could be found online). */
async function playPronunciation(en, btn){
  if(!en) return;
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:10px;height:10px;border-width:2px;"></span>'; }
  try{
    const url = await getPronunciationUrl(en);
    if(!url){
      if(btn){ btn.innerHTML = '🔇'; setTimeout(()=>{ if(btn.isConnected) btn.innerHTML = original; }, 1400); }
      return;
    }
    if(pronunciationAudio){ pronunciationAudio.pause(); }
    pronunciationAudio = new Audio(url);
    if(btn) btn.innerHTML = original;
    await pronunciationAudio.play().catch(()=>{});
  }catch(e){
    if(btn){ btn.innerHTML = '🔇'; setTimeout(()=>{ if(btn.isConnected) btn.innerHTML = original; }, 1400); }
  }finally{
    if(btn) btn.disabled = false;
  }
}

function isDue(w){
  if(w.box === 6) return false; // mastered/archived
  return new Date(w.nextReview) <= new Date();
}

/* Speaks English text via the browser's built-in Web Speech API (no network needed) — used by
   the word-detail panel's header pronunciation button and its example-sentence buttons. Distinct
   from playPronunciation(), which fetches a real recorded audio clip for single words. */
function speakText(text, btn){
  if(!text) return;
  const original = btn ? btn.innerHTML : '';
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    if(btn){ btn.innerHTML = '🔇'; setTimeout(()=>{ if(btn.isConnected) btn.innerHTML = original; }, 1400); }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }catch(e){
    if(btn){ btn.innerHTML = '🔇'; setTimeout(()=>{ if(btn.isConnected) btn.innerHTML = original; }, 1400); }
  }
}

/* ---------- Word of the day (AI suggestion based on the user's own vocabulary) ----------
   Once a day, ask Gemini to look at the words the user already has and suggest ONE new
   English word likely to be useful for them to learn next, with an English definition,
   and example. Cached in localStorage per calendar day so it doesn't re-ask on every render;
   the person can dismiss it for today or add it straight to their list. */
const WOD_STORAGE_KEY = 'leitner-word-of-day-v1';
let wordOfDayLoading = false;
let wordOfDayError = null;

function todayDateKey(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function loadWordOfDayCache(){
  try{
    const raw = localStorage.getItem(WOD_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveWordOfDayCache(obj){
  try{ localStorage.setItem(WOD_STORAGE_KEY, JSON.stringify(obj)); }catch(e){}
}

/* Ask Gemini to suggest one new word to learn. The prompt no longer includes the user's own
   vocabulary list (their learning history isn't sent to the AI) — instead, after the AI answers,
   the caller (generateWordOfDay) checks the suggested word against knownWords itself and, if it
   turns out to be a duplicate, simply asks again excluding it (see the alreadyHas check there). */
async function fetchWordOfDaySuggestion(key, knownWords, avoidWords){
  const avoidNote = (avoidWords && avoidWords.length) ? ` این کلمات را پیشنهاد نده چون قبلاً پیشنهاد شده‌اند: ${avoidWords.join('، ')}.` : '';
  const systemPrompt = 'تو یک مربی یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. دقیقاً یک کلمه انگلیسی پرکاربرد و مفید پیشنهاد بده که برای یک زبان‌آموز فارسی‌زبان در سطح مبتدی تا متوسط، قدم بعدی منطقی برای یادگیری باشد. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown، بدون توضیح اضافه) با دقیقاً این کلیدها برگردان: {"en": "کلمه انگلیسی پیشنهادی", "fa": "معنی فارسی کوتاه و رایج", "definition": "شرح معنای همان کلمه به زبان انگلیسی ساده، به سبک دیکشنری تک‌زبانه (یک جمله کوتاه)", "example": "یک جمله نمونه انگلیسی ساده با همین کلمه", "translation": "ترجمه فارسی همان جمله نمونه"}.';
  const userMessage = `یک کلمه انگلیسی پرکاربرد و مفید برای یادگیری پیشنهاد بده.${avoidNote}`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned); // let a parse failure propagate — caller shows a friendly error
  return {
    en: (obj.en||'').trim(),
    fa: (obj.fa||'').trim(),
    definition: (obj.definition||'').trim(),
    example: (obj.example||'').trim(),
    translation: (obj.translation||'').trim()
  };
}

/* Generates a fresh suggestion (used both for the automatic daily pick and the manual
   "پیشنهاد دیگری بده" re-roll). avoidCurrent lets the re-roll ask for something different
   from what's already on screen. */
async function generateWordOfDay(avoidCurrent){
  const settings = loadAiSettings();
  if(!(settings.provider==='google' && settings.key)){
    wordOfDayError = 'NO_KEY';
    renderWordOfDayCard();
    return;
  }
  wordOfDayLoading = true;
  wordOfDayError = null;
  renderWordOfDayCard();
  const knownWords = words.map(w=>w.en).filter(Boolean);
  const priorCache = loadWordOfDayCache();
  const avoid = [];
  if(avoidCurrent && priorCache && priorCache.en) avoid.push(priorCache.en);
  try{
    let suggestion = await fetchWordOfDaySuggestion(settings.key, knownWords, avoid);
    // if the AI accidentally suggested a word the user already has, try once more excluding it
    const alreadyHas = w => knownWords.some(k=> k.trim().toLowerCase()===w.trim().toLowerCase());
    if(suggestion.en && alreadyHas(suggestion.en)){
      suggestion = await fetchWordOfDaySuggestion(settings.key, knownWords, [...avoid, suggestion.en]);
    }
    if(!suggestion.en) throw new Error('پاسخ خالی بود');
    saveWordOfDayCache({date: todayDateKey(), ...suggestion, dismissed:false, added:false});
  }catch(e){
    wordOfDayError = (e && e.message) ? e.message : 'خطای نامشخص';
  }finally{
    wordOfDayLoading = false;
    renderWordOfDayCard();
  }
}

function renderWordOfDayCard(){
  const wrap = $('#wordOfDayWrap');
  if(!wrap) return;
  if(deckEl){ return; } // a fullscreen review/browse session is open on top; leave it be

  if(wordOfDayLoading){
    wrap.innerHTML = `<div class="wod-card"><div class="wod-head">🌟 پیشنهاد امروز</div><span class="spinner"></span> در حال پیدا کردن یک کلمه مناسب برای تو...</div>`;
    return;
  }
  if(wordOfDayError==='NO_KEY'){
    wrap.innerHTML = `
      <div class="wod-card">
        <button class="wod-close" id="wodCloseBtn">✕</button>
        <div class="wod-head">🌟 پیشنهاد امروز</div>
        <div class="wod-note">برای اینکه هر روز یک کلمه‌ی جدید و مرتبط با لغات خودت پیشنهاد بگیری، از دکمه ⚙ تنظیمات کلید رایگان Gemini را وارد کن.</div>
        <div class="wod-actions" style="margin-top:10px;">
          <button class="btn btn-secondary" id="wodSettingsBtn">رفتن به تنظیمات</button>
        </div>
      </div>`;
    wrap.querySelector('#wodCloseBtn').onclick = ()=>{ wordOfDayError=null; wrap.innerHTML=''; };
    wrap.querySelector('#wodSettingsBtn').onclick = openSettingsPage;
    return;
  }
  if(wordOfDayError){
    wrap.innerHTML = `
      <div class="wod-card">
        <button class="wod-close" id="wodCloseBtn">✕</button>
        <div class="wod-head">🌟 پیشنهاد امروز</div>
        <div class="wod-note">دریافت پیشنهاد ناموفق بود (${escapeHtml(wordOfDayError)}).</div>
        <div class="wod-actions" style="margin-top:10px;">

    wrap.querySelector('#wodCloseBtn').onclick = ()=>{ wordOfDayError=null; wrap.innerHTML=''; };
    wrap.querySelector('#wodRetryBtn').onclick = ()=> generateWordOfDay(false);

  const cache = loadWordOfDayCache();
  const todayKey = todayDateKey();

    // nothing generated for today yet — kick it off automatically (no-op if no AI key configured)
    generateWordOfDay(false);

  wrap.innerHTML = `
    <div class="wod-card">
      <button class="wod-close" id="wodCloseBtn">✕</button>
      <div class="wod-head">🌟 پیشنهاد امروز · با توجه به لغات تو</div>

          ? `<span class="wod-added">✓ به فهرست لغات اضافه شد</span>`

/* Opens the "word of the day" suggestion in the exact same fullscreen card UI used for
   browsing/reviewing regular words. If the word hasn't been added to the vocab list yet, it's
   added right now (same as the card's own ➕ button) — NOT a throwaway stand-in object.
   Reason: this view lets you tap through into "دستور زبان" / "دریافت کارت کامل از هوش مصنوعی"
   and everything the AI produces there only ever gets saved onto a real entry from `words`
   (via `words.find(...)` inside the detail panel) — a stand-in object that was never actually
   in `words` looked identical on screen but silently dropped everything the moment the view
   was closed, since nothing was ever pointing back at it. */
async function openWordOfDayInDeck(cache){
  if(!cache) return;
  let w = words.find(x=> (x.en||'').trim().toLowerCase()===cache.en.trim().toLowerCase());
  if(!w){
    await addWordToList(cache.en, cache.fa, cache.example||'', '', {});
    w = words.find(x=> (x.en||'').trim().toLowerCase()===cache.en.trim().toLowerCase());
    saveWordOfDayCache({...cache, added:true});
    renderWordOfDayCard();
  }
  startBrowse([w], 0);
}

/* Some .srt files (especially ones scraped/exported from web pages) contain literal HTML
   entities like &quot; &amp; &#39; instead of the real characters. Decoding them here means
   they show up correctly everywhere the subtitle text is used (captions, word panels, AI
   prompts) instead of leaking as raw "&quot;"-style text on screen. Safe to use innerHTML for
   this since it's only ever handed back through .value, never re-inserted as markup. */
function decodeHtmlEntities(str){
  if(!str) return str;
  const ta = document.createElement('textarea');
  let prev = str;
  for(let i=0; i<5; i++){
    ta.innerHTML = prev;
    const next = ta.value;
    if(next === prev) break; // fully decoded, nothing left to unwrap
    prev = next;
  }
  return prev;
}

/* Strips an .srt file down to just its spoken-line text: drops sequence numbers, timestamps,
   and any <i>/<b>/{...} styling tags, keeping one entry per subtitle line. */
function parseSrtLines(text){
  text = text.replace(/^\uFEFF/, '');
  const rawLines = text.split(/\r?\n/);
  const out = [];
  for(const raw of rawLines){
    const t = raw.trim();
    if(!t) continue;
    if(/^\d+$/.test(t)) continue; // sequence number
    if(/^\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}[,.]\d{3}/.test(t)) continue; // timestamp
    const clean = decodeHtmlEntities(t.replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,'').replace(/^-\s*/,'').trim());
    if(clean) out.push(clean);
  }
  return out;
}

/* Parses an .srt file into timed cues (start/end in seconds, plus the cue text) instead of
   flattening it to plain lines — used only by the offline video+subtitle sync player below,
   which needs the real timestamps to show each line while the video is at that point. */
/* The inverse of parseSrtCues — turns this app's {start,end,text} cues back into standard .srt
   text. Used only for YouTube-imported captions, so the existing "تحلیل زیرنویس و پیشنهاد کلمات"
   flow (which parses raw .srt text via parseSrtLines) can run on them exactly as it would on an
   uploaded file, without a YouTube-specific code path of its own. */
function cuesToSrtText(cues){
  const toClock = (s)=>{
    s = Math.max(0, s);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    const ms = Math.round((s - Math.floor(s)) * 1000);
    const pad2 = n=>String(n).padStart(2,'0'), pad3 = n=>String(n).padStart(3,'0');
    return `${pad2(h)}:${pad2(m)}:${pad2(sec)},${pad3(ms)}`;
  };
  return cues.map((c,i)=> `${i+1}\n${toClock(c.start)} --> ${toClock(c.end)}\n${c.text}`).join('\n\n');
}

function parseSrtCues(text){
  text = text.replace(/^\uFEFF/, '');
  const blocks = text.split(/\r?\n\r?\n+/);
  const cues = [];
  const toSeconds = (h,m,s,ms)=> (+h)*3600 + (+m)*60 + (+s) + (+ms)/1000;
  for(const block of blocks){
    const blockLines = block.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
    if(blockLines.length===0) continue;
    let idx = 0;
    if(/^\d+$/.test(blockLines[0])) idx = 1; // optional leading sequence number
    const timeLine = blockLines[idx];
    if(!timeLine) continue;
    const m = timeLine.match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if(!m) continue;
    const start = toSeconds(m[1],m[2],m[3],m[4]);
    const end = toSeconds(m[5],m[6],m[7],m[8]);
    const cueText = decodeHtmlEntities(blockLines.slice(idx+1)
      .map(l=>l.replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,''))
      .join('\n').trim());
    if(cueText && end>start) cues.push({ start, end, text: cueText });
  }
  cues.sort((a,b)=>a.start-b.start);
  return cues;
}

/* ---------- Remembering the last-watched video across sessions ----------
   The video file itself is never saved anywhere (it's just a local blob, and this app is
   deliberately dependency-free/offline) — only small metadata is kept in localStorage: which
   file it was, the .srt paired with it, the last playback position, and when the page was last
   closed/left. On a later visit the browser still requires the person to re-pick the video file
   themselves (a security restriction, not something this app can work around), but as soon as
   they pick a file whose name+size match the saved one, playback jumps back to that saved
   position automatically instead of starting from 0. */
const VSYNC_LAST_STATE_KEY = 'leitner-vsync-last-v1';
function loadVsyncLastState(){
  try{
    const raw = localStorage.getItem(VSYNC_LAST_STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveVsyncLastState(){
  if(!epVideoFileName && !epSyncSrtFileName && !epIsYoutube) return; // nothing picked yet — nothing worth remembering
  try{
    localStorage.setItem(VSYNC_LAST_STATE_KEY, JSON.stringify({
      videoName: epVideoFileName,
      videoSize: epVideoFileSize,
      // Unlike a local file, a YouTube video needs no re-browsing — the ID alone is enough to
      // reload the exact same video next session, so (unlike the local-video path above) this
      // one really can come back automatically. Its captions ride along via srtText below (see
      // handleYoutubeImport, which synthesizes .srt text from them the same as any other cues).
      isYoutube: epIsYoutube,
      youtubeId: epYoutubeId || '',
      youtubeUrl: epYoutubeUrl || '',
      srtName: epSyncSrtFileName || '',
      // Unlike the video (a local binary file, too big/unsafe to store), the subtitle's plain
      // text is small — so it's saved directly and can be brought back on its own, already
      // synced with the same manual offset, without ever having to re-browse for the .srt file.
      srtText: epSyncSrtRawText || '',
      subOffset: epSubOffset || 0,
      lastTime: epVideoLastTime || 0,
      // Just the translated text per cue (same order as epVideoCues) — timings are re-derived
      // from epVideoCues on restore, so this stays valid even if the offset changes later.
      faLines: epFaCues.length ? epFaCues.map(c=>c.text) : [],
      // "📄 تحلیل زیرنویس و پیشنهاد کلمات" results — kept so the word/idiom list already gotten
      // back from an external AI survives closing the app or navigating elsewhere, instead of
      // having to redo the whole copy-prompt/paste-answer round trip. candidatesPool/fullLines
      // are also kept since the "➕ کلمات بیشتر" button and response-grounding both need them.
      suggestions: episodeSuggestions,
      typeFilter: episodeTypeFilter,
      candidatesPool: srtCandidatesPool,
      fullLines: srtFullLines,
      // "🎯 های‌لایت کلمات هم‌سطح" result — same idea, for the in-player highlight set. Now
      // always populated together with `suggestions` below by the single merged analyze flow.
      levelWords: vsyncLevelWords.size ? [...vsyncLevelWords] : [],
      levelData: vsyncLevelData,
      levelCandidates: vsyncLevelCandidates,
      levelLines: vsyncLevelLines,
      highlightEnabled: vsyncHighlightEnabled,
      closedAt: Date.now()
    }));
  }catch(e){}
}

/* Brings back the last subtitle (cues + manual sync offset + translation), the last "تحلیل
   زیرنویس و پیشنهاد کلمات" word/idiom results, and the last player-highlight word set —
   automatically, when the episode page is (re)created, with no action needed from the person.
   Everything here was saved by saveVsyncLastState above, so there's nothing to re-pick or redo.
   Each piece only restores if nothing of that kind is loaded yet this session, so it never
   clobbers something the person already picked/generated just now. */
function restoreVsyncSrtFromStorage(){
  const last = loadVsyncLastState();
  if(!last) return;
  if(epVideoCues.length===0 && last.srtText){
    try{
      const cues = parseSrtCues(last.srtText);
      if(cues.length>0){
        epVideoCues = cues;
        epSyncSrtFileName = last.srtName || 'زیرنویس قبلی';
        epSyncSrtRawText = last.srtText;
        epSubOffset = last.subOffset || 0;
        // Only reusable if the count still lines up with the restored English cues — otherwise
        // the index-based alignment (epFaCues[i] belongs to epVideoCues[i]) would silently mismatch.
        if(Array.isArray(last.faLines) && last.faLines.length===cues.length){
          epFaCues = cues.map((c,i)=>({ start:c.start, end:c.end, text: last.faLines[i]||'' }));
        }
      }
    }catch(e){}
  }
  // Unlike a local video file, a YouTube video doesn't need re-browsing — restore it right away
  // so the person lands back on the exact same video, not an empty picker. Only when nothing has
  // been picked yet this session, and only if no local file already took its place.
  if(!epIsYoutube && !epVideoObjectUrl && last.isYoutube && last.youtubeId){
    epIsYoutube = true;
    epYoutubeId = last.youtubeId;
    epYoutubeUrl = last.youtubeUrl || '';
    epVideoLastTime = last.lastTime || 0;
    if(epVideoCues.length) epYoutubeCaptionsStatus = 'ok'; // came back via srtText above
  }
  if(episodeSuggestions.length===0 && Array.isArray(last.suggestions) && last.suggestions.length){
    episodeSuggestions = last.suggestions;
    episodeTypeFilter = last.typeFilter || 'all';
    srtCandidatesPool = Array.isArray(last.candidatesPool) ? last.candidatesPool : [];
    srtFullLines = Array.isArray(last.fullLines) ? last.fullLines : [];
  }
  if(vsyncLevelWords.size===0 && Array.isArray(last.levelWords) && last.levelWords.length){
    vsyncLevelWords = new Set(last.levelWords);
    vsyncLevelData = (last.levelData && typeof last.levelData==='object') ? last.levelData : {};
    vsyncLevelCandidates = Array.isArray(last.levelCandidates) ? last.levelCandidates : [];
    vsyncLevelLines = Array.isArray(last.levelLines) ? last.levelLines : [];
    vsyncHighlightEnabled = last.highlightEnabled !== false; // default on for older saved states
  }
}

/* Called when the person picks a local video file for the sync player. The file is never
   uploaded anywhere — just wrapped in an object URL so the <video> element can play it. */
function handleEpVideoFile(file){
  clearVsyncYoutubeSource(); // local file and YouTube are mutually exclusive sources
  if(epVideoObjectUrl) URL.revokeObjectURL(epVideoObjectUrl);
  epVideoObjectUrl = URL.createObjectURL(file);
  epVideoFileName = file.name;
  epVideoFileSize = file.size;
  // Same file (by name+size) as what was last saved, possibly from an earlier session? Resume
  // from that saved position, and keep whatever sync offset is already in memory (either from
  // this session or just restored from storage) instead of wiping it — only a genuinely
  // different video resets the offset, since the right offset is specific to a pairing.
  const last = loadVsyncLastState();
  const sameFile = !!(last && last.videoName===file.name && last.videoSize===file.size);
  if(!sameFile) epSubOffset = 0;
  epVideoLastTime = (sameFile && last.lastTime>0) ? last.lastTime : 0;
  renderVsyncPlayer();
  saveVsyncLastState();
}

/* ---------- Importing an online YouTube video for the sync player ----------
   An alternative to the local-file path above: the video streams straight from YouTube (via its
   official IFrame Player API), and YouTube's own captions (manual if the uploader added them,
   otherwise the auto-generated ones) are pulled in as this app's normal cue format so the whole
   existing player — tap-to-look-up caption, translation, level-highlighting — works unchanged. */

/* Pulls an 11-character YouTube video ID out of any of the URL shapes people paste (watch?v=,
   youtu.be/, shorts/, embed/, live/), or accepts a bare ID typed directly. Returns '' if nothing
   recognizable is found. */
function extractYoutubeId(input){
  const url = (input||'').trim();
  if(!url) return '';
  const m = url.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
  return '';
}

/* Loads the youtube.com/iframe_api script exactly once and resolves when window.YT is ready to
   construct players with. Safe to call repeatedly — later callers just await the same promise. */
function loadYoutubeIframeApi(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(epYtApiLoadPromise) return epYtApiLoadPromise;
  epYtApiLoadPromise = new Promise((resolve)=>{
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ if(typeof prevCb==='function') prevCb(); resolve(); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  });
  return epYtApiLoadPromise;
}

/* Makes a YT.Player instance quack enough like an HTMLVideoElement for the existing control-wiring
   code (wireVsyncControls, below) to drive it unmodified: currentTime/duration/paused/volume/muted
   as getters+setters, play()/pause(), and addEventListener('play'|'pause'|'timeupdate', ...) — the
   same subset the local <video> path actually uses. 'timeupdate' has no native equivalent on the
   YouTube player, so it's synthesized with a small poll while playing, matching the ~250ms-or-so
   granularity a real <video> fires it at closely enough for the caption-sync use here. */
class YtVideoFacade{
  constructor(player){
    this.yt = player;
    this._paused = true;
    this.ontimeupdate = null;
    this.onpause = null;
    this._listeners = {};
    this._pollTimer = setInterval(()=>{
      if(!this._paused){
        if(typeof this.ontimeupdate==='function') this.ontimeupdate();
        this._fire('timeupdate');
      }
    }, 250);
  }
  addEventListener(type, cb){ (this._listeners[type] = this._listeners[type]||[]).push(cb); }
  _fire(type){ (this._listeners[type]||[]).forEach(cb=>{ try{ cb(); }catch(e){} }); }
  _setPaused(p){
    const changed = p !== this._paused;
    this._paused = p;
    if(!changed) return;
    this._fire(p ? 'pause' : 'play');
    if(p && typeof this.onpause==='function') this.onpause();
  }
  get currentTime(){ try{ return this.yt.getCurrentTime() || 0; }catch(e){ return 0; } }
  set currentTime(v){ try{ this.yt.seekTo(v, true); }catch(e){} }
  get duration(){ try{ return this.yt.getDuration() || 0; }catch(e){ return 0; } }
  get paused(){ return this._paused; }
  get muted(){ try{ return this.yt.isMuted(); }catch(e){ return false; } }
  set muted(v){ try{ if(v) this.yt.mute(); else this.yt.unMute(); }catch(e){} }
  get volume(){ try{ return (this.yt.getVolume()||0)/100; }catch(e){ return 1; } }
  set volume(v){ try{ this.yt.setVolume(Math.max(0, Math.min(100, Math.round(v*100)))); }catch(e){} }
  play(){ try{ this.yt.playVideo(); }catch(e){} return Promise.resolve(); }
  pause(){ try{ this.yt.pauseVideo(); }catch(e){} }
  destroy(){ clearInterval(this._pollTimer); }
}

/* Plain fetch to YouTube's timedtext endpoint fails from most pages — it doesn't send an
   Access-Control-Allow-Origin header for arbitrary sites, so the browser blocks reading the
   response even though the request itself succeeded. This retries through a public CORS proxy
   when that happens, which is what actually makes caption fetching work in practice; the direct
   attempt is tried first since it's faster and doesn't depend on a third-party proxy staying up. */
async function fetchTextWithCorsFallback(url){
  try{
    const res = await fetch(url);
    if(res.ok){
      const text = await res.text();
      if(text) return text;
    }
  }catch(e){ /* likely CORS — fall through to the proxy below */ }
  const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  const res2 = await fetch(proxied);
  if(!res2.ok) throw new Error('http '+res2.status);
  return await res2.text();
}

/* Fetches the list of caption tracks YouTube has for a video (manual + auto-generated, in
   whichever languages exist) via the same undocumented endpoint the YouTube web player itself
   uses. Not an official/guaranteed API — see fetchYoutubeCaptionCues for how failures here are
   handled. */
async function fetchYoutubeCaptionTracks(videoId){
  const xmlText = await fetchTextWithCorsFallback(`https://www.youtube.com/api/timedtext?type=list&v=${encodeURIComponent(videoId)}`);
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  return Array.from(doc.querySelectorAll('track')).map(t=>({
    lang: t.getAttribute('lang_code') || '',
    kind: t.getAttribute('kind') || '' // 'asr' = auto-generated
  })).filter(t=>t.lang);
}

function pickBestYoutubeCaptionTrack(tracks){
  if(!tracks.length) return null;
  const find = (lang, wantAsr)=> tracks.find(t=> t.lang===lang && (wantAsr ? t.kind==='asr' : t.kind!=='asr'));
  return find('en', false) || find('en', true)
    || tracks.find(t=>t.kind!=='asr') || tracks[0];
}

/* Downloads and parses the actual caption cues for a video, in this app's normal {start,end,text}
   shape (seconds), so everything downstream (updateVsyncCaptionNow, translation, level-highlight
   analysis) treats it exactly like a parsed .srt. Throws on any failure (e.g. the CORS-proxy
   fallback above being unreachable too) — the caller is expected to catch this and degrade
   gracefully (video keeps playing, person can still pick a local .srt). */
async function fetchYoutubeCaptionCues(videoId){
  let lang = 'en', kind = '';
  try{
    const tracks = await fetchYoutubeCaptionTracks(videoId);
    const track = pickBestYoutubeCaptionTrack(tracks);
    if(track){ lang = track.lang; kind = track.kind; }
  }catch(e){
    // Track list unavailable — fall through and just try the common case (English auto-captions)
    // directly, since most educational content has those even when the list endpoint is blocked.
    kind = 'asr';
  }
  const params = new URLSearchParams({ v: videoId, lang, fmt:'json3' });
  if(kind==='asr') params.set('kind','asr');
  const text = await fetchTextWithCorsFallback(`https://www.youtube.com/api/timedtext?${params.toString()}`);
  const data = JSON.parse(text);
  const cues = [];
  for(const ev of (data.events||[])){
    if(!ev.segs || ev.tStartMs==null) continue;
    const text2 = ev.segs.map(s=>s.utf8||'').join('').replace(/\n+/g,' ').trim();
    if(!text2) continue;
    const start = ev.tStartMs/1000;
    const end = start + (ev.dDurationMs!=null ? ev.dDurationMs/1000 : 3);
    cues.push({ start, end, text: text2 });
  }
  cues.sort((a,b)=>a.start-b.start);
  return cues;
}

/* Tears down whatever YouTube player/facade currently exists — used both when a local file is
   picked instead (mutually exclusive sources) and right before loading a different YouTube video. */
function clearVsyncYoutubeSource(){
  if(epYtPlayer){
    try{ epYtPlayer.destroy(); }catch(e){}
    epYtPlayer = null;
    // The just-destroyed player's iframe is gone from the DOM, so whatever renderVsyncYoutubePlayer
    // last built is no longer there — clear its "already built" marker or a same-video re-import
    // would see the sentinel still matching and wrongly skip rebuilding.
    epVsyncLastRenderedSrc = null;
  }
  if(epVsyncActiveVideoEl && epVsyncActiveVideoEl instanceof YtVideoFacade) epVsyncActiveVideoEl.destroy();
  if(epIsYoutube) epVsyncActiveVideoEl = null;
  epIsYoutube = false;
  epYoutubeId = '';
  epYoutubeCaptionsStatus = '';
  epYoutubeCaptionsErrorMsg = '';
}

/* Called when the person pastes a YouTube URL/ID and presses "ایمپورت". Switches the sync player
   to online mode, kicks off the (best-effort) caption fetch, and re-renders. */
async function handleYoutubeImport(rawInput){
  const id = extractYoutubeId(rawInput);
  if(!id){
    epYoutubeCaptionsStatus = 'error';
    epYoutubeCaptionsErrorMsg = 'لینک یوتیوب معتبر به نظر نمی‌رسه.';
    renderVsyncPlayer();
    return;
  }
  clearVsyncYoutubeSource();
  if(epVideoObjectUrl){ URL.revokeObjectURL(epVideoObjectUrl); epVideoObjectUrl = null; }
  epVideoFileName = ''; epVideoFileSize = 0;
  epIsYoutube = true;
  epYoutubeId = id;
  epYoutubeUrl = rawInput.trim();
  epSubOffset = 0;
  epVideoLastTime = 0;
  epVideoCues = [];
  epFaCues = [];
  epYoutubeCaptionsStatus = 'loading';
  epYoutubeCaptionsErrorMsg = '';
  renderVsyncPlayer();
  saveVsyncLastState();
  try{
    const cues = await fetchYoutubeCaptionCues(id);
    if(epYoutubeId !== id) return; // a newer import happened while this one was in flight
    if(!cues.length) throw new Error('empty');
    epVideoCues = cues;
    epYoutubeCaptionsStatus = 'ok';
    // So the "تحلیل زیرنویس و پیشنهاد کلمات" / level-highlight flows (which parse raw .srt text)
    // work on YouTube's captions exactly as they would on an uploaded file, with no separate
    // code path of their own.
    epSyncSrtRawText = cuesToSrtText(cues);
    epSyncSrtFileName = 'زیرنویس یوتیوب';
  }catch(e){
    if(epYoutubeId !== id) return;
    epYoutubeCaptionsStatus = 'error';
    epYoutubeCaptionsErrorMsg = 'زیرنویس خودکار یوتیوب برای این ویدیو در دسترس نبود (محدودیت مرورگر) — می‌تونی فایل .srt رو دستی از پایین انتخاب کنی.';
  }
  renderVsyncLevelStatus();
  renderVsyncPlayer();
  saveVsyncLastState();
}

/* ---------- Reopening the same video WITHOUT re-browsing for it ----------
   A plain <input type="file"> can never remember a file across sessions — the browser makes the
   person navigate and pick it again every time, on purpose, for security. The File System Access
   API (Chromium browsers: desktop Chrome/Edge, Android Chrome — NOT Safari/iOS, NOT Firefox) is
   the one real way around that: a "file handle" it returns can be stored (here, in IndexedDB,
   since it can't be JSON-stringified into localStorage) and reused later. Reusing it still shows
   one quick native "زمینه دسترسی" permission prompt (a browser requirement, not something this
   app controls) — but that's a single tap, not navigating folders to find the file again. Where
   this API isn't supported, the code below quietly falls back to the ordinary file input. */
const SUPPORTS_FS_ACCESS = typeof window.showOpenFilePicker === 'function';
const VSYNC_HANDLE_DB = 'leitner-vsync-handles';
const VSYNC_HANDLE_STORE = 'handles';
const VSYNC_HANDLE_KEY = 'lastVideo';

function openVsyncHandleDb(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(VSYNC_HANDLE_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(VSYNC_HANDLE_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function saveVsyncFileHandle(handle){
  try{
    const db = await openVsyncHandleDb();
    await new Promise((res,rej)=>{
      const tx = db.transaction(VSYNC_HANDLE_STORE, 'readwrite');
      tx.objectStore(VSYNC_HANDLE_STORE).put(handle, VSYNC_HANDLE_KEY);
      tx.oncomplete = res;
      tx.onerror = ()=> rej(tx.error);
    });
  }catch(e){ /* best-effort — worst case, next time falls back to picking manually */ }
}
async function loadVsyncFileHandle(){
  try{
    const db = await openVsyncHandleDb();
    return await new Promise((res,rej)=>{
      const tx = db.transaction(VSYNC_HANDLE_STORE, 'readonly');
      const req = tx.objectStore(VSYNC_HANDLE_STORE).get(VSYNC_HANDLE_KEY);
      req.onsuccess = ()=> res(req.result || null);
      req.onerror = ()=> rej(req.error);
    });
  }catch(e){ return null; }
}

/* Opens the native file picker via the File System Access API and remembers the resulting handle
   for next time. Must be called directly from a click handler (a browser requirement for this API). */
async function pickVideoFileSmart(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description:'ویدیو', accept:{'video/*':['.mp4','.mkv','.webm','.mov','.avi','.m4v']} }],
      multiple: false
    });
    const file = await handle.getFile();
    await saveVsyncFileHandle(handle);
    handleEpVideoFile(file);
  }catch(e){ /* person cancelled the picker — nothing to do */ }
}

/* Tries to silently (or with just one permission tap) reopen the video from the previously
   saved handle — no folder navigation involved. Returns true if it actually loaded a video. */
async function resumeVsyncFromHandle(){
  const handle = await loadVsyncFileHandle();
  if(!handle) return false;
  try{
    let perm = await handle.queryPermission({ mode:'read' });
    if(perm !== 'granted') perm = await handle.requestPermission({ mode:'read' });
    if(perm !== 'granted') return false;
    const file = await handle.getFile();
    handleEpVideoFile(file);
    return true;
  }catch(e){ return false; }
}

/* Called when the person picks the .srt file to sync alongside the chosen video. Just caches the
   raw text and parses cues — the level-based highlight analysis itself is NOT run automatically
   here; it only runs when the person presses the "شروع تحلیل" button (📄 پیشنهاد کلمات و
   اصطلاحات + های‌لایت در پلیر — see the click handler wired in renderEpisodePage), since it
   costs an AI request. */
async function handleEpSyncSrtFile(file){
  const last = loadVsyncLastState();
  const sameFile = !!(last && last.srtName===file.name);
  epSyncSrtFileName = file.name;
  epSyncSrtRawText = '';
  if(!sameFile){ epSubOffset = 0; epFaCues = []; }
  try{
    const text = await file.text();
    epVideoCues = parseSrtCues(text);
    epSyncSrtRawText = text;
    // A translation from a previous, differently-shaped .srt can't stay aligned by index anymore.
    if(epFaCues.length && epFaCues.length!==epVideoCues.length) epFaCues = [];
  }catch(e){
    epVideoCues = [];
    epFaCues = [];
  }
  renderVsyncPlayer();
  renderVsyncLevelStatus();
  saveVsyncLastState();
}

/* Slim status bar shown right under the "📄 پیشنهاد کلمات و اصطلاحات" tool row, summarizing the
   current in-player highlight set (words + idioms together) — see renderSrtAnalyzePanel, the
   single flow that now produces both the suggestion list and this. */
function renderVsyncLevelStatus(transientMsg){
  const el = episodePageEl && episodePageEl.querySelector('#epVsyncLevelStatus');
  if(!el) return;
  if(vsyncLevelError){
    el.style.display = 'block';
    el.innerHTML = '';
    el.textContent = vsyncLevelError;
  }else if(vsyncLevelWords.size>0){
    // The "ساخت کارت کامل" round trip is only worth offering while at least one highlighted
    // word/idiom is still missing its full card — e.g. after the plain "تحلیل" flow. Once
    // "همه‌ی مراحل با هم" (combined mode) has already filled every card, or a later batch run
    // catches up the rest, this stays hidden instead of sitting there with nothing left to do.
    const missingCard = [...vsyncLevelWords].some(k => !(vsyncLevelData[k] && vsyncLevelData[k].grammar));
    el.style.display = 'block';
    el.innerHTML = `
      <div class="vsync-hl-bar">

          <input type="checkbox" id="epVsyncHighlightToggle" ${vsyncHighlightEnabled?'checked':''}>
          <span>✨ ${vsyncLevelWords.size} کلمه هم‌سطح ${vsyncHighlightEnabled ? '— های‌لایت روشن' : '— های‌لایت خاموش'}</span>
        </label>
        ${missingCard ? `<button type="button" class="btn btn-ghost btn-small" id="epBatchCardOpenBtn">📦 ساخت کارت کامل</button>` : ''}
      </div>
      ${transientMsg ? `<div class="ai-flow-hint">${escapeHtml(transientMsg)}</div>` : ''}`;
    const toggle = el.querySelector('#epVsyncHighlightToggle');
    if(toggle) toggle.onchange = ()=>{
      vsyncHighlightEnabled = toggle.checked;
      renderVsyncLevelStatus();
      updateVsyncCaptionNow();
      saveVsyncLastState();
    };
    const batchBtn = el.querySelector('#epBatchCardOpenBtn');
    if(batchBtn) batchBtn.onclick = ()=> openBatchCardPanelForHighlighted();
  }else{
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

/* Renders (or re-renders) the video element + caption overlay inside the episode page, and

   The caption is a custom overlay <div> (not a native <track>) specifically so each word in it
   can be tapped — tapping opens the same add-word form used everywhere else in the app,
   prefilled with that word, so the dictionary/AI-assistant tools and "add to box 1" flow all
   just work. Native browser captions can't be made clickable at all.

    status.textContent = `${videoPart} — ${srtPart}`;
    status.style.display = (epVideoFileName||epSyncSrtFileName||epIsYoutube) ? '' : 'none';
  }
}

/* Wires up every control for the sync player (play/pause, seek, volume gesture, caption
   size/position, manual sync offset, fullscreen+rotate) onto a video-like object — either the
   real <video> element (local-file mode) or a YtVideoFacade wrapping a YT.Player (YouTube
   mode). Called once right after that object exists: synchronously for a local file, or from
   the YT player's onReady callback for YouTube (see renderVsyncPlayer). Identical either way
   from here on — every line below already only used the small subset of the <video> interface
   the facade also implements. */
function wireVsyncControls(videoEl, holder){
  epVsyncActiveVideoEl = videoEl;

  // Jump back to where playback was left off last time this page was open, once the
  // browser knows the video's duration (setting currentTime any earlier is unreliable).
  if(epVideoLastTime > 0){
    videoEl.addEventListener('loadedmetadata', ()=>{
      try{ videoEl.currentTime = Math.min(epVideoLastTime, videoEl.duration || epVideoLastTime); }catch(e){}
    }, { once:true });
  }

  const captionText = holder.querySelector('#epVsyncCaptionText');
  videoEl.ontimeupdate = ()=>{
    epVideoLastTime = videoEl.currentTime;
    updateVsyncCaptionNow();
  };
  videoEl.onpause = ()=> saveVsyncLastState();
  captionText.onclick = (e)=>{
    const span = e.target.closest('.vsync-word');
    if(!span) return;
    const cueIdx = findActiveCueIndex(epVideoCues, videoEl.currentTime - epSubOffset);
    const cueText = cueIdx!==-1 ? epVideoCues[cueIdx].text : '';
    const dialogueContext = cueIdx!==-1 ? buildVsyncDialogueContext(epVideoCues, cueIdx, 3, 3) : '';
    handleVsyncWordTap(videoEl, span.dataset.w, cueText, dialogueContext);
  };

  const fsBtn = holder.querySelector('#epVsyncFsBtn');
  const rotateBtn = holder.querySelector('#epVsyncRotateBtn');
  const capMinusBtn = holder.querySelector('#epVsyncCapMinusBtn');
  const capPlusBtn = holder.querySelector('#epVsyncCapPlusBtn');
  const playerEl = holder.querySelector('#epVsyncPlayer');

  /* "فا" toggle — only shown once a Persian translation actually exists (see
     buildSrtTranslationPrompt/importSrtTranslation below). Hidden by default since most
     episodes won't have one loaded yet; refreshVsyncFaToggleVisibility() reveals it right
     after a successful import, or immediately if one was already restored from storage. */
  const faToggleBtn = holder.querySelector('#epVsyncFaToggleBtn');
  faToggleBtn.classList.toggle('active', epShowFaCaption);
  faToggleBtn.onclick = ()=>{
    epShowFaCaption = !epShowFaCaption;
    faToggleBtn.classList.toggle('active', epShowFaCaption);
    updateVsyncCaptionNow();
  };
  refreshVsyncFaToggleVisibility();

  /* Subtitle size is a personal preference (screen size, eyesight, taste), so it's kept in
     localStorage and applied as a CSS scale multiplier read by both the normal and
     fullscreen font-size rules — one shared control instead of two separate sizes to tune. */
  const CAP_SCALE_MIN = 0.6, CAP_SCALE_MAX = 2.2, CAP_SCALE_STEP = 0.15;
  let capScale = parseFloat(localStorage.getItem('vsyncCapScale')) || 1;
  const applyCapScale = ()=>{ playerEl.style.setProperty('--cap-scale', capScale); };
  applyCapScale();
  capMinusBtn.onclick = ()=>{
    capScale = Math.max(CAP_SCALE_MIN, +(capScale - CAP_SCALE_STEP).toFixed(2));
    localStorage.setItem('vsyncCapScale', capScale);
    applyCapScale();
  };
  capPlusBtn.onclick = ()=>{
    capScale = Math.min(CAP_SCALE_MAX, +(capScale + CAP_SCALE_STEP).toFixed(2));
    localStorage.setItem('vsyncCapScale', capScale);
    applyCapScale();
  };

  /* Vertical position of the caption over the video — also a personal preference (some
     phones/videos have their own on-screen controls or letterboxing that the caption should
     sit above), kept in localStorage the same way the size is, as a percentage from the
     bottom of the player. */
  const CAP_BOTTOM_MIN = 2, CAP_BOTTOM_MAX = 70, CAP_BOTTOM_STEP = 4;
  let capBottom = parseFloat(localStorage.getItem('vsyncCapBottom'));
  if(!(capBottom>=CAP_BOTTOM_MIN)) capBottom = 6;
  const applyCapBottom = ()=>{ playerEl.style.setProperty('--cap-bottom', capBottom+'%'); };
  applyCapBottom();
  const posUpBtn = holder.querySelector('#epVsyncPosUpBtn');
  const posDownBtn = holder.querySelector('#epVsyncPosDownBtn');
  posUpBtn.onclick = ()=>{
    capBottom = Math.min(CAP_BOTTOM_MAX, capBottom + CAP_BOTTOM_STEP);
    localStorage.setItem('vsyncCapBottom', capBottom);
    applyCapBottom();
  };
  posDownBtn.onclick = ()=>{
    capBottom = Math.max(CAP_BOTTOM_MIN, capBottom - CAP_BOTTOM_STEP);
    localStorage.setItem('vsyncCapBottom', capBottom);
    applyCapBottom();
  };

  /* Size + position used to be two rows sitting there permanently; now they're tucked behind
     this one toggle and only appear while actually being adjusted. */
  const capToggleBtn = holder.querySelector('#epVsyncCapToggleBtn');
  const capFlyout = holder.querySelector('#epVsyncCapFlyout');
  capToggleBtn.onclick = ()=>{
    const opening = capFlyout.style.display === 'none';
    capFlyout.style.display = opening ? 'flex' : 'none';
    capToggleBtn.classList.toggle('active', opening);
  };

  /* Volume swipe + auto-hide controls + our own play/pause & scrub bar, all owned by the
     invisible gesture layer sitting over the video (see .vsync-gesture-layer CSS for why it
     needs to be a dedicated element rather than listening on the video itself: without it
     capturing the touch first with touch-action:none, the browser tends to treat a vertical
     drag as a page-scroll before our own threshold check ever gets a chance to say
     otherwise). There's no native Chrome control strip left to defer to any more — a layer
     sitting on top of the video for the swipe gesture made it permanently unreachable no
     matter what the JS did, since hit-testing happens before any of our code runs — so
     play/pause and seeking are fully custom now too, living in the same show/hide cycle as
     the rest of the buttons instead of a separate invisible system. */
  const gestureLayer = holder.querySelector('#epVsyncGestureLayer');
  const volumeHud = holder.querySelector('#epVsyncVolumeHud');
  const volumeIcon = holder.querySelector('#epVsyncVolumeIcon');
  const volumeFill = holder.querySelector('#epVsyncVolumeFill');
  const volumePct = holder.querySelector('#epVsyncVolumePct');
  const centerPlayPauseBtn = holder.querySelector('#epVsyncCenterPlayPauseBtn');
  const timeCurrent = holder.querySelector('#epVsyncTimeCurrent');
  const timeDuration = holder.querySelector('#epVsyncTimeDuration');
  const seekTrack = holder.querySelector('#epVsyncSeekTrack');
  const seekFill = holder.querySelector('#epVsyncSeekFill');
  const seekHandle = holder.querySelector('#epVsyncSeekHandle');
  const seekFlashLeft = holder.querySelector('#epVsyncSeekFlashLeft');
  const seekFlashRight = holder.querySelector('#epVsyncSeekFlashRight');

  let lastNonZeroVolume = parseFloat(localStorage.getItem('vsyncVolume'));
  if(!(lastNonZeroVolume > 0)) lastNonZeroVolume = 1;
  videoEl.volume = lastNonZeroVolume;

  const renderVolumeHud = ()=>{
    const vol = videoEl.muted ? 0 : videoEl.volume;
    volumeIcon.textContent = vol===0 ? '🔇' : (vol < 0.5 ? '🔉' : '🔊');
    volumeFill.style.height = Math.round(vol*100) + '%';
    volumePct.textContent = Math.round(vol*100) + '%';
  };
  renderVolumeHud();

  let volumeHudTimer = null;
  const flashVolumeHud = ()=>{
    volumeHud.classList.add('show');
    clearTimeout(volumeHudTimer);
    volumeHudTimer = setTimeout(()=> volumeHud.classList.remove('show'), 700);
  };

  /* Auto-hide the custom controls during unattended playback, same as Chrome/MX Player —
     tapping the video toggles them (shows if hidden, hides if already showing — this is
     actually how Chrome's own mobile controls behave, not just a "wake up" reveal); pausing
     keeps them visible regardless. */
  let controlsHideTimer = null;
  const hideControlsNow = ()=>{
    clearTimeout(controlsHideTimer);
    playerEl.classList.add('vsync-controls-hidden');
    capFlyout.style.display = 'none';
    capToggleBtn.classList.remove('active');
  };
  const showControls = ()=>{
    playerEl.classList.remove('vsync-controls-hidden');
    clearTimeout(controlsHideTimer);
    if(!videoEl.paused){
      controlsHideTimer = setTimeout(hideControlsNow, 3000);
    }
  };
  const toggleControls = ()=>{
    if(playerEl.classList.contains('vsync-controls-hidden')) showControls();
    else hideControlsNow();
  };
  videoEl.addEventListener('play', showControls);
  videoEl.addEventListener('pause', ()=>{ clearTimeout(controlsHideTimer); playerEl.classList.remove('vsync-controls-hidden'); });
  playerEl.addEventListener('pointerdown', showControls);
  showControls();

  /* Play/pause — just the one big centered circle now (same idea as Chrome's own
     paused-state icon), plus the gesture layer's toggle for the controls themselves. A
     second small button down in the scrub bar was redundant with it, so that's gone. */
  const updatePlayPauseIcon = ()=>{
    centerPlayPauseBtn.textContent = videoEl.paused ? '▶' : '⏸';
  };
  updatePlayPauseIcon();
  const togglePlayPause = ()=>{ if(videoEl.paused) videoEl.play().catch(()=>{}); else videoEl.pause(); };
  centerPlayPauseBtn.onclick = togglePlayPause;
  videoEl.addEventListener('play', updatePlayPauseIcon);
  videoEl.addEventListener('pause', updatePlayPauseIcon);

  const fmtTime = (s)=>{
    if(!isFinite(s) || s<0) s = 0;
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + String(sec).padStart(2,'0');
  };
  let seekDragging = false;
  const updateSeekUI = ()=>{
    if(seekDragging) return;
    const dur = videoEl.duration || 0;
    const pct = dur>0 ? (videoEl.currentTime/dur)*100 : 0;
    seekFill.style.width = pct + '%';
    seekHandle.style.left = pct + '%';
    timeCurrent.textContent = fmtTime(videoEl.currentTime);
    timeDuration.textContent = fmtTime(dur);
  };
  videoEl.addEventListener('timeupdate', updateSeekUI);
  videoEl.addEventListener('loadedmetadata', updateSeekUI);
  updateSeekUI();

  const seekFromEvent = (e)=>{
    const rect = seekTrack.getBoundingClientRect();
    let pct = (e.clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    seekFill.style.width = (pct*100) + '%';
    seekHandle.style.left = (pct*100) + '%';
    timeCurrent.textContent = fmtTime(pct * (videoEl.duration || 0));
    return pct;
  };
  seekTrack.addEventListener('pointerdown', (e)=>{
    seekDragging = true;
    showControls();
    seekFromEvent(e);
    try{ seekTrack.setPointerCapture(e.pointerId); }catch(err){}
  });
  seekTrack.addEventListener('pointermove', (e)=>{
    if(!seekDragging) return;
    e.preventDefault();
    seekFromEvent(e);
  });
  seekTrack.addEventListener('pointerup', (e)=>{
    if(!seekDragging) return;
    const pct = seekFromEvent(e);
    videoEl.currentTime = pct * (videoEl.duration || 0);
    seekDragging = false;
  });

  /* Double-tap left/right to jump ±10s, the same gesture Chrome's own video controls use.
     A single tap can't immediately be treated as "just a tap" — it has to wait a beat to see
     whether a second one follows on the same side, the same way Chrome itself disambiguates
     a tap from the first half of a double-tap. */
  let seekFlashTimer = null;
  const showSeekFlash = (side)=>{
    const el = side==='right' ? seekFlashRight : seekFlashLeft;
    const other = side==='right' ? seekFlashLeft : seekFlashRight;
    other.classList.remove('show');
    el.classList.add('show');
    clearTimeout(seekFlashTimer);
    seekFlashTimer = setTimeout(()=> el.classList.remove('show'), 550);
  };
  const seekBy = (deltaSeconds, side)=>{
    const dur = videoEl.duration || Infinity;
    videoEl.currentTime = Math.min(dur, Math.max(0, videoEl.currentTime + deltaSeconds));
    showSeekFlash(side);
    showControls();
  };

  /* Tap anywhere on empty video toggles the controls — matches Chrome's actual mobile
     behavior (confirmed: it's a real toggle, not just a "wake up" reveal — tapping while the
     bar is already showing hides it again). A tap here deliberately never touches play/pause
     itself: that's the two dedicated buttons' job, or a double-tap on the same side, which
     seeks instead. Since interacting with an actual button/scrub-bar already implies the
     controls are visible, those keep using the simpler always-reveal listener below instead
     of this disambiguation — this only needs to run for taps that land on the bare video. */
  let gesture = null; // {x0,y0,pointerId,mode:'pending'|'volume'|'other', startVolume, height}
  let lastTap = null; // {side, time} — for detecting a same-side double-tap-to-seek
  let pendingToggleTimer = null;
  const gesturePointerDown = (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.stopPropagation(); // don't also trigger the blind "always show" listener on playerEl
    const rect = gestureLayer.getBoundingClientRect();
    gesture = {
      x0:e.clientX, y0:e.clientY, pointerId:e.pointerId, mode:'pending',
      isRight: (e.clientX - rect.left) > rect.width*0.5,
      startVolume: videoEl.muted ? 0 : videoEl.volume,
      height: rect.height
    };
    try{ gestureLayer.setPointerCapture(e.pointerId); }catch(err){}
  };
  const gesturePointerMove = (e)=>{
    if(!gesture || gesture.pointerId!==e.pointerId) return;
    const dx = e.clientX - gesture.x0, dy = e.clientY - gesture.y0;
    if(gesture.mode==='pending'){
      if(Math.hypot(dx,dy) < 12) return; // still could just be a tap
      gesture.mode = (gesture.isRight && Math.abs(dy) > Math.abs(dx)) ? 'volume' : 'other';
    }
    if(gesture.mode==='volume'){
      e.preventDefault();
      const delta = -dy / (gesture.height * 0.75);
      const newVol = Math.min(1, Math.max(0, gesture.startVolume + delta));
      videoEl.muted = false;
      videoEl.volume = newVol;
      if(newVol > 0) lastNonZeroVolume = newVol;
      renderVolumeHud();
      flashVolumeHud();
      showControls();
    }
  };
  const gesturePointerUp = (e)=>{
    if(!gesture || gesture.pointerId!==e.pointerId) return;
    if(gesture.mode==='pending'){
      const side = gesture.isRight ? 'right' : 'left';
      const now = Date.now();
      if(lastTap && lastTap.side===side && (now - lastTap.time) < 350){
        // Second tap on the same side within the window — a double-tap-seek, not two clicks.
        clearTimeout(pendingToggleTimer);
        lastTap = null;
        seekBy(side==='right' ? 10 : -10, side);
      }else{
        // Could still turn into a double-tap — hold off on the show/hide toggle until the
        // window passes with nothing else arriving, or every double-tap would also flicker
        // the controls' visibility right before seeking.
        lastTap = { side, time: now };
        clearTimeout(pendingToggleTimer);
        pendingToggleTimer = setTimeout(()=>{
          lastTap = null;
          toggleControls();
        }, 300);
      }
    }else if(gesture.mode==='volume'){
      localStorage.setItem('vsyncVolume', videoEl.muted ? 0 : videoEl.volume);
    }
    gesture = null;
  };
  gestureLayer.addEventListener('pointerdown', gesturePointerDown);
  gestureLayer.addEventListener('pointermove', gesturePointerMove, { passive:false });
  gestureLayer.addEventListener('pointerup', gesturePointerUp);
  gestureLayer.addEventListener('pointercancel', ()=>{ gesture = null; });


  /* Manual subtitle sync offset — shifts which cue counts as "active" without touching the
     .srt file itself, for when its timestamps run a bit early/late compared to this video. */
  const syncMinusBtn = holder.querySelector('#epVsyncSyncMinusBtn');
  const syncPlusBtn = holder.querySelector('#epVsyncSyncPlusBtn');
  const syncBadge = holder.querySelector('#epVsyncSyncBadge');
  const SUB_OFFSET_STEP = 0.5;
  const renderSyncBadge = ()=>{
    const sign = epSubOffset > 0 ? '+' : '';
    syncBadge.textContent = `${sign}${epSubOffset.toFixed(1)}s`;
  };
  renderSyncBadge();
  syncMinusBtn.onclick = ()=>{
    epSubOffset = +(epSubOffset - SUB_OFFSET_STEP).toFixed(2);
    renderSyncBadge();
    updateVsyncCaptionNow();
    saveVsyncLastState();
  };
  syncPlusBtn.onclick = ()=>{
    epSubOffset = +(epSubOffset + SUB_OFFSET_STEP).toFixed(2);
    renderSyncBadge();
    updateVsyncCaptionNow();
    saveVsyncLastState();
  };
  syncBadge.onclick = ()=>{
    epSubOffset = 0;
    renderSyncBadge();
    updateVsyncCaptionNow();
    saveVsyncLastState();
  };
  syncBadge.style.pointerEvents = 'auto';
  syncBadge.style.cursor = 'pointer';
  syncBadge.title = 'برای بازنشانی لمس کن';

  const requestPlayerFullscreen = ()=>{
    const req = playerEl.requestFullscreen || playerEl.webkitRequestFullscreen || playerEl.msRequestFullscreen;
    if(req) return req.call(playerEl);
  };
  const exitPlayerFullscreen = ()=>{
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit) return exit.call(document);
  };
  fsBtn.onclick = ()=>{
    const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if(isFs) exitPlayerFullscreen();
    else requestPlayerFullscreen();
  };
  // Rotate: prefer the real Screen Orientation API. When supported (Chrome/Firefox on
  // Android) this actually locks the device's screen to landscape while fullscreen — the
  // whole viewport becomes landscape, no physical rotation needed, and the existing
  // fullscreen video CSS just reflows into it naturally. iOS Safari doesn't implement this
  // API at all (it throws), so for that case (and anything else that fails) we fall back to
  // the CSS-transform trick that visually rotates the player instead.
  rotateBtn.onclick = async ()=>{
    const orientation = screen.orientation;
    if(orientation && orientation.lock){
      try{
        if(epVsyncOrientationLocked){
          if(orientation.unlock) orientation.unlock();
          epVsyncOrientationLocked = false;
          rotateBtn.classList.remove('active');
        }else{
          await orientation.lock('landscape');
          epVsyncOrientationLocked = true;
          rotateBtn.classList.add('active');
        }
        return;
      }catch(err){
        // e.g. lock() rejected/unsupported for this value — fall through to CSS fallback.
      }
    }
    playerEl.classList.toggle('vsync-rotate');
  };
  // Shortcut for the common case of "I already know I want landscape, skip the two-tap
  // dance": lives in the seek row so it's reachable before fullscreen is even entered, and
  // just chains the two existing actions — request fullscreen, then run the exact same
  // rotate logic above — rather than duplicating that logic.
  const preFsRotateBtn = holder.querySelector('#epVsyncPreFsRotateBtn');
  preFsRotateBtn.onclick = async ()=>{
    const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if(!isFs){
      try{ await requestPlayerFullscreen(); }catch(err){}
    }
    rotateBtn.onclick();
  };
  // Show/hide the rotate button with fullscreen state, and reset rotation (both the real
  // orientation lock and the CSS fallback) the moment fullscreen ends, so nothing gets stuck.
  // (Old listener removed first so re-renders don't stack duplicates.)
  if(epVsyncFsChangeHandler) document.removeEventListener('fullscreenchange', epVsyncFsChangeHandler);
  epVsyncFsChangeHandler = ()=>{
    const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    playerEl.classList.toggle('vsync-fs-active', !!isFs);
    if(!isFs){
      playerEl.classList.remove('vsync-rotate');
      rotateBtn.classList.remove('active');
      epVsyncOrientationLocked = false;
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }
  };
  document.addEventListener('fullscreenchange', epVsyncFsChangeHandler);
  document.addEventListener('webkitfullscreenchange', epVsyncFsChangeHandler);
}

/* Builds (or reuses) the sync player for online YouTube-video mode. Same outer markup/IDs as the
   local-file player above — #epVsyncPlayer, the caption overlay, the whole custom controls layer
   — just with the <video> swapped for a container the YouTube IFrame API renders into, so
   wireVsyncControls (and every CSS rule keyed off those IDs) needs no YouTube-specific branching
   of its own. Safe to call repeatedly: if the same video is already loaded, it's a no-op — picking
   a local .srt as a caption fallback, for instance, re-renders the whole page without touching
   the already-playing video. */
function renderVsyncYoutubePlayer(holder){
  const srcKey = 'yt:' + epYoutubeId;
  if(epVsyncLastRenderedSrc === srcKey && holder.querySelector('#epVsyncPlayer')) return;
  if(epYtPlayer){ try{ epYtPlayer.destroy(); }catch(e){} epYtPlayer = null; }
  holder.innerHTML = `
    <div class="vsync-player" id="epVsyncPlayer">
      <div class="vsync-yt-wrap">
        <div id="epVsyncYtTarget"></div>
        <div class="vsync-yt-msg" id="epVsyncYtMsg">در حال بارگذاری پلیر یوتیوب...</div>
      </div>
      <div class="vsync-caption">
        <div class="vsync-caption-text" id="epVsyncCaptionText" style="display:none;"></div>
        <div class="vsync-caption-text vsync-caption-fa" id="epVsyncCaptionFaText" style="display:none;"></div>
      </div>
      <div class="vsync-gesture-layer" id="epVsyncGestureLayer"></div>
      <div class="vsync-controls-layer">
        <button type="button" class="vsync-rotate-btn" id="epVsyncRotateBtn" title="چرخوندن ویدیو">⤾</button>
        <div class="vsync-btn-row">
          <button type="button" class="vsync-cap-size-btn" id="epVsyncCapToggleBtn" title="تنظیم زیرنویس (اندازه، موقعیت، هماهنگی)">🔤</button>
          <button type="button" class="vsync-cap-size-btn" id="epVsyncFaToggleBtn" title="نمایش/مخفی‌کردن ترجمه فارسی" style="display:none;">فا</button>
        </div>
        <div class="vsync-cap-flyout" id="epVsyncCapFlyout" style="display:none;">
          <span class="vsync-flyout-group">
            <button type="button" class="vsync-cap-size-btn" id="epVsyncCapMinusBtn" title="کوچک‌تر کردن زیرنویس">A−</button>
            <button type="button" class="vsync-cap-size-btn" id="epVsyncCapPlusBtn" title="بزرگ‌تر کردن زیرنویس">A+</button>
          </span>
          <span class="vsync-flyout-group">
            <button type="button" class="vsync-cap-size-btn" id="epVsyncPosDownBtn" title="پایین بردن زیرنویس">⬇</button>
            <button type="button" class="vsync-cap-size-btn" id="epVsyncPosUpBtn" title="بالا بردن زیرنویس">⬆</button>
          </span>
          <span class="vsync-flyout-group">
            <button type="button" class="vsync-cap-size-btn" id="epVsyncSyncMinusBtn" title="زودتر نمایش بده">−۰.۵s</button>
            <span class="vsync-sync-badge" id="epVsyncSyncBadge">0.0s</span>
            <button type="button" class="vsync-cap-size-btn" id="epVsyncSyncPlusBtn" title="دیرتر نمایش بده">+۰.۵s</button>
          </span>
        </div>
        <div class="vsync-volume-hud" id="epVsyncVolumeHud">
          <div class="vsync-volume-icon" id="epVsyncVolumeIcon">🔊</div>
          <div class="vsync-volume-track"><div class="vsync-volume-fill" id="epVsyncVolumeFill"></div></div>
          <div class="vsync-volume-pct" id="epVsyncVolumePct">100%</div>
        </div>
        <div class="vsync-seek-flash vsync-seek-flash-left" id="epVsyncSeekFlashLeft">
          <span class="vsync-seek-flash-icon">⟲</span>10s
        </div>
