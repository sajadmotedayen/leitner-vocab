  const updateBanner = ()=>{
    const bar = box.querySelector('#epSelBanner');
    const count = episodeSelected.size;
    bar.style.display = count>0 ? 'flex' : 'none';
    box.querySelector('#epSelCount').textContent = `${count} کلمه انتخاب شده`;
  };
  updateBanner();

  box.querySelectorAll('.ep-type-filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      episodeTypeFilter = btn.dataset.filter;
      renderEpisodeResults();
    };
  });

  box.querySelectorAll('.ep-word-card').forEach(card=>{
    card.onclick = ()=>{
      const idx = +card.dataset.idx;
      if(episodeSelected.has(idx)) episodeSelected.delete(idx); else episodeSelected.add(idx);
      renderEpisodeResults();
    };
  });

  box.querySelectorAll('.ep-show-in-srt-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const idx = +btn.dataset.idx;
      const w = episodeSuggestions[idx];
      if(!w) return;
      srtHighlightWord = w.en;
      renderEpisodeResults();
      const wrap = episodePageEl.querySelector('#epFullSrtWrap');
      if(wrap) wrap.scrollIntoView({ block:'start', behavior:'smooth' });
      renderSrtFullPanel(true);
    };
  });

  /* Same dictionary/AI-assistant/full-info panels used by the manual add-word form — reused here
     so a suggested word can be looked up or explained without first adding it to the list. The
     only difference is the source of the word: typed manually vs picked from the subtitle. */
  box.querySelectorAll('.ep-tools-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const w = episodeSuggestions[+btn.dataset.idx];
      if(w) openBrowseToolsPanel(w);
    };
  });
  box.querySelectorAll('.ep-ai-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const w = episodeSuggestions[+btn.dataset.idx];
      if(w) openAiPanel(w);
    };
  });
  box.querySelectorAll('.ep-explain-btn').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const w = episodeSuggestions[+btn.dataset.idx];
      if(w) openWordDetailPanel(w, { sentence: w.example || '' });
    };
  });

  const addBtn = box.querySelector('#epAddBtn');
  if(addBtn){
    addBtn.onclick = async (e)=>{
      e.stopPropagation();
      const existingLower = new Set(words.map(w=>(w.en||'').trim().toLowerCase()));
      let addedCount = 0;
      episodeSelected.forEach(idx=>{
        const w = episodeSuggestions[idx];
        if(!w || existingLower.has(w.en.trim().toLowerCase())) return;
        const newW = {
          id: 'w_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          en: w.en, fa: w.fa, example: w.example||'', note:'',
          type: w.type || 'word',
          box: 1, nextReview: todayISO(), createdAt: todayISO()
        };
        // If a batch/full-card AI answer was already generated for this word (via "📦 ساخت کارت
        // کامل"), carry it straight onto the newly saved word — see applyBatchFullCardResults —
        // instead of leaving it stranded on the now-unused suggestion object.
        if(w.grammar) newW.grammar = w.grammar;
        if(w.practicalNotes) newW.practicalNotes = w.practicalNotes;
        if(w.moreExamples && w.moreExamples.length) newW.moreExamples = w.moreExamples;
        words.push(newW);
        existingLower.add(w.en.trim().toLowerCase());
        addedCount++;
      });
      await saveWords();
      renderDrawers();
      if(listPageRedraw) listPageRedraw();
      closeEpisodePage();
      alert(addedCount>0 ? `${addedCount} کلمه به فهرست لغات اضافه شد.` : 'کلمه‌ای اضافه نشد (احتمالاً همه قبلاً در فهرست بودند).');
    };
  }
}

function renderDrawers(){
  const drawersEl = $('#drawers');
  drawersEl.innerHTML = '';
  const now = new Date();
  let totalDue = 0;

  for(let b=1;b<=5;b++){
    const inBox = words.filter(w=>w.box===b);
    const due = inBox.filter(isDue).length;
    totalDue += due;
    const div = document.createElement('div');
    div.className='drawer';
    div.innerHTML = `
      <div class="label"><span class="handle"></span>${BOX_LABELS[b]}</div>
      <div class="counts">
        <span class="chip">${inBox.length} کلمه</span>
        ${due>0?`<span class="chip due">${due} امروز</span>`:''}
      </div>`;
    div.onclick = ()=> openListPage(b);
    drawersEl.appendChild(div);
  }
  const mastered = words.filter(w=>w.box===6);
  const md = document.createElement('div');
  md.className='drawer mastered';
  md.innerHTML = `
    <div class="label"><span class="handle"></span>🏆 بایگانی مسلط‌شده‌ها</div>
    <div class="counts"><span class="chip">${mastered.length} کلمه</span></div>`;
  md.onclick = ()=> openListPage(6);
  drawersEl.appendChild(md);

  $('#dueBadge').textContent = totalDue>0 ? `${totalDue} کلمه برای مرور` : 'مرور امروز تمام شد ✓';
  $('#todayLabel').textContent = new Date().toLocaleDateString('fa-IR', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  renderHome();
  renderWordOfDayCard();
}

/* Home card (behind the drawers): summarizes what's due for review today — a peek at the
   actual words — instead of a plain empty state. Starting review itself is handled by the
   "شروع مرور امروز" button already in the top header, so it isn't repeated here. */
function renderHome(){
  if(deckEl) return; // a full-screen review/browse session is open on top; leave the home card alone
  if(words.length===0){
    mainEl.innerHTML = `<div class="card empty"><div class="big">📇</div>هنوز لغتی اضافه نکرده‌اید. با دکمه «افزودن لغت جدید» شروع کنید.</div>`;
    return;
  }
  const due = words.filter(isDue);
  if(due.length===0){
    mainEl.innerHTML = `<div class="card empty"><div class="big">👋</div>مرور امروز تمام شده! برای مرور آزاد، یکی از جعبه‌ها را انتخاب کن.</div>`;
    return;
  }
  due.sort((a,b)=> new Date(a.nextReview) - new Date(b.nextReview));
  const shown = due.slice(0, 24);
  const rest = due.length - shown.length;
  mainEl.innerHTML = `
    <div class="card">
      <div id="homeDueList" style="display:flex; flex-wrap:wrap; gap:7px; justify-content:center;">
        ${shown.map(w=>`<span class="list-item" data-id="${w.id}"><span class="li-word">${escapeHtml(w.en)}</span></span>`).join('')}
        ${rest>0 ? `<span class="list-item" style="cursor:default;">+ ${rest} مورد دیگر</span>` : ''}
      </div>
    </div>`;
  mainEl.querySelectorAll('#homeDueList [data-id]').forEach(chip=>{
    chip.onclick = ()=>{
      const idx = due.findIndex(w=>w.id===chip.dataset.id);
      startBrowse(due, idx);
    };
  });
}

/* ---------- Add / Edit word ---------- */
/* Shared "save a brand-new word" logic — used by openWordDetailPanel's "یاد بگیر" button,
   and also by the "➕ افزودن به فهرست لغات" button inside the full explanation panel. */
async function addWordToList(en, fa, example, note, extra){
  const w = {
    id: 'w_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    en, fa, example: example||'', note: note||'',
    box: 1,
    nextReview: todayISO(),
    createdAt: todayISO()
  };
  // Whatever AI (in-app Gemini or a pasted external-AI answer, doesn't matter which) has already
  // produced for this word gets saved right onto the word record — so opening its details again
  // later shows the same grammar/practical-notes/examples instantly, instead of showing a "بدون
  // معنی، بعداً کامل کن" placeholder and burning another AI call to look the same thing up again.
  if(extra){
    if(extra.grammar) w.grammar = extra.grammar;
    if(extra.practicalNotes) w.practicalNotes = extra.practicalNotes;
    if(extra.moreExamples && extra.moreExamples.length) w.moreExamples = extra.moreExamples;
  }
  words.push(w);
  await saveWords();
  renderDrawers();
  if(listPageRedraw) listPageRedraw();
}

/* "افزودن" (the home screen's + quick-action) used to open a whole separate add-word form —
   its own fa/definition/example/note fields, its own "✨ پیشنهاد بده" AI-suggest buttons, its
   own save/delete — duplicating almost everything "جزئیات کلمه" (openWordDetailPanel) already
   does, and better: live quick-meaning lookup, دستور زبان/نکات کاربردی/نمونه‌ها tabs, the free
   dictionary, know/learn/ignore. Two separate places to add or edit a word made the two drift
   out of sync with each other. Now this is just the one-field "what's the word?" step, and
   جزئیات کلمه handles everything after that — for both brand-new and already-saved words. */
function openQuickWordEntry(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>افزودن لغت جدید</h2>
        <button class="close-x">✕</button>
      </div>
      <label>کلمه انگلیسی</label>
      <input type="text" class="en" id="qwe-en" placeholder="e.g. resilient">
      <div class="actions" style="margin-top:18px;">
        <button class="btn btn-primary" id="qwe-go">بعدی ←</button>
      </div>
    </div>`;
  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  const input = overlay.querySelector('#qwe-en');
  const go = ()=>{
    const en = input.value.trim();
    if(!en) return;
    overlay.remove();
    openWordDetailPanel({ en, fa:'', example:'' }, {});
  };
  overlay.querySelector('#qwe-go').onclick = go;
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  setTimeout(()=> input.focus(), 30);
}

/* ---------- Word list (its own full page) ---------- */
let selectedIds = new Set();
let selectionMode = false; // turned on by a long-press on any chip; off = tapping opens browse, on = tapping (de)selects
let listPageEl = null;
let listPageRedraw = null;

function openListPage(filterBox){
  listPageEl = document.createElement('div');
  listPageEl.className = 'page-full';
  document.body.appendChild(listPageEl);
  renderListPage(filterBox);
}

function closeListPage(){
  if(listPageEl){ listPageEl.remove(); listPageEl = null; }
  listPageRedraw = null;
}

function renderListPage(filterBox){
  const q = listPageEl.querySelector('#searchInput') ? listPageEl.querySelector('#searchInput').value : '';
  const pageTitle = filterBox===6 ? '🏆 بایگانی مسلط‌شده‌ها' : filterBox ? BOX_LABELS[filterBox] : 'فهرست همه لغات';
  const dueInBox = filterBox && filterBox!==6 ? words.filter(w=>w.box===filterBox && isDue(w)).length : 0;
  listPageEl.innerHTML = `
    <div class="page-top">
      <h2>${pageTitle}</h2>
      <button class="close-x" id="listCloseBtn">✕</button>
    </div>
    <div class="page-body">
      ${dueInBox>0 ? `<button class="btn btn-primary" id="listStartReviewBtn" style="width:100%;justify-content:center;margin-bottom:14px;">▶ شروع مرور این جعبه (${dueInBox} کلمه)</button>` : ''}
      <input type="text" class="search-input" id="searchInput" placeholder="جستجوی لغت..." value="${q||''}">
      <div class="list-hint" id="listHint"></div>
      <div id="selectionBanner"></div>
      <div class="actions" style="margin-bottom:14px;">
        <button class="btn btn-secondary btn-small" id="selectAllBtn">انتخاب همه</button>
      </div>
      <div id="listItems"></div>
      <div class="actions" id="selectionBar" style="margin-top:14px; display:none;">
        <button class="btn btn-primary btn-small" id="exportSelectedBtn">📋 خروجی از انتخاب‌شده‌ها برای هوش مصنوعی</button>
      </div>
    </div>`;

  const lp = sel => listPageEl.querySelector(sel);
  const LONG_PRESS_MS = 500;
  const MOVE_TOLERANCE = 10;

  const draw = ()=>{
    const query = (lp('#searchInput').value||'').toLowerCase();
    let list = words;
    if(filterBox) list = list.filter(w=>w.box===filterBox);
    if(query) list = list.filter(w=> w.en.toLowerCase().includes(query) || w.fa.includes(query));
    list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    const box = lp('#listItems');
    if(list.length===0){
      box.innerHTML = `<div class="empty">هنوز لغتی پیدا نشد.</div>`;
    } else {
      box.innerHTML = list.map(w=>`
        <div class="list-item ${selectedIds.has(w.id)?'selected':''}" data-id="${w.id}">
          ${selectionMode ? `<input type="checkbox" class="li-check" ${selectedIds.has(w.id)?'checked':''} disabled>` : ''}
          <span class="li-word">${escapeHtml(w.en)}</span>
          <span class="li-actions">
            <button class="icon-btn pron-btn" data-pron="${escapeHtml(w.en)}" title="پخش تلفظ">🔊</button>
            <button class="icon-btn" data-edit="${w.id}">✎</button>
          </span>
        </div>`).join('');

      box.querySelectorAll('[data-edit]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.stopPropagation();
          openWordDetailPanel(words.find(w=>w.id===btn.dataset.edit), {editMode:true});
        };
      });
      box.querySelectorAll('[data-pron]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.stopPropagation();
          playPronunciation(btn.dataset.pron, btn);
        };
      });

      const toggleSelect = (id)=>{
        if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
        if(selectedIds.size===0) selectionMode = false; // auto-exit once nothing is selected anymore
        draw();
      };

      box.querySelectorAll('.list-item').forEach(item=>{
        const id = item.dataset.id;
        let timer=null, startX=0, startY=0, longFired=false;
        const clearTimer = ()=>{ if(timer){ clearTimeout(timer); timer=null; } };

        item.addEventListener('pointerdown', (e)=>{
          if(e.target.closest('.icon-btn')) return;
          startX=e.clientX; startY=e.clientY; longFired=false;
          clearTimer();
          timer = setTimeout(()=>{
            longFired = true;
            selectionMode = true;
            if(navigator.vibrate) navigator.vibrate(15);
            toggleSelect(id);
          }, LONG_PRESS_MS);
        });
        item.addEventListener('pointermove', (e)=>{
          if(Math.abs(e.clientX-startX)>MOVE_TOLERANCE || Math.abs(e.clientY-startY)>MOVE_TOLERANCE) clearTimer();
        });
        item.addEventListener('pointerup', (e)=>{
          if(e.target.closest('.icon-btn')) return;
          clearTimer();
          if(longFired) return; // the long-press already toggled selection
          if(selectionMode) toggleSelect(id);
          else{
            const startIdx = list.findIndex(w=>w.id===id);
            startBrowse(list, startIdx);
          }
        });
        item.addEventListener('pointerleave', clearTimer);
        item.addEventListener('pointercancel', clearTimer);
      });
    }

    const hint = lp('#listHint');
    if(hint){
      hint.textContent = selectionMode
        ? ''
        : 'برای مرور یک لغت روی آن بزن؛ برای انتخاب چند لغت، روی یکی از آن‌ها چند لحظه (فشار طولانی) نگه‌دار.';
    }

    const banner = lp('#selectionBanner');
    if(banner){
      banner.innerHTML = selectionMode ? `
        <div class="selection-banner">
          <span>${selectedIds.size} لغت انتخاب شده</span>
          <button class="btn btn-ghost btn-small" id="deselectBtn" style="padding:4px 10px;">✕ لغو انتخاب</button>
        </div>` : '';
      const dsBtn = lp('#deselectBtn');
      if(dsBtn) dsBtn.onclick = ()=>{ selectedIds.clear(); selectionMode = false; draw(); };
    }

    updateSelectionBar();
  };

  function updateSelectionBar(){
    const bar = lp('#selectionBar');
    if(!bar) return;
    bar.style.display = selectedIds.size>0 ? 'flex' : 'none';
    const btn = lp('#exportSelectedBtn');
    if(btn) btn.textContent = `📋 خروجی از ${selectedIds.size} لغت انتخاب‌شده برای هوش مصنوعی`;
  }

  lp('#searchInput').oninput = draw;
  lp('#listCloseBtn').onclick = closeListPage;
  const startReviewBtn = lp('#listStartReviewBtn');
  if(startReviewBtn) startReviewBtn.onclick = ()=> startReview(filterBox);
  lp('#selectAllBtn').onclick = ()=>{
    let list = words;
    if(filterBox) list = list.filter(w=>w.box===filterBox);
    list.forEach(w=> selectedIds.add(w.id));
    selectionMode = selectedIds.size>0;
    draw();
  };
  lp('#exportSelectedBtn').onclick = ()=> openExportPanel(words.filter(w=>selectedIds.has(w.id)));

  listPageRedraw = ()=> renderListPage(filterBox);
  draw();
}

/* ---------- Export selected words as text for pasting into any AI ---------- */
function openExportPanel(selectedWords){
  if(selectedWords.length===0) return;
  const fullText = selectedWords.map(w=>w.en).join(', ');

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>خروجی برای هوش مصنوعی</h2>
        <button class="close-x">✕</button>
      </div>
      <div class="ai-note">فقط خودِ کلمات کپی می‌شود.</div>
      <textarea id="exportText" style="min-height:120px;" readonly>${escapeHtml(fullText)}</textarea>
      <div class="actions" style="margin-top:14px;">
        <button class="btn btn-primary" id="copyExportBtn">📋 کپی متن</button>
      </div>
    </div>`;
  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#copyExportBtn').onclick = async ()=>{
    const ta = overlay.querySelector('#exportText');
    try{
      await navigator.clipboard.writeText(fullText);
      overlay.querySelector('#copyExportBtn').textContent = '✓ کپی شد';
    }catch(e){
      ta.select();
      document.execCommand('copy');
      overlay.querySelector('#copyExportBtn').textContent = '✓ کپی شد';
    }
  };
}

/* ---------- Full backup (download / restore JSON) ---------- */
function downloadBackup(){
  const blob = new Blob([JSON.stringify(words, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `leitner-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const restored = JSON.parse(reader.result);
      if(!Array.isArray(restored)) throw new Error('فرمت فایل معتبر نیست');
      const choice = confirm('برای بازیابی: OK بزن تا لغت‌های فایل به لغت‌های فعلی اضافه شوند (بدون حذف چیزی). برای جایگزینی کامل به‌جای افزودن، Cancel بزن و در پنجره بعدی تایید کن.');
      if(choice){
        const existingIds = new Set(words.map(w=>w.id));
        restored.forEach(w=>{ if(!existingIds.has(w.id)) words.push(w); });
      } else {
        if(confirm('مطمئنی؟ این کار تمام لغت‌های فعلی را با محتوای فایل جایگزین می‌کند و قابل بازگشت نیست.')){
          words = restored;
        } else {
          return;
        }
      }
      await saveWords();
      renderDrawers();
      if(listPageRedraw) listPageRedraw();
      alert('بازیابی با موفقیت انجام شد.');
    }catch(err){
      alert('فایل معتبر نبود یا مشکلی پیش آمد: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Where a full-screen overlay (add-word form, dictionary/AI tools panel, etc.) should be
   appended. Normally document.body, but the Fullscreen API only renders elements inside the
   currently-fullscreen element's subtree — so if e.g. the video sync player is fullscreen and
   the person taps a caption word, the resulting overlay needs to mount inside that same
   fullscreen element or it would be invisible behind the fullscreen video. */
function getOverlayMountEl(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || document.body;
}

/* Turns a small, safe subset of markdown (the kind AI assistants naturally write —
   **bold**, *italic*, `code`, "- " bullet lists, line breaks) into real HTML.
   The input is escaped first, so only the <b>/<i>/<code>/<ul>/<li>/<div>/<br> tags
   this function itself adds ever reach innerHTML — nothing from the AI's text can
   inject markup. */
function inlineMarkdownLite(s){
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/__(.+?)__/g, '<b>$1</b>');
  s = s.replace(/`([^`]+?)`/g, '<code>$1</code>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<i>$2</i>');
  return s;
}
function renderMarkdownLite(raw){
  const escaped = escapeHtml(raw||'');
  const lines = escaped.split('\n');
  let html = '', inList = false;
  for(const line of lines){
    const bulletMatch = line.match(/^\s*[-*]\s+(.+)/);
    if(bulletMatch){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inlineMarkdownLite(bulletMatch[1])}</li>`;
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      html += line.trim()==='' ? '<br>' : `<div>${inlineMarkdownLite(line)}</div>`;
    }
  }
  if(inList) html += '</ul>';
  return html;
}

/* ---------- Unified card view ---------- */
/* Both "today's review" and "free browse" use the exact same fullscreen card UI
   and the exact same logic. The only difference is which words are in the deck
   (due cards only vs. everything) and what happens once a card is graded:
   in review mode a graded card is done for this session and drops out of the
   deck; in browse mode grading just records progress and moves to the next card. */
let deck = [];
let deckIndex = 0;
let deckRevealed = false;
let deckInteracted = false; // true once the user has revealed the meaning or used a tool/AI helper on this card — controls when "نمی‌دانم" appears
let deckExampleText = null;       // shown example sentence for the current card (null = not shown yet)
let deckExampleSource = null;     // 'saved' (pulled from the word's own example/moreExamples) or 'ai'
let deckExampleLoading = false;
let deckExampleError = null;
let deckExampleHistory = [];      // sentences already shown for this card, so nothing repeats
let deckMode = 'browse'; // 'review' | 'browse'
let deckEl = null;
let deckTotalStart = 0; // size of the review queue when the session started (for the progress bar)
let touchStartX = null, touchStartY = null;

function startReview(box){
  const list = words.filter(w => (box ? w.box===box : true) && isDue(w));
  list.sort(()=>Math.random()-0.5);
  if(list.length===0){
    mainEl.dataset.view='review';
    mainEl.innerHTML = `<div class="card empty"><div class="big">🎉</div>مرور این بخش برای الان تمام شده. کارت جدیدی برای نمایش نیست.</div>`;
    return;
  }
  openDeck(list, {mode:'review'});
}

function startBrowse(list, startIndex){
  if(!list){
    // no list passed in -> browse everything, sorted alphabetically
    list = [...words].sort((a,b)=> a.en.localeCompare(b.en));
  }
  if(list.length===0){
    alert('لغتی برای مرور وجود ندارد.');
    return;
  }
  openDeck(list, {mode:'browse', startIndex});
}

function openDeck(list, opts){
  opts = opts || {};
  deck = list;
  deckIndex = (typeof opts.startIndex==='number' && opts.startIndex>=0) ? opts.startIndex : 0;
  deckRevealed = false;
  deckInteracted = false;
  resetDeckExampleState();
  deckMode = opts.mode || 'browse';
  deckTotalStart = list.length;

  deckEl = document.createElement('div');
  deckEl.className = 'browse-full';
  document.body.appendChild(deckEl);
  document.addEventListener('keydown', deckKeyHandler);
  deckEl.addEventListener('touchstart', deckTouchStart, {passive:true});
  deckEl.addEventListener('touchend', deckTouchEnd, {passive:true});
  renderDeckCard();
}

function closeDeck(){
  if(deckEl){ deckEl.remove(); deckEl = null; }
  document.removeEventListener('keydown', deckKeyHandler);
  if(deckMode==='review'){
    renderDrawers();
    if(listPageRedraw) listPageRedraw();
  }
}

function deckKeyHandler(e){
  if(e.key==='Escape') closeDeck();
  else if(e.key==='ArrowRight') deckGo(-1); // RTL: right arrow = previous
  else if(e.key==='ArrowLeft') deckGo(1);
  else if(e.key===' '){ e.preventDefault(); deckRevealed = !deckRevealed; if(deckRevealed){ deckInteracted = true; autoloadDeckExample(currentDeckWord()); } renderDeckCard(); }
}

function deckTouchStart(e){
  if(e.touches.length!==1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}
function deckTouchEnd(e){
  if(touchStartX===null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  touchStartX = null; touchStartY = null;
  if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.5) return; // not a clear horizontal swipe
  // RTL layout: swipe right-to-left = next card, swipe left-to-right = previous card
  if(dx < 0) deckGo(1); else deckGo(-1);
}

function deckGo(dir){
  const next = deckIndex + dir;
  if(next<0 || next>=deck.length) return;
  deckIndex = next;
  deckRevealed = false;
  deckInteracted = false;
  resetDeckExampleState();
  renderDeckCard();
}

function currentDeckWord(){ return deck[deckIndex]; }

function resetDeckExampleState(){
  deckExampleText = null;
  deckExampleSource = null;
  deckExampleLoading = false;
  deckExampleError = null;
  deckExampleHistory = [];
}

/* Examples already available for this word without an AI call — pulled from "نمونه‌ها" (saved on
   the word once that tab has been opened once, see persistExamplesToWord). Deliberately excludes
   the word's own primary `example`, since that's already shown just above this box. Checked
   first, so pressing the button reuses real content before ever spending an AI request. */
function deckExamplePool(w){
  const pool = [];
  if(Array.isArray(w.moreExamples)) w.moreExamples.forEach(e=>{ if(e && e.en && e.en.trim()) pool.push(e.en.trim()); });
  return pool;
}

/* Called right when the meaning gets revealed. If the word already has saved examples
   (moreExamples), show one immediately — no reason to make the user press a button for
   content that's already sitting there. The button stays only for "یکی دیگه" or for
   an AI call when nothing saved exists. */
function autoloadDeckExample(w){
  if(!w || deckExampleText) return;
  const pool = deckExamplePool(w);
  if(pool.length){
    deckExampleText = pool[Math.floor(Math.random()*pool.length)];
    deckExampleSource = 'saved';
    deckExampleError = null;
  }
}

async function deckGrade(passed){
  const w = currentDeckWord();
  if(!w) return;
  if(!w.history) w.history=[];
  w.history.push({date: todayISO(), passed});
  if(passed){
    if(w.box>=5){
      w.box = 6; // mastered/archive
      w.nextReview = null;
    } else {
      w.box += 1;
      w.nextReview = addDays(new Date(), BOX_INTERVALS[w.box]);
    }
  } else {
    w.box = 1;
    w.nextReview = addDays(new Date(), BOX_INTERVALS[1]);
  }
  await saveWords();
  deckRevealed = false;
  deckInteracted = false;
  resetDeckExampleState();

  if(deckMode==='review'){
    // این کارت برای همین نوبت مرور انجام شد، پس دیگر لازم نیست دوباره نشان داده شود
    deck.splice(deckIndex, 1);
    if(deckIndex >= deck.length) deckIndex = Math.max(0, deck.length-1);
    if(deck.length===0){ renderDeckFinished(); return; }
  } else if(deckIndex < deck.length-1){
    deckIndex += 1;
  }
  renderDeckCard();
}

function renderDeckFinished(){
  if(!deckEl) return;
  renderDrawers();
  deckEl.innerHTML = `
    <div class="browse-top">
      <span class="browse-counter">مرور امروز</span>
      <button class="close-x" id="deckCloseBtn">✕</button>
    </div>
    <div class="browse-progress">
      <div class="progress-track"><div class="progress-fill" style="width:100%;"></div></div>
    </div>
    <div class="browse-body">
      <div style="font-size:44px;margin-bottom:10px;">✅</div>
      <div>همه کارت‌های این نوبت مرور شدند. آفرین!</div>
    </div>
    <div class="browse-bottom">
      <button class="btn btn-primary" id="deckFinishBtn">بازگشت</button>
    </div>
  `;
  deckEl.querySelector('#deckCloseBtn').onclick = closeDeck;
  deckEl.querySelector('#deckFinishBtn').onclick = closeDeck;
}

/* Renders just the inside of the #deckAiExampleBox — a small "make me another example" widget
   that only appears once the meaning has been revealed. Not shown before the reveal. */
/* Renders just the inside of the #deckAiExampleBox. Minimal by design: no header until there's
   actually something to label, and the label only says "هوش مصنوعی" when the sentence really
   was AI-generated — reused/saved examples are just shown as a plain example. */
function renderDeckAiExampleContent(){
  if(deckExampleLoading){
    return `<span class="spinner"></span> در حال ساختن مثال...`;
  }
  if(deckExampleText){
    return `
      ${deckExampleSource==='ai' ? `<div class="ai-example-head">🤖 هوش مصنوعی</div>` : ''}
      <span class="ai-example-en">${escapeHtml(deckExampleText)}</span>
      ${deckExampleError ? `<div class="ai-example-error">${escapeHtml(deckExampleError)}</div>` : ''}
      <button class="btn btn-secondary btn-small" id="deckExampleBtn">یکی دیگه</button>
    `;
  }
  return `
    ${deckExampleError ? `<div class="ai-example-error">${escapeHtml(deckExampleError)}</div>` : ''}
    <button class="btn btn-secondary btn-small" id="deckExampleBtn">نمایش یک مثال</button>
  `;
}

function renderDeckCard(){
  if(!deckEl) return;
  const w = currentDeckWord();
  if(!w) return;
  const enQ = encodeURIComponent(w.en);
  const isReview = deckMode==='review';

  const doneCount = isReview ? Math.max(0, deckTotalStart - deck.length) : deckIndex;
  const totalCount = isReview ? Math.max(1, deckTotalStart) : Math.max(1, deck.length);
  const progressPct = Math.round(Math.min(100, (doneCount/totalCount)*100));

  const upcoming = deck.slice(deckIndex+1, deckIndex+4);
  const upcomingHtml = isReview ? (
    upcoming.length
      ? `<div class="browse-upcoming"><span class="up-label">بعدی:</span>${upcoming.map(u=>`<span class="up-word">${escapeHtml(u.en)}</span>`).join('')}</div>`
      : `<div class="browse-upcoming"><span class="up-label">این آخرین لغت این نوبت مرور است</span></div>`
  ) : '';

  deckEl.innerHTML = `
    <div class="browse-top">
      <span class="browse-counter">${isReview ? 'مرور امروز · ' : ''}${w.box===6?'مسلط‌شده':'جعبه '+w.box} · ${deckIndex+1} از ${deck.length}</span>
      <button class="close-x" id="deckCloseBtn">✕</button>
    </div>
    <div class="browse-progress">
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%;"></div></div>
    </div>
    ${upcomingHtml}
    <div class="browse-body">
      <div class="box-tag">${isReview ? 'مرور امروز — طبق زمان‌بندی' : 'مرور آزاد'}</div>
      <div class="word-row">
        <span class="browse-word en">${escapeHtml(w.en)}</span>
        <button class="pron-btn" id="deckPronBtn" title="پخش تلفظ">🔊</button>
        <button class="pron-btn" id="deckToolsBtn" title="دیکشنری و ابزارها">🔗</button>
      </div>
      ${deckRevealed ? `
        <div class="browse-meaning">${escapeHtml(w.fa)}</div>
        ${w.example ? `<div class="browse-examples"><div class="browse-example"><span class="en">${escapeHtml(w.example)}</span></div><div class="ai-example-box" id="deckAiExampleBox">${renderDeckAiExampleContent()}</div></div>` : `<div class="browse-examples"><div class="ai-example-box" id="deckAiExampleBox">${renderDeckAiExampleContent()}</div></div>`}
      ` : `
        <button class="btn btn-secondary" id="deckRevealBtn">نمایش معنی</button>
      `}
      ${deckRevealed ? `<button class="btn btn-ghost btn-small browse-note-toggle" id="deckNoteToggle">📝 یادداشت${w.note?' (دارد)':''}</button>` : ''}
      <div id="deckNoteWrap" style="width:100%;max-width:420px;margin-top:10px;display:none;">
        <textarea id="deckNoteField" placeholder="نکته‌ای برای یادآوری بنویس...">${escapeHtml(w.note||'')}</textarea>
      </div>
    </div>
    <div class="browse-bottom">
      <div class="browse-tools-row">
        <button class="btn btn-secondary" id="deckExplainBtn" style="flex:1;justify-content:center;">📖 توضیح کامل، دیکشنری و هوش مصنوعی</button>
      </div>
      <div class="browse-nav">
        ${deckInteracted ? `<button class="btn" style="background:linear-gradient(180deg,var(--rust),var(--rust-dark));color:#fff8ef;flex:1;justify-content:center;" id="deckFailBtn" title="نمی‌دانم">✗</button>` : ''}
        <button class="btn btn-primary" id="deckPassBtn" title="می‌دانم" style="flex:1;justify-content:center;">✓</button>
      </div>
      <div class="browse-nav">
        <button class="btn btn-secondary" id="deckNextBtn" ${deckIndex>=deck.length-1?'disabled':''}>بعدی ▶</button>
        <button class="btn btn-secondary" id="deckPrevBtn" ${deckIndex===0?'disabled':''}>◀ قبلی</button>
      </div>
    </div>
  `;

  deckEl.querySelector('#deckCloseBtn').onclick = closeDeck;
  deckEl.querySelector('#deckPronBtn').onclick = (e)=> playPronunciation(w.en, e.currentTarget);
  deckEl.querySelector('#deckToolsBtn').onclick = ()=> openBrowseToolsPanel(w);
  const revealBtn = deckEl.querySelector('#deckRevealBtn');
  if(revealBtn) revealBtn.onclick = ()=>{ deckRevealed=true; deckInteracted=true; autoloadDeckExample(w); renderDeckCard(); };

  const noteToggle = deckEl.querySelector('#deckNoteToggle');
  if(noteToggle){
    noteToggle.onclick = ()=>{
      const wrap = deckEl.querySelector('#deckNoteWrap');
      wrap.style.display = wrap.style.display==='none' ? 'block' : 'none';
    };
  }
  const noteField = deckEl.querySelector('#deckNoteField');
  if(noteField){
    noteField.onblur = async ()=>{
      w.note = noteField.value.trim();
      await saveWords();
    };
  }
  const exampleBtn = deckEl.querySelector('#deckExampleBtn');
  if(exampleBtn) exampleBtn.onclick = generateDeckExample;
  deckEl.querySelector('#deckExplainBtn').onclick = ()=>{ deckInteracted=true; renderDeckCard(); openWordDetailPanel(w); };
  deckEl.querySelector('#deckPrevBtn').onclick = ()=> deckGo(-1);
  deckEl.querySelector('#deckNextBtn').onclick = ()=> deckGo(1);
  const passBtn = deckEl.querySelector('#deckPassBtn');
  const failBtn = deckEl.querySelector('#deckFailBtn');
  if(passBtn) passBtn.onclick = ()=> deckGrade(true);
  if(failBtn) failBtn.onclick = ()=> deckGrade(false);
}

/* ---------- Shared AI prompt presets (used by both the built-in assistant and the ChatGPT/Claude links) ---------- */
const AI_PROMPT_PRESETS = [
  { label:{fa:'معنی، تلفظ و یک مثال', en:'Meaning, pronunciation & example'},
    template:{
      fa: w => `لطفاً معنی، تلفظ تقریبی، و یک مثال کوتاه برای کلمه انگلیسی "${w.en}" بده.`,
      en: w => `Please give the meaning, an approximate pronunciation, and a short example sentence for the word "${w.en}".`
    }},
  { label:{fa:'چند مثال بیشتر', en:'More examples'},
    template:{
      fa: w => `چند مثال بیشتر با کلمه "${w.en}" در جمله‌های متفاوت بزن.`,
      en: w => `Give me a few more example sentences using the word "${w.en}" in different contexts.`
    }},
  { label:{fa:'تفاوت با کلمات مشابه', en:'Difference from similar words'},
    template:{
      fa: w => `تفاوت کلمه "${w.en}" را با نزدیک‌ترین هم‌معنی‌هایش با مثال توضیح بده.`,
      en: w => `Explain the difference between "${w.en}" and its closest synonyms, with examples.`
    }},
  { label:{fa:'کاربرد محاوره‌ای و رسمی', en:'Casual vs. formal usage'},
    template:{
      fa: w => `کلمه "${w.en}" را در چه موقعیت‌های محاوره‌ای و رسمی می‌توان به‌کار برد؟ با مثال توضیح بده.`,
      en: w => `In what casual and formal situations can "${w.en}" be used? Explain with examples.`
    }},
  { label:{fa:'ریشه و ترفند یادآوری', en:'Origin & memory trick'},
    template:{
      fa: w => `ریشه یا یک ترفند یادآوری (mnemonic) برای به‌خاطر سپردن کلمه "${w.en}" به فارسی بده.`,
      en: w => `Give me the word origin or a mnemonic trick to help remember "${w.en}".`
    }},
];

function renderPresetOptions(word, lang){
  lang = lang || 'fa';
  return AI_PROMPT_PRESETS.map((p,i)=>`<option value="${i}">${escapeHtml(p.label[lang])}</option>`).join('')
    + `<option value="custom">${lang==='en' ? '— custom text —' : '— متن دلخواه —'}</option>`;
}

/* Renders each preset as a tappable chip (reuses .suggestion-chip styling) instead of a <select>
   option — tapping one asks immediately, no separate confirm step needed. */
function renderPresetChips(word, lang){
  lang = lang || 'fa';
  return AI_PROMPT_PRESETS.map((p,i)=>`<button type="button" class="suggestion-chip" data-preset-idx="${i}">${escapeHtml(p.label[lang])}</button>`).join('');
}

/* Small FA/EN toggle reused everywhere a preset is offered, so the same questions can be asked in either language. */
function renderLangToggle(lang){
  lang = lang || 'fa';
  return `
    <div class="lang-toggle" role="group">
      <button type="button" class="lang-btn ${lang==='fa'?'active':''}" data-lang="fa">فارسی</button>
      <button type="button" class="lang-btn ${lang==='en'?'active':''}" data-lang="en">English</button>
    </div>`;
}

/* Small overlay letting the person pick one of the presets above (rendered for this word) and edit it
   freely before it's actually used — shared by the ChatGPT/Claude quick-open buttons. */
function openPromptComposer(word, opts){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  let lang = 'fa';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${escapeHtml(opts.title)} · <span class="en">${escapeHtml(word.en)}</span></h2>
        <button class="close-x">✕</button>
      </div>
      <label>زبان سوال</label>

  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  const presetSelect = overlay.querySelector('#pcPreset');
  presetSelect.addEventListener('change', (e)=>{
    const v = e.target.value;
    if(v==='custom') return;
    overlay.querySelector('#pcText').value = AI_PROMPT_PRESETS[+v].template[lang](word);

    lang = btn.dataset.lang;
    overlay.querySelector('#pcLangWrap').innerHTML = renderLangToggle(lang);
    presetSelect.innerHTML = renderPresetOptions(word, lang);
    const idx = presetSelect.value==='custom' ? null : +presetSelect.value;
    if(idx!==null) overlay.querySelector('#pcText').value = AI_PROMPT_PRESETS[idx].template[lang](word);
  });
  overlay.querySelector('#pcConfirm').onclick = ()=>{
    const text = overlay.querySelector('#pcText').value.trim();
    if(!text) return;
    opts.onConfirm(text);
    overlay.remove();
  };
}

/* Opens a dictionary/tool link inside a full-screen in-app iframe instead of a new browser tab.
   Note: some sites (Oxford, Collins, Longman, Google, ...) send X-Frame-Options / CSP headers
   that block embedding — in that case the iframe will show blank or refuse to connect. There's
   no reliable cross-origin way to detect this in JS, so we just always show a "باز در تب جدید"
   fallback button in the header the user can tap if a site doesn't load.

   بیاموز/فست‌دیکشنری (the two embeddable sites) were seen to sometimes fail to load on the very
   first attempt in a session and then work fine right after — most likely a cold-start network
   hiccup rather than an actual embedding block, since retrying fixes it. There's no reliable way
   to detect a failed cross-origin iframe load from JS (the 'load' event fires either way), so as
   a pragmatic fix we do one silent automatic reload if 'load' hasn't fired within a few seconds,
   plus always offer a manual 🔄 reload button for anything this heuristic misses. */
function openToolInFrame(url, label){
  const backdrop = document.createElement('div');
  backdrop.className = 'frame-overlay-backdrop';

  const overlay = document.createElement('div');
  overlay.className = 'frame-overlay';
  overlay.innerHTML = `
    <div class="fo-handle"></div>
    <div class="fo-head">
      <button class="fo-btn fo-close">✕</button>
      <div class="fo-title">${escapeHtml(label)}</div>
      <button class="fo-btn fo-expand" title="تمام‌صفحه">⤢</button>
      <button class="fo-btn fo-reload" title="بارگذاری مجدد">🔄</button>
      <button class="fo-btn fo-open-tab">باز در تب جدید ↗</button>
    </div>
    <div class="fo-body">
      <iframe src="${url}" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="fo-hint">اگه این سایت باز نشد، دکمه‌ی 🔄 بالا رو بزن یا از «باز در تب جدید» استفاده کن</div>
    </div>`;
  // Mount inside the current fullscreen element when one is active (e.g. the video player in
  // landscape fullscreen) — anything appended to document.body instead is invisible in that
  // case, since the native Fullscreen API only paints the fullscreen element and its own
  // descendants on top. Every other overlay in the app already does this; this one was missed.
  const mount = getOverlayMountEl();
  mount.appendChild(backdrop);
  mount.appendChild(overlay);

  const iframe = overlay.querySelector('iframe');
  let loaded = false;
  const reload = ()=>{
    loaded = false;
    iframe.src = url + (url.includes('?') ? '&' : '?') + '_r=' + Date.now();
  };
  iframe.addEventListener('load', ()=>{ loaded = true; });
  setTimeout(()=>{ if(!loaded) reload(); }, 3500);

  const close = ()=>{ overlay.remove(); backdrop.remove(); };
  backdrop.onclick = close;
  overlay.querySelector('.fo-close').onclick = close;
  overlay.querySelector('.fo-reload').onclick = reload;
  overlay.querySelector('.fo-open-tab').onclick = ()=> window.open(url, '_blank', 'noopener,noreferrer');
  const expandBtn = overlay.querySelector('.fo-expand');
  expandBtn.onclick = ()=>{
    const expanded = overlay.classList.toggle('fo-expanded');
    expandBtn.textContent = expanded ? '⤡' : '⤢';
    expandBtn.title = expanded ? 'خروج از تمام‌صفحه' : 'تمام‌صفحه';
  };
}

function openBrowseToolsPanel(w){
  const tools = getOrderedEnabledTools();
  const linksHtml = tools.length ? tools.map(t=>{
    if(t.kind==='link'){
      if(t.embeddable){
        return `<button class="link-btn" data-frame-url="${escapeHtml(t.href(w))}" data-frame-label="${escapeHtml(t.label)}"><span class="dot" style="background:${t.color}"></span>${t.label}</button>`;
      }
      return `<a class="link-btn" target="_blank" rel="noopener noreferrer" href="${t.href(w)}"><span class="dot" style="background:${t.color}"></span>${t.label}</a>`;
    }
    return `<button class="link-btn" data-tool-id="${t.id}"><span class="dot" style="background:${t.color}"></span>${t.label}</button>`;
  }).join('') : `<div style="font-size:12.5px;color:var(--ink-soft);">همه‌ی دیکشنری‌ها و ابزارها از تنظیمات غیرفعال شده‌اند. از ⚙ تنظیمات می‌تونی دوباره فعالشون کنی.</div>`;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>دیکشنری و ابزارها · <span class="en">${escapeHtml(w.en)}</span></h2>
        <button class="close-x">✕</button>
      </div>
      <div class="linkrow">${linksHtml}</div>
    </div>`;
  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  overlay.querySelectorAll('[data-tool-id]').forEach(btn=>{
    const t = TOOL_DEFS.find(x=>x.id===btn.dataset.toolId);
    if(t && t.kind==='ai') btn.onclick = ()=> t.open(w);
  });
  overlay.querySelectorAll('[data-frame-url]').forEach(btn=>{
    btn.onclick = ()=> openToolInFrame(btn.dataset.frameUrl, btn.dataset.frameLabel);
  });
}

/* ---------- AI assistant (uses your own free Google Gemini API key) ---------- */
function openAiPanel(word){
  const settings = loadAiSettings();
  const ready = !!(settings.provider==='google' && settings.key);
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>دستیار هوشمند · <span class="en">${escapeHtml(word.en)}</span></h2>
        <button class="close-x">✕</button>
      </div>
      ${!ready ? `<div class="ai-note">هنوز کلید Google Gemini را وارد نکرده‌اید. از دکمه ⚙ تنظیمات بالای صفحه، کلید رایگان خودتان را وارد کنید.</div>` : ''}
      <div id="aiThread"></div>
      ${ready ? `
      <label style="margin-top:12px;">زبان سوال</label>
      <div id="aiLangWrap">${renderLangToggle('fa')}</div>
      <label>یکی از این‌ها را بزن تا خودکار پرسیده شود</label>
      <div class="ai-suggestions" id="aiPresetChips" style="border-top:none;padding-top:0;margin-top:0;margin-bottom:12px;">
        ${renderPresetChips(word, 'fa')}
      </div>
      <label>یا خودت سوالت را بنویس</label>` : ''}
      <textarea id="aiInput" placeholder="مثلاً: چند مثال دیگر با این کلمه بزن / تفاوتش با فلان کلمه چیه؟" ${!ready?'disabled':''}></textarea>
      <div class="actions" style="margin-top:12px;">
        <button class="btn btn-primary" id="aiAskBtn" ${!ready?'disabled':''}>پرسیدن</button>
        ${!ready ? `<button class="btn btn-secondary" id="aiSettingsShortcut">رفتن به تنظیمات</button>` : ''}
      </div>
    </div>`;
  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const shortcutBtn = overlay.querySelector('#aiSettingsShortcut');
  if(shortcutBtn) shortcutBtn.onclick = ()=>{ overlay.remove(); openSettingsPage(); };
  const presetChipsWrap = overlay.querySelector('#aiPresetChips');
  let aiLang = 'fa';
  function wirePresetChips(){
    if(!presetChipsWrap) return;
    presetChipsWrap.querySelectorAll('[data-preset-idx]').forEach(btn=>{
      btn.onclick = ()=> ask(AI_PROMPT_PRESETS[+btn.dataset.presetIdx].template[aiLang](word));
    });
  }
  wirePresetChips();
  if(presetChipsWrap){
    overlay.querySelector('#aiLangWrap').addEventListener('click', (e)=>{
      const btn = e.target.closest('.lang-btn');
      if(!btn) return;
      aiLang = btn.dataset.lang;
      overlay.querySelector('#aiLangWrap').innerHTML = renderLangToggle(aiLang);
      presetChipsWrap.innerHTML = renderPresetChips(word, aiLang);
      wirePresetChips();
    });
  }

  const thread = overlay.querySelector('#aiThread');
  const history = [];
  const meaningNote = word.fa ? ` (معنی: ${word.fa})` : '';
  const masteredCount = words.filter(x=>x.box===6).length;
  const activityNote = `کاربر در مجموع ${words.length} کلمه در برنامه دارد که ${masteredCount} تای آن‌ها را کاملاً مسلط شده (بایگانی کرده). این کلمه («${word.en}») در حال حاضر در جعبه ${word.box===6?'مسلط‌شدگان':word.box+' از ۵'} است، یعنی ${word.box>=4?'کاربر آن را نسبتاً خوب بلد است':'کاربر هنوز در حال یادگیری اولیه این کلمه است'}.`;
  const systemPrompt = `تو یک دستیار آموزش زبان انگلیسی هستی. کاربر ایرانی است و در حال یادگیری کلمه انگلیسی "${word.en}"${meaningNote} است. کاربر ممکن است سوالش را به فارسی یا انگلیسی بپرسد؛ پاسخ را دقیقاً به همان زبانی بده که سوال پرسیده شده، کوتاه، روشن و کاربردی. در صورت نیاز مثال انگلیسی با ترجمه فارسی بیاور. برای تاکید روی نکات مهم می‌توانی از **پررنگ** و برای فهرست کردن نکات از خط تیره («- ») در ابتدای هر خط استفاده کنی؛ از تیتر یا مارک‌داون پیچیده‌تر استفاده نکن.
${activityNote}
پاسخ را همیشه و فقط به‌صورت یک شیء JSON خام (بدون \`\`\`json و بدون هیچ متن اضافه بیرون از آن) با دقیقاً این دو کلید برگردان:
{"answer": "پاسخ اصلی به همان زبان سوال کاربر", "suggestions": ["سوال پیشنهادی کوتاه بعدی ۱", "سوال پیشنهادی کوتاه بعدی ۲", "سوال پیشنهادی کوتاه بعدی ۳"]}
مقدار "suggestions" باید ۲ تا ۳ سوال کوتاه (حداکثر ۸-۱۰ کلمه)، به همان زبان سوال کاربر، متناسب با همین کلمه و با در نظر گرفتن سوال قبلی و وضعیت یادگیری کاربر باشد — نه سوالات کلی و تکراری.`;

  async function callGemini(key){
    const contents = history.map(h=>({ role: h.role==='assistant'?'model':'user', parts:[{text:h.content}] }));
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=' + encodeURIComponent(key);
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction: {parts:[{text: systemPrompt}]},
        generationConfig: { response_mime_type: 'application/json' },
        contents
      })
    });
    if(!res.ok){
      let detail = '';
      try{ const errData = await res.json(); detail = errData.error && errData.error.message ? ' — ' + errData.error.message : ''; }catch(e){}
      throw new Error('HTTP '+res.status+detail);
    }
    const data = await res.json();
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    return (parts ? parts.map(p=>p.text||'').join('\n').trim() : '') || 'پاسخی دریافت نشد.';
  }

  async function ask(customPrompt){
    if(!ready) return;
    const input = overlay.querySelector('#aiInput');
    const userText = customPrompt || input.value.trim();
    if(!userText) return;
    input.value='';
    history.push({role:'user', content:userText});
    thread.innerHTML += `<div class="ai-msg user">${renderMarkdownLite(userText)}</div>`;
    const loadingId = 'ld_'+Date.now();
    thread.innerHTML += `<div class="ai-msg" id="${loadingId}"><span class="spinner"></span> در حال فکر کردن...</div>`;
    thread.scrollTop = thread.scrollHeight;

    try{
      const raw = await callGemini(settings.key);
      let answerText = raw, suggestions = [];
      const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      try{
        const obj = JSON.parse(cleaned);
        if(obj && typeof obj.answer === 'string'){
          answerText = obj.answer;
          if(Array.isArray(obj.suggestions)) suggestions = obj.suggestions.filter(s=>typeof s==='string' && s.trim()).slice(0,3);
        }
      }catch(e){ /* model didn't return valid JSON — just show the raw text, no suggestions */ }

      const suggestionsHtml = suggestions.length ? `
        <div class="ai-suggestions">
          ${suggestions.map(s=>`<button class="suggestion-chip" data-suggest="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
        </div>` : '';
      document.getElementById(loadingId).outerHTML = `<div class="ai-msg">${renderMarkdownLite(answerText)}${suggestionsHtml}</div>`;
      thread.querySelectorAll('[data-suggest]').forEach(btn=>{
        btn.onclick = ()=> ask(btn.dataset.suggest);
      });
      history.push({role:'assistant', content:answerText});
    }catch(e){
      const msg = `درخواست ناموفق بود (${escapeHtml(e.message||'')}). محتمل‌ترین دلیل: نبود دسترسی به این سرویس از ایران بدون فیلترشکن، یا نامعتبر بودن کلید API.`;
      document.getElementById(loadingId).outerHTML = `<div class="ai-msg">${msg}</div>`;
    }
    thread.scrollTop = thread.scrollHeight;
  }

  overlay.querySelector('#aiAskBtn') && (overlay.querySelector('#aiAskBtn').onclick = ()=> ask());
  overlay.querySelector('#aiInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
  });
}

/* Short comma-separated Persian equivalents (not a full sentence) — shown right under the
   headword. Deliberately separate from fetchWordSuggestion()'s single "most common meaning". */
async function fetchQuickMeaningsLine(key, en){
  const systemPrompt = 'تو یک دستیار واژگان زبان انگلیسی برای فارسی‌زبانان هستی. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown) با دقیقاً این کلید برگردان: {"meanings": "۲ تا ۴ معادل فارسی کوتاه و رایج برای این کلمه، پشت‌سرهم و جدا شده با «، » — فقط خود کلمات معادل، نه یک جمله کامل و نه توضیح اضافه"}.';
  const userMessage = `کلمه انگلیسی: "${en}"`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{ return (JSON.parse(cleaned).meanings || '').trim(); }catch(e){ return cleaned; }
}

/* Marks the target word inside a sentence with **word** so the model gets an unambiguous pointer
   to which occurrence is meant (case-insensitive, whole-word match). If the word can't be found
   verbatim in the sentence, it's appended as a fallback note instead of silently failing. */
function markTargetWordInSentence(sentence, word){
  if(!sentence || !word) return sentence || '';
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b(' + escaped + ')\\b', 'i');
  return re.test(sentence) ? sentence.replace(re, '**$1**') : (sentence + ' (کلمه‌ی هدف: **' + word + '**)');
}

/* Explains the word's grammatical role inside a specific real sentence (or a natural fallback
   sentence if none is available), plus a small dictionary-style breakdown: meanings specific to
   that role, and separately, the word's more general meanings across other roles/uses.
   Exposed as a builder (systemPrompt/userMessage) so the exact same wording used for the Gemini
   call can also be reused, unchanged, for the "پرسیدن در ChatGPT" button — `chatSystemPrompt`
   below is only the JSON-output sentence removed (nothing reworded), since asking ChatGPT for a
   raw JSON object just makes its answer confusing to read there. */
function buildFullCardImportPrompt(wordObj, sentence, en, fa, dialogueContext){
  const rawSentence = (sentence || (wordObj && wordObj.example) || '').trim();
  const marked = rawSentence ? markTargetWordInSentence(rawSentence, en) : '';
  const sentenceNote = marked
    ? `جمله‌ی واقعی که این کلمه در آن به‌کار رفته دقیقاً همین است: "${marked}" (کلمه‌ی هدف بین ** ** مشخص شده). همه چیز را بر پایه‌ی همین جمله بگو، نه یک تعریف کلی از دیکشنری.`
    : `جمله‌ی مشخصی برای این کلمه در دسترس نیست؛ یک جمله‌ی رایج و طبیعی برایش در نظر بگیر و بر پایه‌ی همان جمله توضیح بده.`;
  const contextNote = dialogueContext
    ? ` چند خط دیالوگ قبل و بعد از همین جمله هم در پیام کاربر داده می‌شود؛ فقط از آن‌ها برای فهم بهتر لحن/معنی واقعی همان جمله کمک بگیر — پاسخ نهایی همچنان باید فقط درباره‌ی همان جمله‌ی هدف باشد، نه کل دیالوگ.`
    : '';
  const systemPrompt = `تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانانی. زبانت ساده و در سطح یک زبان‌آموز باشد، نه اصطلاحات دانشگاهی یا زبان‌شناسی. ${sentenceNote}${contextNote}

"inContextMeanings": ["۱ تا ۳ معادل فارسی کوتاه مخصوص همین جمله"],

"practicalNotes": "متن نکات کاربردی، به‌صورت متن ساده (نه JSON تو در تو)، با همین قالب: هر عنوان با ** ** پررنگ شود و هر مورد زیرش با خط تیره «- » شروع شود؛ فقط مواردی را بنویس که واقعاً نکته‌ی مفیدی دارند و بقیه را کلاً حذف کن: **ترکیب‌های رایج** (۲ تا ۳ ترکیب پرکاربرد با همین کلمه، هرکدام با معنی فارسی کوتاه)، **اصطلاح‌ها** (اگر این کلمه در یک اصطلاح یا فعل دوکلمه‌ای رایج به‌کار می‌رود، ۱ تا ۳ مورد با معنی فارسی)، **کلمات مشابه** (۲ تا ۳ کلمه‌ی نزدیک‌معنی که معمولاً با این کلمه قاطی می‌شوند، هرکدام با یک تفاوت کوتاه)، **نکته‌ی رایج فارسی‌زبانان** (یک اشتباه معمول که فارسی‌زبانان با این کلمه می‌کنند، اگر چنین چیزی وجود دارد)، **مترادف‌ها** (۲ تا ۴ مترادف نزدیک انگلیسی، جدا شده با «، »)",

  let userMessage = `کلمه انگلیسی: "${en}"${fa ? ` (معنی فارسی: ${fa})` : ''}`;
  if(dialogueContext) userMessage += `\n\nچند خط دیالوگ قبل و بعد (خط علامت‌خورده با >> همان جمله‌ی هدف است):\n${dialogueContext}`;
  return { systemPrompt, userMessage };

/* ---------- Batch "کارت کامل" for every currently-highlighted word ----------
   Same exact card (دستور زبان + نکات کاربردی + نمونه‌ها) buildFullCardImportPrompt asks for one
   word at a time, but for the WHOLE set of words the level-analysis just highlighted, in a single
   copy-prompt/paste-answer round trip — so the person isn't stuck opening each highlighted word
   one by one just to get it ready offline. The instructions are repeated in full for every word
   (nothing is allowed to be shortened/skipped just because there are many of them) and the model
   is explicitly told not to drop or summarize any entry.
   The whole real subtitle text (srtFullLines — same capped/sampled attachment buildSrtWordPrompt
   uses) is attached too, so every card is grounded in the real episode — story, tone, who's
   talking to whom — instead of the model only seeing each word sitting alone in one short
   isolated sentence with no surrounding scene. The per-word marked sentence is kept as a quick
   locator inside that full text, not as the only context the model gets. */
function buildBatchFullCardPrompt(items){
  const MAX_CHARS = 12000;
  let sampleLines = srtFullLines || [];
  if(sampleLines.join('\n').length > MAX_CHARS){
    const approxTargetLines = Math.max(50, Math.floor(MAX_CHARS/40));
    const step = Math.max(1, Math.ceil(sampleLines.length/approxTargetLines));
    sampleLines = sampleLines.filter((_,i)=> i % step === 0);
  }
  let fullText = sampleLines.join('\n');
  if(fullText.length > MAX_CHARS) fullText = fullText.slice(0, MAX_CHARS);
  const hasFullText = !!fullText.trim();

  const list = items.map((it,i)=>{
    const marked = it.example ? markTargetWordInSentence(it.example, it.en) : '';
    return `${i+1}. "${it.en}"${marked ? ` — ${marked}` : ''}`;
  }).join('\n');

  const systemPrompt = `تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانانی. زبانت ساده و در سطح یک زبان‌آموز باشد، نه اصطلاحات دانشگاهی یا زبان‌شناسی.
${hasFullText ? `در پیام کاربر، اول کل متن واقعی زیرنویس یک فیلم/سریال می‌آید و بعد فهرست ${items.length} کلمه‌ی انگلیسی. کل این متن را بخوان تا داستان، لحن، و رابطه‌ی شخصیت‌ها را بفهمی — معنی و توضیح هر کلمه را بر اساس کاربرد واقعی‌اش در همین بافت کامل بساز، نه فقط با نگاه به یک جمله‌ی تک و بی‌زمینه دور و برش.` : `در ادامه فهرست ${items.length} کلمه‌ی انگلیسی می‌آید.`}
برای تک‌تک همه‌ی این ${items.length} کلمه — بدون هیچ استثنا — دقیقاً به همان کامل‌بودن و جزئیاتی که اگر فقط همان یک کلمه از تو خواسته می‌شد می‌نوشتی، یک کارت آموزشی کامل بساز که هر سه بخش زیر را همزمان پوشش بدهد: دستور زبان و معنی در بافت واقعی‌اش، نکات کاربردی، و چند نمونه‌جمله‌ی دیگر. زیاد بودن تعداد کلمات بهانه‌ای برای خلاصه یا کوتاه کردن هیچ‌کدام نیست؛ اگر پاسخ طولانی شود اشکالی ندارد.
فقط و فقط یک آرایه‌ی JSON معتبر و خالص برگردان — بدون Markdown، بدون فنس \`\`\`json، بدون هیچ توضیح قبل یا بعدش، دقیقاً و فقط خودِ آرایه، با دقیقاً ${items.length} عضو، به همان ترتیبی که کلمات داده شدند، هر عضو با این ساختار دقیق:
{
"en": "همان کلمه‌ی انگلیسی، دقیقاً همان‌طور که داده شد",
"paragraph": "۲ تا ۳ جمله‌ی فارسی پیوسته، با زبان ساده و روزمره، که ${hasFullText ? 'بر اساس کاربرد واقعی این کلمه در کل زیرنویس' : 'با توجه به جمله‌ی هدف'} می‌گوید این کلمه دقیقاً چه معنایی دارد. فقط اگر واقعاً نکته‌ی مفیدی هست اضافه کن — مثلاً اگر معنی این کلمه در همین بافت با معنی رایج‌ترش فرق دارد، یا چرا همین کلمه به‌جای یک کلمه‌ی ساده‌تر انتخاب شده؛ وگرنه فقط معنی را کوتاه بگو",
"inContextMeanings": ["۱ تا ۳ معادل فارسی کوتاه مخصوص همین کاربرد"],
"generalMeanings": ["۲ تا ۴ معادل فارسی کوتاه رایج این کلمه به‌طور کلی"],
"practicalNotes": "متن نکات کاربردی، به‌صورت متن ساده (نه JSON تو در تو)، با همین قالب: هر عنوان با ** ** پررنگ شود و هر مورد زیرش با خط تیره «- » شروع شود؛ فقط مواردی را بنویس که واقعاً نکته‌ی مفیدی دارند و بقیه را کلاً حذف کن: **ترکیب‌های رایج** (۲ تا ۳ ترکیب پرکاربرد با همین کلمه، هرکدام با معنی فارسی کوتاه)، **اصطلاح‌ها** (اگر این کلمه در یک اصطلاح یا فعل دوکلمه‌ای رایج به‌کار می‌رود، ۱ تا ۳ مورد با معنی فارسی)، **کلمات مشابه** (۲ تا ۳ کلمه‌ی نزدیک‌معنی که معمولاً با این کلمه قاطی می‌شوند، هرکدام با یک تفاوت کوتاه)، **نکته‌ی رایج فارسی‌زبانان** (یک اشتباه معمول که فارسی‌زبانان با این کلمه می‌کنند، اگر چنین چیزی وجود دارد)، **مترادف‌ها** (۲ تا ۴ مترادف نزدیک انگلیسی، جدا شده با «، »)",
"examples": [{"en": "یک جمله نمونه انگلیسی طبیعی و کوتاه با همین کلمه", "fa": "ترجمه فارسی روان همان جمله"}]
}
در examples هر کلمه دقیقاً ۴ جمله‌ی متفاوت از هم بساز، هرکدام با موقعیت یا زمینه‌ای متفاوت از بقیه، و جمله‌ی واقعی همان کلمه را عیناً تکرار نکن.`;

  const userMessage = (hasFullText ? `متن کامل زیرنویس:\n${fullText}\n\n` : '') + `فهرست ${items.length} کلمه:\n\n${list}`;
  return { systemPrompt, userMessage };
}

/* Same spirit as extractJsonObject above, but for a top-level JSON ARRAY of objects — and, unlike
   a plain JSON.parse, a single malformed object inside the array does NOT fail the whole thing.
   Order of attempts:
     1. Parse the cleaned text as-is — the common case, when the answer is already valid JSON.
     2. Run it through extractJsonObject's whole repair pipeline (fence-stripping, smart quotes,
        trailing commas, unescaped inner quotes) in case the array-as-a-whole just has one of
        those common, fixable syntax issues.
     3. Last resort — and the one that matters most in practice: walk the text and pull out every
        top-level {...} object individually (respecting quoted strings/escapes so a "}" inside a
        string doesn't end an object early), then JSON.parse each one on its own, running the same
        extractJsonObject repair on any individual object that doesn't parse as-is. Any one object
        that's still unreadable after that is simply skipped — a single stray comma or missing
        bracket in one entry no longer means throwing away every other word's already-good answer.
   Returns { items, skipped } — skipped is how many object-shaped chunks were found but couldn't
   be parsed at all, purely for an honest "N ثبت شد، M ناخوانا بود" style message afterward. */
function extractJsonArrayLenient(raw){
  const cleaned = (raw||'').trim().replace(/```json/gi, '```').replace(/```/g, '').trim();
  try{
    const v = JSON.parse(cleaned);
    if(Array.isArray(v)) return { items: v, skipped: 0 };
  }catch(e){ /* keep trying */ }
  try{
    const v = extractJsonObject(cleaned);
    if(Array.isArray(v)) return { items: v, skipped: 0 };
  }catch(e){ /* keep trying */ }

  const chunks = [];
  let depth = 0, start = -1, inStr = false, strCh = '', esc = false;
  for(let i=0;i<cleaned.length;i++){
    const ch = cleaned[i];
    if(inStr){
      if(esc){ esc = false; }
      else if(ch === '\\'){ esc = true; }
      else if(ch === strCh){ inStr = false; }
      continue;
    }
    if(ch === '"' || ch === "'"){ inStr = true; strCh = ch; continue; }
    if(ch === '{'){ if(depth===0) start = i; depth++; continue; }
    if(ch === '}'){
      depth--;
      if(depth===0 && start!==-1){ chunks.push(cleaned.slice(start, i+1)); start = -1; }
      continue;
    }
  }
  if(chunks.length===0) throw new Error('هیچ آبجکتی داخل پاسخ پیدا نشد.');
  const items = [];
  let skipped = 0;
  chunks.forEach(chunk=>{
    try{ items.push(JSON.parse(chunk)); return; }catch(e){ /* try the repair pipeline below */ }
    try{ items.push(extractJsonObject(chunk)); }
    catch(e2){ skipped++; } // this one object is unreadable even after repair attempts — skip it, don't fail the whole batch
  });
  return { items, skipped };
}

/* Grounds the pasted batch answer against the exact word list it was requested for (same idea as
   parseSrtWordResponse elsewhere): anything the model returned for an "en" that wasn't actually
   asked for is silently dropped, and any word with literally nothing usable in its object is
   skipped rather than overwriting existing data with an empty card. Returns { results, skipped } —
   results is a map keyed by lowercased "en" -> { grammar, practicalNotes, moreExamples }, in the
   exact shape persistGrammarToWord/persistExplainToWord/persistExamplesToWord (and vsyncLevelData)
   expect; skipped is how many object-shaped entries in the answer couldn't be read at all (used
   for an honest partial-success message instead of silently dropping them). Uses
   extractJsonArrayLenient so a single malformed entry never throws away the rest of an otherwise
   good batch answer. */
function parseBatchFullCardResponse(raw, items){
  const { items: arr, skipped } = extractJsonArrayLenient(raw);
  if(!Array.isArray(arr) || arr.length===0) throw new Error('پاسخ یک آرایه‌ی JSON نبود یا چیزی داخلش پیدا نشد.');
  const wantedLower = new Set(items.map(it=>it.en.trim().toLowerCase()));
  const results = {};
  arr.forEach(obj=>{
    if(!obj || typeof obj!=='object') return;
    const enKey = (obj.en||'').trim().toLowerCase();
    if(!enKey || !wantedLower.has(enKey)) return; // not one of the words actually requested — discard
    const exList = Array.isArray(obj.examples) ? obj.examples.map(e=>({en:(e.en||'').trim(), fa:(e.fa||'').trim()})).filter(e=>e.en) : [];
    const grammar = {
      paragraph: (obj.paragraph||'').trim(),
      inContextMeanings: Array.isArray(obj.inContextMeanings) ? obj.inContextMeanings.filter(x=>typeof x==='string' && x.trim()) : [],
      generalMeanings: Array.isArray(obj.generalMeanings) ? obj.generalMeanings.filter(x=>typeof x==='string' && x.trim()) : []
    };
    const practicalNotes = (obj.practicalNotes||'').trim();
    if(!grammar.paragraph && !grammar.inContextMeanings.length && !grammar.generalMeanings.length && !practicalNotes && !exList.length) return;
    results[enKey] = { grammar, practicalNotes, moreExamples: exList };
  });
  if(Object.keys(results).length===0) throw new Error('هیچ کلمه‌ی معتبری در پاسخ پیدا نشد.');
  return { results, skipped };
}

/* Writes each word's batch-built card everywhere it needs to be so it's usable offline right
   away, without spending any further AI call:
     - vsyncLevelData (the in-player highlight cache) — persisted automatically by
       saveVsyncLastState(), so it survives closing the app.
     - episodeSuggestions — so pressing the normal "➕ افزودن به فهرست لغات" button afterward
       carries the card straight onto the saved word (see the ep-word-card ➕ handler).
     - the word itself, if it's already saved in `words` — same never-overwrite rule used
       everywhere else in the app (persistGrammarToWord etc.): a card the word already has is
       never clobbered by a fresh batch run.
   Returns how many words actually got a card applied. */
function applyBatchFullCardResults(results){
  let appliedCount = 0;
  let touchedSavedWords = false;
  Object.keys(results).forEach(key=>{
    const r = results[key];
    appliedCount++;
    if(vsyncLevelData[key]){
      vsyncLevelData[key].grammar = r.grammar;
      vsyncLevelData[key].practicalNotes = r.practicalNotes;
      if(r.moreExamples && r.moreExamples.length) vsyncLevelData[key].moreExamples = r.moreExamples;
    }
    const sIdx = episodeSuggestions.findIndex(w=>(w.en||'').trim().toLowerCase()===key);
    if(sIdx>=0){
      episodeSuggestions[sIdx].grammar = r.grammar;
      episodeSuggestions[sIdx].practicalNotes = r.practicalNotes;
      if(r.moreExamples && r.moreExamples.length) episodeSuggestions[sIdx].moreExamples = r.moreExamples;
    }
    const wordEntry = words.find(w=>(w.en||'').trim().toLowerCase()===key);
    if(wordEntry){
      if(!wordEntry.grammar && (r.grammar.paragraph || r.grammar.inContextMeanings.length || r.grammar.generalMeanings.length)){ wordEntry.grammar = r.grammar; touchedSavedWords = true; }
      if(!wordEntry.practicalNotes && r.practicalNotes){ wordEntry.practicalNotes = r.practicalNotes; touchedSavedWords = true; }
      if((!wordEntry.moreExamples || !wordEntry.moreExamples.length) && r.moreExamples && r.moreExamples.length){ wordEntry.moreExamples = r.moreExamples; touchedSavedWords = true; }
    }
  });
  if(touchedSavedWords) saveWords();
  saveVsyncLastState();
  return appliedCount;
}

/* The current highlight set (vsyncLevelWords), resolved back to {en, fa, example} using whatever
   the level-analysis already knows about each word (vsyncLevelData) — this is the exact word list
   the batch full-card panel builds its prompt from. */
function currentHighlightedWordItems(){
  return [...vsyncLevelWords].map(key=>{
    const d = vsyncLevelData[key];
    return { en: (d && d.en) ? d.en : key, fa: (d && d.fa) || '', example: (d && d.example) || '' };
  });
}

/* The "📦 ساخت کارت کامل برای همه‌ی کلمات هایلایت" panel: same copy-prompt/paste-answer pattern as
   renderSrtAnalyzePanel, but for buildBatchFullCardPrompt/parseBatchFullCardResponse above,
   covering every word in `items` (normally the whole current highlight set) in one round trip. */
function renderBatchCardPanel(panelSelector, items){
  const panel = episodePageEl && episodePageEl.querySelector(panelSelector);
  if(!panel) return;
  if(!items || items.length===0){ panel.style.display = 'none'; panel.innerHTML=''; return; }
  panel.style.display = 'block';

  panel.innerHTML = `
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">
      یک درخواست برای کارت کامل (دستور زبان، نکات کاربردی، نمونه‌جمله) هر ${items.length} کلمه‌ی هایلایت‌شده، همه با هم، آماده می‌کند — هیچ‌کدام خلاصه یا حذف نمی‌شود. جواب را که از یک هوش مصنوعی خارجی (ChatGPT یا هر مدل دیگر) گرفتی، همین‌جا پیست کن تا همه‌ی کارت‌ها یک‌جا و آفلاین ذخیره شوند و دیگر لازم نباشد یکی‌یکی این کار را تکرار کنی.
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary btn-small" id="epBatchCardShareBtn">📤 اشتراک‌گذاری / کپی متن درخواست</button>
    </div>
    <div id="epBatchCardCopyMsg" style="display:none;font-size:11.5px;color:var(--ink-soft);margin-top:6px;"></div>
    <textarea id="epBatchCardPromptBox" readonly style="min-height:90px;margin-top:8px;font-size:11.5px;direction:ltr;text-align:left;"></textarea>
    <label style="margin-top:14px;">جواب هوش مصنوعی را اینجا پیست کن</label>
    <textarea id="epBatchCardPasteBox" placeholder="آرایه‌ی JSON پاسخ را اینجا پیست کن..." style="min-height:110px;"></textarea>
    <div class="actions" style="margin-top:8px;">
      <button type="button" class="btn btn-primary btn-small" id="epBatchCardSubmitBtn">✅ ثبت کارت‌ها</button>
      <button type="button" class="btn btn-ghost btn-small" id="epBatchCardCloseBtn">بستن</button>
    </div>
    <div id="epBatchCardErr" class="ai-note" style="display:none;margin-top:8px;"></div>
    <div id="epBatchCardOk" class="ai-note" style="display:none;margin-top:8px;"></div>`;

  panel.querySelector('#epBatchCardShareBtn').onclick = async ()=>{
    const btn = panel.querySelector('#epBatchCardShareBtn');
    const errEl = panel.querySelector('#epBatchCardErr');
    errEl.style.display = 'none';
    btn.disabled = true;
    const origText = btn.textContent;
    btn.textContent = 'در حال آماده‌سازی...';
    try{
      const { systemPrompt, userMessage } = buildBatchFullCardPrompt(items);
      const fullText = systemPrompt + '\n\n' + userMessage;
      const box = panel.querySelector('#epBatchCardPromptBox');
      box.value = fullText;
      const msg = panel.querySelector('#epBatchCardCopyMsg');
      if(navigator.share){
        try{ await navigator.share({ text: fullText }); return; }
        catch(e2){ /* cancelled or failed — fall through to clipboard copy below */ }
      }
      try{
        await navigator.clipboard.writeText(fullText);
        if(msg){ msg.textContent = '✅ کپی شد — برو تو ChatGPT (یا هر هوش مصنوعی دیگه) پیستش کن.'; msg.style.display = 'block'; }
      }catch(e3){
        box.focus();
        box.select();
        if(msg){ msg.textContent = 'کپی خودکار نشد؛ متن بالا انتخاب شد، Ctrl+C رو بزن.'; msg.style.display = 'block'; }
      }
    }catch(e){
      errEl.textContent = e && e.message ? e.message : String(e);
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.textContent = origText;
    }
  };

  panel.querySelector('#epBatchCardSubmitBtn').onclick = ()=>{
    const errEl = panel.querySelector('#epBatchCardErr');
    const okEl = panel.querySelector('#epBatchCardOk');
    errEl.style.display = 'none';
    okEl.style.display = 'none';
    const raw = panel.querySelector('#epBatchCardPasteBox').value;
    try{
      if(!raw.trim()) throw new Error('چیزی پیست نشده');
      const { results, skipped } = parseBatchFullCardResponse(raw, items);
      const count = applyBatchFullCardResults(results);
      const missing = items.length - count - skipped;
      let msg = `✅ کارت کامل ${count} کلمه ذخیره شد — از این به بعد آفلاین هم در دسترس است.`;
      if(skipped>0) msg += ` (${skipped} مورد به‌خاطر یک خرابی نحوی در همون بخش از پاسخ ناخوانا بود و رد شد — بقیه سالم ثبت شدن.)`;
      if(missing>0) msg += ` (${missing} کلمه‌ی دیگه اصلاً توی پاسخ پیدا نشد — شاید نیاز باشه دوباره درخواستش کنی.)`;
      okEl.textContent = msg;
      okEl.style.display = 'block';
      panel.querySelector('#epBatchCardPasteBox').value = '';
    }catch(e){
      errEl.textContent = `پاسخ قابل خواندن نبود: ${escapeHtml(e.message||'')} — مطمئن شو دقیقاً همون خروجی JSON رو (بدون توضیح اضافه‌ی خودت) کپی کردی.`;
      errEl.style.display = 'block';
    }
  };

  const closeBtn = panel.querySelector('#epBatchCardCloseBtn');
  if(closeBtn) closeBtn.onclick = ()=>{ panel.style.display = 'none'; panel.innerHTML=''; };
}

/* Opens the batch full-card panel for the whole current highlight set — used by the standalone
   "📦 ساخت کارت کامل برای هر N کلمه‌ی هایلایت" button (the combined analyze+card button now
   builds cards in the same single prompt/response, via buildCombinedAnalyzeCardPrompt, so it no
   longer needs this second-round-trip panel). */
function openBatchCardPanelForHighlighted(){
  const items = currentHighlightedWordItems();
  if(items.length===0) return;

  const panel = episodePageEl && episodePageEl.querySelector('#epBatchCardPanel');
