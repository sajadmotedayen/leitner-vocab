/* Single merged prompt for the "دستور زبان" tab: one AI call that returns a short free-flowing
   Persian paragraph (the word's precise meaning in this exact sentence, only noting why this
   word was chosen or how its meaning here differs from the common one if that's genuinely
   useful) together with the in-context/general meaning lists for the dictionary-style box below
   it. Used to be two separate prompts + two separate AI calls (one plain-text, one JSON) asking
   for almost the same thing — merged into one JSON call so both the in-app AI and the "پرسیدن در
   ChatGPT" button only need a single round-trip. */
function buildGrammarDictPrompt(en, sentence, dialogueContext){
  const markedSentence = sentence ? markTargetWordInSentence(sentence, en) : '';
  const sentenceNote = markedSentence
    ? `جمله‌ی واقعی که این کلمه در آن به‌کار رفته دقیقاً همین است: "${markedSentence}" (کلمه‌ی هدف بین ** ** مشخص شده است). همه چیز را دقیقاً بر اساس همین جمله بگو، نه یک تعریف کلی از دیکشنری. اگر معنی کلمه در همین جمله با رایج‌ترین معنی‌اش فرق دارد (مثلاً little که معمولاً «کوچک» است ولی گاهی «کمی، تا حدی» معنی می‌دهد)، حتماً همان معنی خاص همین جمله را در inContextMeanings بگذار.`
    : `جمله‌ی مشخصی برای این کلمه در دسترس نیست؛ یک جمله‌ی رایج و طبیعی برای آن در نظر بگیر و بر پایه‌ی همان جمله معنی بده.`;
  const contextNote = dialogueContext
    ? ` علاوه بر این، چند خط دیالوگ قبل و بعد از این جمله هم در ادامه داده می‌شود؛ فقط از آن‌ها برای فهم بهتر لحن و معنی واقعی کمک بگیر، نه برای تغییر تمرکز پاسخ که باید فقط روی همان جمله‌ی هدف باشد.`
    : '';
  const chatSystemPrompt = `تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانانی. زبانت ساده و روزمره باشد، نه اصطلاحات دستور زبان یا زبان‌شناسی. ${sentenceNote}${contextNote}`;
  const jsonInstruction = `
فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown، بدون فنس \`\`\`json، بدون هیچ متن اضافه) با دقیقاً این ساختار برگردان:
{"paragraph": "۲ تا ۳ جمله‌ی فارسی پیوسته که می‌گوید کلمه \\"${en}\\" دقیقاً در همین جمله چه معنایی دارد. فقط اگر واقعاً نکته‌ی مفیدی برای یادگیری هست اضافه کن — مثلاً اگر معنی‌اش با معنی رایج‌ترش فرق دارد، یا چرا همین کلمه به‌جای یک کلمه‌ی ساده‌تر انتخاب شده؛ وگرنه فقط معنی را در همان بافت با یک جمله‌ی کوتاه بگو", "inContextMeanings": ["۱ تا ۳ معادل فارسی کوتاه، مخصوص همین جمله"], "generalMeanings": ["۲ تا ۴ معادل فارسی کوتاه رایج این کلمه در حالت کلی"]}`;
  let userMessage = `کلمه انگلیسی: "${en}"`;
  if(dialogueContext) userMessage += `\n\nچند خط دیالوگ قبل و بعد (خط علامت‌خورده با >> همان جمله‌ی هدف است):\n${dialogueContext}`;
  return { systemPrompt: chatSystemPrompt + jsonInstruction, chatSystemPrompt, userMessage };
}

async function fetchGrammarExplanation(key, en, sentence, dialogueContext){
  const { systemPrompt, userMessage } = buildGrammarDictPrompt(en, sentence, dialogueContext);
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned);
  return {
    paragraph: (obj.paragraph||'').trim(),
    inContextMeanings: Array.isArray(obj.inContextMeanings) ? obj.inContextMeanings.filter(x=>typeof x==='string' && x.trim()) : [],
    generalMeanings: Array.isArray(obj.generalMeanings) ? obj.generalMeanings.filter(x=>typeof x==='string' && x.trim()) : []
  };
}

/* Opens ChatGPT (in a new tab) pre-filled with a prompt — used by the "پرسیدن در ChatGPT" buttons
   in the word-details tabs. `promptParts` is either a single {systemPrompt, userMessage} pair, or
   an array of such pairs (for the "دستور زبان" tab, which makes two separate AI calls) — each
   pair's `chatSystemPrompt` (falling back to `systemPrompt` when there's no JSON to strip) is the
   exact same wording the in-app AI call uses, so the ChatGPT answer stays grounded in the same
   word/sentence/instructions. This button is only an alternate place to see the same analysis —
   it never replaces or removes the in-app output, and never rewords the app's own prompts. */
function openChatGptWithPrompt(promptParts){
  const parts = Array.isArray(promptParts) ? promptParts : [promptParts];
  const text = parts.map(p=>{
    const sys = p.chatSystemPrompt || p.systemPrompt;
    return p.userMessage ? `${sys}\n\n${p.userMessage}` : sys;
  }).join('\n\n---\n\n');
  window.open('https://chatgpt.com/?q=' + encodeURIComponent(text), '_blank', 'noopener,noreferrer');
}

/* Practical, production-focused usage notes — plain markdown-lite text (not JSON), rendered
   through renderMarkdownLite(). Covers 5 things that a dictionary/grammar-role
   explanation doesn't: common collocations, idioms/phrasal verbs, near-synonyms Persian
   speakers mix this word up with, a typical L1-interference mistake, and a short synonym
   list. Fetched automatically the first time the "توضیح" tab opens (no button click needed). */
function buildPracticalNotesPrompt(en, fa, sentence, dialogueContext){
  const contextNote = dialogueContext
    ? ' اگر چند خط دیالوگ قبل و بعد هم داده شده، فقط برای فهم بهتر لحن/سیاق واقعی کلمه در همان صحنه از آن کمک بگیر؛ نکاتت باید همچنان درباره‌ی خودِ کلمه باشد، نه خلاصه‌ی دیالوگ.'
    : '';
  const systemPrompt = `تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. زبانت ساده و در سطح یک زبان‌آموز باشد، نه اصطلاحات تخصصی. درباره‌ی کلمه‌ی انگلیسی داده‌شده، هر کدام از این موارد را فقط اگر واقعاً نکته‌ی مفیدی برای گفتنش داری بنویس؛ هر مورد بی‌فایده را کلاً حذف کن (مجبور نیستی همه را پر کنی). هر عنوان را با ** ** پررنگ کن و زیرش با خط تیره «- » بنویس:
**ترکیب‌های رایج**: ۲ تا ۳ ترکیب پرکاربرد با همین کلمه، هرکدام با معنی فارسی کوتاه.
**اصطلاح‌ها**: اگر این کلمه در یک اصطلاح یا فعل دوکلمه‌ای رایج به‌کار می‌رود، ۱ تا ۳ مورد با معنی فارسی‌شان.
**کلمات مشابه**: ۲ تا ۳ کلمه‌ی نزدیک‌معنی که معمولاً با این کلمه قاطی می‌شوند، هرکدام با یک تفاوت کوتاه.
**نکته‌ی رایج فارسی‌زبانان**: یک اشتباه معمول که فارسی‌زبانان با این کلمه می‌کنند، اگر چنین چیزی وجود دارد.
**مترادف‌ها**: ۲ تا ۴ مترادف نزدیک انگلیسی، جدا شده با «، ».
کوتاه و کاربردی بنویس، بدون مقدمه یا جمع‌بندی، و فقط همین متن را برگردان، بدون JSON و بدون فنس.${contextNote}`;
  let userMessage = `کلمه انگلیسی: "${en}"${fa ? ` (معنی: ${fa})` : ''}${sentence ? `\nجمله‌ای که این کلمه در آن به‌کار رفته: "${sentence}"` : ''}`;
  if(dialogueContext) userMessage += `\n\nچند خط دیالوگ قبل و بعد (خط علامت‌خورده با >> همان جمله‌ی هدف است):\n${dialogueContext}`;
  return { systemPrompt, userMessage };
}

async function fetchPracticalUsageNotes(key, en, fa, sentence, dialogueContext){
  const { systemPrompt, userMessage } = buildPracticalNotesPrompt(en, fa, sentence, dialogueContext);
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  return raw.trim();
}

/* Persian translation of one exact sentence — used for the "نمونه از همین متن" row, so the
   real subtitle/context line the word came from can be shown with its translation. */
async function fetchSentenceTranslation(key, sentence){
  const systemPrompt = 'فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown) با دقیقاً این کلید برگردان: {"translation": "ترجمه فارسی روان و طبیعی جمله‌ی داده‌شده"}.';
  const raw = await geminiOnce(key, systemPrompt, sentence);
  const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{ return (JSON.parse(cleaned).translation || '').trim(); }catch(e){ return ''; }
}

/* A batch of `count` fresh example sentences (with translations) in a single request — used for
   the "نمونه‌های بیشتر" row in the examples tab. `avoid` lists sentences already shown (e.g. the
   real context sentence) so the model doesn't just repeat it. The API-facing systemPrompt is
   built by concatenating the exact original wording (prefix + jsonInstruction + suffix) — nothing
   reworded — so `chatSystemPrompt` (prefix + suffix, no JSON sentence) is just that same text
   with the JSON-format sentence dropped, for a cleaner ChatGPT answer. */
function buildExampleBatchPrompt(en, fa, avoid, count){
  const avoidNote = (avoid && avoid.length)
    ? ` این جمله‌ها را عیناً تکرار نکن: ${avoid.map(s=>'"'+s+'"').join('، ')}.`
    : '';
  const prefix = 'تو یک دستیار یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی.';
  const jsonInstruction = ' فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown) با دقیقاً این ساختار برگردان: {"examples": [{"en": "یک جمله نمونه انگلیسی طبیعی و کوتاه با همین کلمه", "fa": "ترجمه فارسی روان همان جمله"}]}.';
  const suffix = ` دقیقاً ${count} جمله‌ی متفاوت از هم بساز، هرکدام با موقعیت یا زمینه‌ای متفاوت از بقیه.${avoidNote}`;
  const chatSystemPrompt = prefix + suffix;
  const userMessage = `کلمه انگلیسی: "${en}"${fa ? ` (معنی فارسی: ${fa})` : ''}`;
  return { systemPrompt: prefix + jsonInstruction + suffix, chatSystemPrompt, userMessage };
}

async function fetchExampleBatch(key, en, fa, avoid, count){
  const { systemPrompt, userMessage } = buildExampleBatchPrompt(en, fa, avoid, count);
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned);
  return Array.isArray(obj.examples)
    ? obj.examples.map(e=>({ en:(e.en||'').trim(), fa:(e.fa||'').trim() })).filter(e=>e.en)
    : [];
}

/* Checks whether the target word, in this exact sentence, is actually part of an idiom/phrasal
   verb/fixed expression rather than being used on its own — used as a fallback when no locally-
   analyzed idiom already covers the word (see findGroundedIdiomForWord). Grounded against the
   real sentence: the returned phrase must appear verbatim in it, or the result is discarded as a
   likely hallucination rather than shown to the person. */
async function fetchIdiomForWord(key, en, sentence){
  if(!sentence) return null;
  const marked = markTargetWordInSentence(sentence, en);
  const systemPrompt = 'تو یک دستیار زبان انگلیسی برای فارسی‌زبانانی. یک جمله و یک کلمه‌ی هدف در همان جمله (بین ** ** مشخص‌شده) به تو داده می‌شود. بررسی کن آیا این کلمه در همین جمله، بخشی از یک اصطلاح، فعل دوکلمه‌ای/سه‌کلمه‌ای (phrasal verb)، یا عبارت idiomatic رایج انگلیسی است — نه یک کلمه‌ی عادی و مستقل. اگر بله: دقیقاً همان عبارت را عیناً همان‌طور که در جمله آمده (بدون کوچک‌ترین تغییر در املا یا شکل فعل) در فیلد "phrase" بگذار، معنای فارسی کوتاه و رایج در "fa"، و یک توضیح انگلیسی ساده از معنایش در "definition". اگر بخشی از هیچ اصطلاحی نیست، "isIdiom" را false بگذار و بقیه‌ی فیلدها را خالی بگذار — چیزی از خودت اختراع نکن. فقط و فقط یک آبجکت JSON خالص (بدون Markdown) با این ساختار برگردان: {"isIdiom": true, "phrase": "...", "fa": "...", "definition": "..."}';
  const userMessage = `جمله: "${marked}"\nکلمه‌ی هدف که بین ** ** مشخص شده: "${en}"`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  try{
    const obj = JSON.parse(cleaned);
    const phrase = (obj.phrase||'').trim();
    if(!obj.isIdiom || !phrase) return null;
    if(sentence.toLowerCase().indexOf(phrase.toLowerCase())===-1) return null; // not grounded in the real sentence — discard
    return { phrase, fa: (obj.fa||'').trim(), definition: (obj.definition||'').trim() };
  }catch(e){ return null; }
}

/* Looks for an idiom the SRT idiom analysis already found and grounded to a real subtitle line
   (episodeSuggestions, type 'idiom') that both (a) contains the tapped word and (b) actually
   occurs in this exact sentence — free, instant, and already vetted, so it's checked first before
   ever falling back to a live AI call in fetchIdiomForWord. */
function findGroundedIdiomForWord(en, sentence){
  if(!en) return null;
  const enLower = en.trim().toLowerCase();
  const wordRe = new RegExp('\\b' + escapeRegExp(enLower) + '\\b', 'i');
  const hit = episodeSuggestions.find(s=>{
    if(!s || s.type!=='idiom' || !s.en) return false;
    if(!wordRe.test(s.en)) return false;
    if(sentence && s.example) return s.example.toLowerCase().indexOf(s.en.trim().toLowerCase())!==-1
      && sentence.toLowerCase().indexOf(s.en.trim().toLowerCase())!==-1;
    return !sentence; // no sentence to check against — accept on word match alone
  });
  return hit ? { phrase: hit.en, fa: hit.fa || '', definition: hit.definition || '' } : null;
}

/* ---------- Word detail panel — opened either by tapping a word in the synced subtitle caption
   during video playback, or via the "📖 توضیح کامل کلمه" button in the add-word form / review
   deck. `word` is {en, fa?, example?} (fa/example may be missing, e.g. straight from a subtitle
   tap). `contextInfo.sentence`, if given, is the real sentence the word was tapped from — this
   takes priority over word.example as the "real context" used throughout the panel. ---------- */
function openWordDetailPanel(word, contextInfo){
  contextInfo = contextInfo || {};
  const en = (word.en||'').trim();
  if(!en) return;
  const enLower = en.toLowerCase();
  const sentence = (contextInfo.sentence || word.example || '').trim();
  // A few lines of real dialogue before/after `sentence` (only ever available when opened from
  // the video sync player's caption tap) — passed to the grammar/practical-notes prompts as
  // extra context so the meaning can be worked out from the actual scene, not just one isolated
  // line. Doesn't affect `sentence` itself (still the exact line used for marking the target
  // word) or the "نمونه از همین متن" translation.
  const dialogueContext = (contextInfo.context || '').trim();

  const settings = loadAiSettings();
  const ready = !!(settings.provider==='google' && settings.key);

  const freqEntry = srtCandidatesPool.find(c=> c.en===enLower);
  const maxFreq = srtCandidatesPool.length ? Math.max(...srtCandidatesPool.map(c=>c.count)) : 0;

  const wordEntry = words.find(w=> (w.en||'').trim().toLowerCase()===enLower);
  const wordHistory = (wordEntry && Array.isArray(wordEntry.history)) ? wordEntry.history : [];

  const alreadyAdded = words.some(w=> (w.en||'').trim().toLowerCase()===enLower);
  const alreadyKnown = loadWordSet(KNOWN_WORDS_KEY).has(enLower);
  const alreadyIgnored = loadWordSet(IGNORED_WORDS_KEY).has(enLower);

  /* Personal review-history summary — computed once from the word's own `history` entries
     (pushed by deckGrade() on every review). No AI call involved: purely local data, so it
     renders instantly alongside the rest of the header. */
  const historyBlockHtml = (()=>{
    if(!wordEntry) return '';
    const boxLabel = wordEntry.box===6 ? 'مسلط‌شدگان' : `جعبه ${wordEntry.box} از ۵`;
    if(!wordHistory.length){
      return `<div class="wd-history">
        <span class="wd-history-label">تاریخچه‌ی مرور</span>
        <span class="wd-history-detail">هنوز مرور نشده · ${boxLabel}</span>
      </div>`;
    }
    const passed = wordHistory.filter(h=>h.passed).length;
    const failed = wordHistory.length - passed;
    const last = wordHistory[wordHistory.length-1];
    let streak = 0;
    for(let i=wordHistory.length-1;i>=0;i--){ if(wordHistory[i].passed) streak++; else break; }
    const streakNote = streak>1 ? ` · ${streak} بار پشت‌سرهم درست` : '';
    return `<div class="wd-history">
      <span class="wd-history-label">تاریخچه‌ی مرور</span>
      <span class="wd-history-detail">${boxLabel} · ${wordHistory.length} مرور (${passed} درست، ${failed} غلط)${streakNote} · آخرین مرور ${fmtDate(last.date)}${last.passed?'':' (غلط)'}</span>
    </div>`;
  })();

  const state = { quickMeaning: (word.fa||'').trim(), sentenceTranslation:'',
    grammar: (wordEntry && wordEntry.grammar) || word.grammar || null, grammarError:'',
    deepExplain: (wordEntry && wordEntry.practicalNotes) || word.practicalNotes || null, deepExplainError:'',
    moreExamples: (wordEntry && wordEntry.moreExamples && wordEntry.moreExamples.length) ? wordEntry.moreExamples
      : ((word.moreExamples && word.moreExamples.length) ? word.moreExamples : null),
    activeTab:'grammar', idiom: findGroundedIdiomForWord(en, sentence),
    /* Each tab only fires its in-app AI (Gemini) requests the first time it's actually opened —
       not automatically when the panel appears — since every "جزئیات کلمه" open shouldn't cost
       several API calls before the person has even looked at a tab. Quota is the free Gemini
       tier's daily limit. The "دریافت کارت از هوش مصنوعی دیگر" (paste-from-another-AI) option is
       available right on this placeholder too — see renderTabPlaceholder — so a person can get a
       card without ever spending an in-app Gemini call at all.
       If this word was already saved with grammar/practicalNotes/moreExamples from a previous
       session (see addWordToList), the matching tab is marked loaded up front so reopening the
       panel shows the cached answer immediately instead of firing a new AI call for something
       already known. */
    tabLoaded: {
      grammar: !!((wordEntry && wordEntry.grammar) || word.grammar),
      explain: !!((wordEntry && wordEntry.practicalNotes) || word.practicalNotes),
      examples: !!((wordEntry && wordEntry.moreExamples && wordEntry.moreExamples.length) || (word.moreExamples && word.moreExamples.length))
    } };

  /* Builds the "part of an idiom" callout box for whichever idiom (local or AI-checked) was
     found for this word/sentence — kept as a closure so it can reach `words`/`sentence` for the
     already-added check and the add button's example line. */
  const idiomBoxHtml = (idiom)=>{
    if(!idiom || !idiom.phrase) return '';
    const phraseLower = idiom.phrase.trim().toLowerCase();
    const idiomAlreadyAdded = words.some(w=> (w.en||'').trim().toLowerCase()===phraseLower);
    return `<div class="wd-idiom-box">
      <div class="wd-idiom-head">🗣️ این کلمه بخشی از یک اصطلاحه: <span class="wd-idiom-phrase" dir="ltr">${escapeHtml(idiom.phrase)}</span></div>
      ${idiom.fa ? `<div class="wd-idiom-fa">${escapeHtml(idiom.fa)}</div>` : ''}
      ${idiom.definition ? `<div class="wd-idiom-def">${escapeHtml(idiom.definition)}</div>` : ''}
      <button type="button" class="btn btn-secondary btn-small" id="wdIdiomAddBtn" ${idiomAlreadyAdded?'disabled':''}>${idiomAlreadyAdded?'✓ این اصطلاح اضافه شده':'➕ افزودن این اصطلاح به فهرست لغات'}</button>
    </div>`;
  };
  const wireIdiomAddBtn = (container, idiom)=>{
    const btn = container.querySelector('#wdIdiomAddBtn');
    if(!btn) return;
    btn.onclick = async ()=>{
      btn.disabled = true;
      btn.textContent = 'در حال افزودن...';
      await addWordToList(idiom.phrase, idiom.fa || '', sentence, '');
      btn.textContent = '✓ اضافه شد';
    };
  };

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>جزئیات کلمه</h2>
        <button class="close-x">✕</button>
      </div>

          <span class="wd-word" id="wdWordText">${escapeHtml(en)}</span>
          <button type="button" class="wd-speak-btn" id="wdEditWordBtn" title="جستجوی کلمه‌ی دیگر">✏️</button>
          <button type="button" class="wd-speak-btn" id="wdSpeakBtn" title="پخش تلفظ">🔊</button>
        </span>
        <span class="wd-tools-group">
          <button type="button" class="wd-speak-btn wd-letter-btn" id="wdBamoozBtn" style="color:#6a4fb3;" title="بیاموز">B</button>

          <button type="button" class="wd-speak-btn" id="wdAiBtn" title="دستیار هوشمند">🤖</button>
          ${ready ? `<button type="button" class="wd-speak-btn" id="wdFreeDictHeaderBtn" title="دیکشنری آزاد (تعریف کامل، بدون نیاز به هوش مصنوعی)">📕</button>` : ''}
        </span>
      </div>
      <div class="wd-quickmeaning" id="wdQuickMeaning">${state.quickMeaning ? escapeHtml(state.quickMeaning) : (ready ? '<span class="spinner"></span>' : '')}</div>

      <div id="wdIdiomBoxWrap">${idiomBoxHtml(state.idiom)}</div>

      ${freqEntry ? `
      <div class="wd-freq">
        <span class="wd-freq-label">تکرار در این زیرنویس</span>
        <div class="wd-freq-track"><div class="wd-freq-fill" style="width:${maxFreq ? Math.max(6, Math.round(freqEntry.count/maxFreq*100)) : 0}%;"></div></div>
        <span class="wd-freq-count">${freqEntry.count}×</span>
      </div>` : ''}

      ${historyBlockHtml}

      ${!alreadyAdded ? `
      <div class="wd-status-row">
        <button type="button" class="btn btn-secondary btn-small" id="wdKnowBtn" ${alreadyKnown?'disabled':''}>${alreadyKnown?'✓ بلد بودی':'✓ بلدم'}</button>
        <button type="button" class="btn btn-primary btn-small" id="wdLearnBtn" ${alreadyAdded?'disabled':''}>${alreadyAdded?'📖 اضافه شده':'📖 یاد بگیر'}</button>
        <button type="button" class="btn btn-ghost btn-small" id="wdIgnoreBtn" ${alreadyIgnored?'disabled':''}>${alreadyIgnored?'🚫 نادیده گرفته شد':'🚫 نادیده بگیر'}</button>
      </div>` : `
      <div id="wdSavedExampleWrap">${wordEntry && wordEntry.example ? `
      <div class="wd-example-block">
        <div class="wd-example-src">جمله ذخیره‌شده</div>
        <div class="wd-example-en"><span class="en">${escapeHtml(wordEntry.example)}</span></div>
      </div>` : ''}</div>
      <div class="wd-status-row">
        <button type="button" class="btn btn-secondary btn-small" id="wdEditManualBtn">✏️ ویرایش دستی</button>
        <button type="button" class="btn btn-danger btn-small" id="wdDeleteBtn">🗑 حذف لغت</button>
      </div>
      <div id="wdManualEditWrap" style="display:none;"></div>
      `}

      ${ready ? `<div id="wdFreeDictHeaderWrap"></div>` : ''}

      ${!ready ? `<div class="ai-note">هنوز کلید Google Gemini را وارد نکرده‌اید. از دکمه ⚙ تنظیمات بالای صفحه، کلید رایگان خودتان را وارد کنید.</div><div id="wdFreeDictWrap"></div>` : `
      <div class="ep-type-filter-row" id="wdTabsRow">
        <div class="ep-type-filter-btn active" data-tab="grammar">دستور زبان</div>
        <div class="ep-type-filter-btn" data-tab="explain">نکات کاربردی</div>
        <div class="ep-type-filter-btn" data-tab="examples">نمونه‌ها</div>
      </div>
      <div id="wdTabContent"></div>
      `}
    </div>`;
  getOverlayMountEl().appendChild(overlay);
  overlay.querySelector('.close-x').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  /* "✏️" turns the word into an editable field in place — for when the person opens a word's
     details but actually wants to look up a different one, without closing this panel and
     hunting it down elsewhere. Confirming (Enter / losing focus) with a new, non-empty word
     closes this panel and opens a fresh one for that word, as a plain manual lookup (no saved
     fa/example — those get filled in the same way any newly-looked-up word's would). */
  overlay.querySelector('#wdEditWordBtn').onclick = ()=>{
    const wordEl = overlay.querySelector('#wdWordText');
    if(!wordEl || wordEl.tagName==='INPUT') return;
    wordEl.outerHTML = `<input type="text" id="wdWordText" class="en" value="${escapeHtml(en)}" style="width:auto; min-width:110px; max-width:220px; font-family:'Lora',serif; font-weight:700; font-size:22px; padding:4px 8px;">`;
    const input = overlay.querySelector('#wdWordText');
    input.focus();
    input.select();
    const revert = ()=>{ input.outerHTML = `<span class="wd-word" id="wdWordText">${escapeHtml(en)}</span>`; };
    const commit = ()=>{
      const val = input.value.trim();
      if(val && val.toLowerCase()!==enLower){
        overlay.remove();
        openWordDetailPanel({ en: val, fa:'', example:'' }, {});
      }else{
        revert();
      }
    };
    input.onkeydown = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); commit(); }
      else if(e.key==='Escape'){ e.preventDefault(); revert(); }
    };
    input.onblur = commit;
  };

  overlay.querySelector('#wdSpeakBtn').onclick = (e)=> speakText(en, e.currentTarget);
  overlay.querySelector('#wdToolsBtn').onclick = ()=> openBrowseToolsPanel({ en, fa: state.quickMeaning||word.fa||'', example: sentence });
  overlay.querySelector('#wdAiBtn').onclick = ()=> openAiPanel({ en, fa: state.quickMeaning||word.fa||'', example: sentence });

  /* Quick-dictionary row: same two embeddable sites available from the full "دیکشنری و ابزارها"
     panel, just one tap away right under the AI's quick meaning — for the common case of
     wanting a second, human-written Persian meaning fast without opening the full tool list. */
  overlay.querySelector('#wdBamoozBtn').onclick = ()=> openToolInFrame(bamoozUrl(en), 'بیاموز');
  overlay.querySelector('#wdFastdicBtn').onclick = ()=> openToolInFrame(fastdicUrl(en), 'فست دیکشنری');

  /* "📕" in the header — lets the free dictionary's full entry (all definitions/examples/
     synonyms) be pulled up directly, any time, with one tap. Previously this full box only ever
     appeared as a fallback after the in-app AI (grammar/practical-notes) call failed; now it's
     reachable on its own regardless of whether the AI call has been made or has succeeded. Toggles
     open/closed so tapping again collapses it instead of re-fetching (the lookup itself is cached
     anyway, see freeDictionaryEntryCache). */
  const fdHeaderBtn = overlay.querySelector('#wdFreeDictHeaderBtn');
  if(fdHeaderBtn){
    fdHeaderBtn.onclick = ()=>{
      const wrap = overlay.querySelector('#wdFreeDictHeaderWrap');
      if(!wrap) return;
      if(wrap.childElementCount){
        wrap.innerHTML = '';
      }else{
        mountFreeDictionaryFallback(wrap, en);
      }
    };
  }

  if(state.idiom){
    wireIdiomAddBtn(overlay, state.idiom);
  }else if(ready && sentence){
    // No idiom already grounded from the SRT idiom analysis — ask the AI whether this word, in
    // this exact sentence, is actually part of one. Silent no-op on failure/negative: this is a
    // nice-to-have, not something that should ever block or clutter the rest of the panel.
    (async ()=>{
      try{
        const found = await fetchIdiomForWord(settings.key, en, sentence);
        if(found){
          state.idiom = found;
          const wrap = overlay.querySelector('#wdIdiomBoxWrap');
          if(wrap){ wrap.innerHTML = idiomBoxHtml(found); wireIdiomAddBtn(overlay, found); }
        }
      }catch(e){ /* idiom check is best-effort */ }
    })();
  }

  const knowBtn = overlay.querySelector('#wdKnowBtn');
  const learnBtn = overlay.querySelector('#wdLearnBtn');
  const ignoreBtn = overlay.querySelector('#wdIgnoreBtn');

  if(knowBtn) knowBtn.onclick = ()=>{
    markWordKnown(en);
    knowBtn.disabled = true;
    knowBtn.textContent = '✓ بلد بودی';
  };
  if(ignoreBtn) ignoreBtn.onclick = ()=>{
    markWordIgnored(en);
    ignoreBtn.disabled = true;
    ignoreBtn.textContent = '🚫 نادیده گرفته شد';
  };
  if(learnBtn) learnBtn.onclick = async ()=>{
    learnBtn.disabled = true;
    learnBtn.textContent = 'در حال افزودن...';
    await addWordToList(en, state.quickMeaning || '', sentence, '', {
      grammar: state.grammar || null,
      practicalNotes: state.deepExplain || '',
      moreExamples: state.moreExamples || null
    });
    learnBtn.textContent = state.quickMeaning ? '✓ اضافه شد' : '✓ اضافه شد (بدون معنی، بعداً کامل کن)';
  };

  /* --- Manual edit / delete, for words already saved in the list — merges what used to be a
     separate "ویرایش لغت" form into this same panel, so editing an already-added word and
     looking up a brand-new one from the subtitle player feel like the same place, not two
     different screens. --- */
  if(alreadyAdded && wordEntry){
    const editManualBtn = overlay.querySelector('#wdEditManualBtn');
    const deleteBtn = overlay.querySelector('#wdDeleteBtn');
    const manualWrap = overlay.querySelector('#wdManualEditWrap');

    let manualCachedSuggestion = null;

    async function getManualSuggestion(){
      if(manualCachedSuggestion) return manualCachedSuggestion;
      if(!(settings.provider==='google' && settings.key)) throw new Error('NO_KEY');
      manualCachedSuggestion = await fetchWordSuggestion(settings.key, en);
      return manualCachedSuggestion;
    }
    function renderManualSuggestBox(boxEl, text, onAccept){
      if(!text){ boxEl.innerHTML = `<div class="suggest-box">پیشنهادی دریافت نشد. دوباره تلاش کن.</div>`; return; }
      boxEl.innerHTML = `
        <div class="suggest-box">
          <div class="suggest-text"><span class="en">${escapeHtml(text)}</span></div>
          <div class="suggest-actions">
            <button type="button" class="btn btn-primary btn-small" id="${boxEl.id}-accept">✓ استفاده از این پیشنهاد</button>
            <button type="button" class="btn btn-ghost btn-small" id="${boxEl.id}-dismiss">✕ رد کردن</button>
          </div>
        </div>`;
      boxEl.querySelector(`#${boxEl.id}-accept`).onclick = ()=>{ onAccept(text); boxEl.innerHTML=''; };
      boxEl.querySelector(`#${boxEl.id}-dismiss`).onclick = ()=>{ boxEl.innerHTML=''; };
    }
    async function handleManualSuggestClick(kind, triggerBtn, boxEl, targetInput){
      const original = triggerBtn.textContent;
      triggerBtn.disabled = true;
      triggerBtn.innerHTML = `<span class="spinner"></span> در حال دریافت...`;
      boxEl.innerHTML = '';
      try{
        const suggestion = await getManualSuggestion();
        const text = kind==='fa' ? suggestion.meaning : suggestion.example;
        renderManualSuggestBox(boxEl, text, (accepted)=>{ targetInput.value = accepted; });
      }catch(e){
        if(e.message==='NO_KEY'){
          boxEl.innerHTML = `<div class="suggest-box">هنوز کلید Google Gemini را وارد نکرده‌اید. از دکمه ⚙ تنظیمات بالای صفحه، کلید رایگان خودتان را وارد کنید.</div>`;
        }else{
          boxEl.innerHTML = `<div class="suggest-box">درخواست ناموفق بود (${escapeHtml(e.message||'')}).</div>`;
        }
      }finally{
        triggerBtn.disabled = false;
        triggerBtn.textContent = original;
      }
    }

    function renderManualEditForm(){
      manualWrap.innerHTML = `
        <div class="field-label-row" style="margin-top:10px;">
          <label>معنی فارسی</label>
          <button type="button" class="suggest-trigger" id="wdMeFaSuggest">✨ پیشنهاد بده</button>
        </div>
        <input type="text" id="wdMeFa" value="${escapeHtml(wordEntry.fa||'')}">
        <div id="wdMeFaSuggestBox"></div>

        <div class="field-label-row">
          <label>جمله نمونه (اختیاری)</label>
          <button type="button" class="suggest-trigger" id="wdMeExSuggest">✨ پیشنهاد بده</button>
        </div>
        <textarea class="en" id="wdMeEx">${escapeHtml(wordEntry.example||'')}</textarea>
        <div id="wdMeExSuggestBox"></div>

        <label>یادداشت شخصی (اختیاری)</label>
        <textarea id="wdMeNote">${escapeHtml(wordEntry.note||'')}</textarea>

        <div class="actions" style="margin-top:14px;">
          <button class="btn btn-primary" id="wdMeSaveBtn">ذخیره تغییرات</button>
          <button class="btn btn-ghost" id="wdMeCancelBtn">انصراف</button>
        </div>
      `;
      const faInput = manualWrap.querySelector('#wdMeFa');
      const exInput = manualWrap.querySelector('#wdMeEx');
      const noteInput = manualWrap.querySelector('#wdMeNote');
      manualWrap.querySelector('#wdMeFaSuggest').onclick = ()=> handleManualSuggestClick('fa', manualWrap.querySelector('#wdMeFaSuggest'), manualWrap.querySelector('#wdMeFaSuggestBox'), faInput);
      manualWrap.querySelector('#wdMeExSuggest').onclick = ()=> handleManualSuggestClick('example', manualWrap.querySelector('#wdMeExSuggest'), manualWrap.querySelector('#wdMeExSuggestBox'), exInput);
      manualWrap.querySelector('#wdMeCancelBtn').onclick = ()=>{ manualWrap.style.display='none'; manualWrap.innerHTML=''; };
      manualWrap.querySelector('#wdMeSaveBtn').onclick = async ()=>{
        const fa = faInput.value.trim();
        if(!fa){ alert('لطفاً معنی فارسی را وارد کنید.'); return; }
        wordEntry.fa = fa;
        wordEntry.example = exInput.value.trim();
        wordEntry.note = noteInput.value.trim();
        await saveWords();
        renderDrawers();
        if(listPageRedraw) listPageRedraw();
        state.quickMeaning = fa;
        const qmEl = overlay.querySelector('#wdQuickMeaning');
        if(qmEl) qmEl.innerHTML = escapeHtml(fa);
        const exWrap = overlay.querySelector('#wdSavedExampleWrap');
        if(exWrap){
          exWrap.innerHTML = wordEntry.example ? `
          <div class="wd-example-block">
            <div class="wd-example-src">جمله ذخیره‌شده</div>
            <div class="wd-example-en"><span class="en">${escapeHtml(wordEntry.example)}</span></div>
          </div>` : '';
        }
        manualWrap.style.display='none';
        manualWrap.innerHTML='';
      };
    }

    editManualBtn.onclick = ()=>{
      if(manualWrap.style.display==='none'){
        manualWrap.style.display='block';
        renderManualEditForm();
      }else{
        manualWrap.style.display='none';
        manualWrap.innerHTML='';
      }
    };
    if(contextInfo.editMode){ manualWrap.style.display='block'; renderManualEditForm(); }

    deleteBtn.onclick = async ()=>{
      if(confirm('این لغت حذف شود؟')){
        words = words.filter(w=>w.id!==wordEntry.id);
        await saveWords();
        overlay.remove();
        renderDrawers();
        if(listPageRedraw) listPageRedraw();
      }
    };
  }

  if(!ready){
    if(word.fa){
      const qmEl = overlay.querySelector('#wdQuickMeaning');
      if(qmEl) qmEl.textContent = word.fa;
    }
    mountFreeDictionaryFallback(overlay.querySelector('#wdFreeDictWrap'), en);
    return; // no AI key — quick meaning falls back to whatever fa was already given, no tabs
  }

  /* Quick meaning line, shown at the top of the panel. By default this now auto-loads a short
     line straight from the free dictionary (no AI call, no key needed) — the AI (Gemini) quick
     meaning is only ever fetched if the person explicitly asks for it via the 🤖 button, never
     automatically. If they do ask and it fails (network/quota/filtering issues), they can retry
     the same AI call, or type the meaning in by hand (e.g. copied from ChatGPT or a dictionary)
     to unlock the "یاد بگیر" button themselves. */
  function renderQuickMeaningFailure(){
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(!qmEl) return;
    qmEl.innerHTML = `
      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <input type="text" id="wdQmManualInput" placeholder="معنی فارسی رو خودت وارد کن..." style="flex:1 1 140px; min-width:120px; width:auto;">        <button type="button" class="btn btn-secondary btn-small" id="wdQmRetryBtn">🔄 تلاش دوباره</button>
      </div>
      <div class="wd-freedict-loadbtn-row"><button type="button" class="btn btn-ghost btn-small" id="wdQmFreeDictBtn">📕 نمایش تعریف از دیکشنری آزاد</button></div>
      <div id="wdQmFreeDictWrap"></div>`;
    const input = qmEl.querySelector('#wdQmManualInput');
    input.oninput = ()=>{
      state.quickMeaning = input.value.trim();
    };
    qmEl.querySelector('#wdQmRetryBtn').onclick = async ()=>{
      qmEl.innerHTML = '<span class="spinner"></span>';
      try{ state.quickMeaning = (await fetchQuickMeaningsLine(settings.key, en)) || ''; }catch(e){ state.quickMeaning = ''; }
      if(state.quickMeaning){
        qmEl.innerHTML = escapeHtml(state.quickMeaning);
        if(!alreadyAdded) learnBtn.disabled = false;
      }else{
        renderQuickMeaningFailure();
      }
    };
    const fdBtn = qmEl.querySelector('#wdQmFreeDictBtn');
    fdBtn.onclick = ()=>{
      fdBtn.disabled = true;
      mountFreeDictionaryFallback(qmEl.querySelector('#wdQmFreeDictWrap'), en);
    };
  }

  /* Fetches the AI (Gemini) quick meaning — only ever called on demand, from the 🤖 button below,
     never automatically. On success it replaces the quick-meaning line and unlocks "یاد بگیر";
     on failure it hands off to the manual/retry/free-dictionary fallback above. */
  async function loadAiQuickMeaning(){
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(qmEl) qmEl.innerHTML = '<span class="spinner"></span>';
    try{ state.quickMeaning = (await fetchQuickMeaningsLine(settings.key, en)) || ''; }catch(e){ state.quickMeaning = ''; }
    if(state.quickMeaning){
      if(qmEl) qmEl.innerHTML = escapeHtml(state.quickMeaning);
      if(!alreadyAdded) learnBtn.disabled = false;
    }else{
      renderQuickMeaningFailure();
    }
  }

  /* A short one-line summary pulled from the free-dictionary entry (e.g. "a place for learning ·
     to instruct or guide") — up to 2 senses. This is the English source text; it gets translated
     to Persian below (via TranslateAPI.ai, if configured) before being shown/used as the actual
     quick meaning. */
  function quickFreeDictLine(entry){
    if(!entry || !entry.groups.length) return '';
    return entry.groups.slice(0,2).map(g=> g.definitions[0] ? g.definitions[0].definition : '').filter(Boolean).join(' · ');
  }

  /* Default state when there's no saved/given meaning yet: auto-loads a line from the free
     dictionary (no key, no quota) and, if a TranslateAPI.ai key is configured, translates it to
     Persian right away — that translated text becomes the real quick meaning (state.quickMeaning),
     unlocking "یاد بگیر" automatically, with no Gemini call involved. If no translation key is
     configured (or the translation fails), the English line is shown on its own instead — still
     useful context, just not a Persian meaning. Either way, a 🤖 button stays available for
     whoever wants the AI's own Persian meaning instead — that call only happens if it's pressed. */
  function renderQuickMeaningFreeDictDefault(){
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(!qmEl) return;
    qmEl.innerHTML = `
      <div class="wd-qm-freedict-row">
        <span id="wdQmFreeDictLine" class="wd-qm-freedict-line"><span class="spinner"></span></span>
        <button type="button" class="btn btn-ghost btn-small" id="wdQmAiBtn">🤖 معنی با هوش مصنوعی</button>
      </div>`;
    qmEl.querySelector('#wdQmAiBtn').onclick = ()=> loadAiQuickMeaning();
    fetchFreeDictionaryLookup(en).then(async entry=>{
      const lineEl = qmEl.querySelector('#wdQmFreeDictLine');
      if(!lineEl) return;
      const line = quickFreeDictLine(entry);
      if(!line){
        lineEl.textContent = 'در دیکشنری آزاد پیدا نشد';
        lineEl.dir = 'rtl';
        return;
      }
      let fa = null;
      try{ fa = await translateToFa(line); }catch(e){ fa = null; }
      if(!lineEl.isConnected) return;
      if(fa){
        state.quickMeaning = fa;
        lineEl.textContent = fa;
        lineEl.dir = 'rtl';
        if(!alreadyAdded) learnBtn.disabled = false;
      }else{
        lineEl.textContent = line;
        lineEl.dir = 'ltr';
      }
    }).catch(()=>{
      const lineEl = qmEl.querySelector('#wdQmFreeDictLine');
      if(lineEl) lineEl.textContent = 'دریافت از دیکشنری آزاد ناموفق بود';
    });
  }

  if(state.quickMeaning){
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(qmEl) qmEl.innerHTML = escapeHtml(state.quickMeaning);
    if(!alreadyAdded) learnBtn.disabled = false;
  }else{
    renderQuickMeaningFreeDictDefault();
  }

  /* ---------- Tabs ---------- */
  const tabsRow = overlay.querySelector('#wdTabsRow');
  const tabContent = overlay.querySelector('#wdTabContent');

  const TAB_LABELS = { grammar:'دستور زبان', explain:'نکات کاربردی', examples:'نمونه‌ها' };

  /* Same {systemPrompt, userMessage} each tab would eventually build for its own in-app AI
     call — extracted here so the placeholder (shown before the person has loaded the tab and
     spent an in-app AI request) can offer the exact same "پرسیدن در ChatGPT" shortcut, not just
     the loaded tab content. */
  function getPromptPartsForTab(tab){
    if(tab==='grammar') return buildGrammarDictPrompt(en, sentence, dialogueContext);
    if(tab==='explain') return buildPracticalNotesPrompt(en, state.quickMeaning, sentence, dialogueContext);
    return buildExampleBatchPrompt(en, state.quickMeaning, sentence ? [sentence] : [], 4);
  }

  function renderTabPlaceholder(){
    const tab = state.activeTab;
    const importCfg = getImportConfigForTab(tab);
    tabContent.innerHTML = `
      <div class="wd-tab-placeholder">
        <button type="button" class="btn btn-secondary btn-small" id="wdLoadTabBtn">📥 نمایش ${TAB_LABELS[tab]}</button>
        ${chatGptButtonHtml('wdPlaceholderChatGptBtn')}
        ${importCardRowHtml('wdPlaceholderImport')}
      </div>`;
    tabContent.querySelector('#wdLoadTabBtn').onclick = ()=>{
      state.tabLoaded[state.activeTab] = true;
      renderTab();
    };
    wireChatGptButton('wdPlaceholderChatGptBtn', ()=> getPromptPartsForTab(tab));
    // Same paste-from-another-AI shortcut the loaded tab offers, but available right here —
    // no need to spend an in-app Gemini call first just to reach it.
    wireImportCardRow('wdPlaceholderImport', importCfg.promptParts, importCfg.parseAnswer, ()=>{
      state.tabLoaded[tab] = true;
      importCfg.renderFn();
    });
  }

  function renderTab(){
    if(!state.tabLoaded[state.activeTab]){ renderTabPlaceholder(); return; }
    if(state.activeTab==='grammar') renderGrammarTab();
    else if(state.activeTab==='explain') renderExplainTab();
    else renderExamplesTab();
  }

  /* One "پرسیدن در ChatGPT" button, reused on all three tabs — opens ChatGPT with the exact same
     {systemPrompt, userMessage} the in-app AI call for that tab uses (via `getPromptParts`), so
     the ChatGPT answer is the same analysis, just viewed on chatgpt.com. Never touches or hides
     the in-app result; it's purely an alternate way to see the same thing. */
  function chatGptButtonHtml(id){
    return `<div class="wd-chatgpt-row" style="margin-top:12px;"><button type="button" class="btn btn-secondary btn-small" id="${id}" style="border-color:#10a37f;color:#10a37f;">💬 پرسیدن در ChatGPT</button></div>`;
  }
  function wireChatGptButton(id, getPromptParts){
    const btn = tabContent.querySelector('#'+id);
    if(btn) btn.onclick = ()=> openChatGptWithPrompt(getPromptParts());
  }

  /* "دریافت کارت از هوش مصنوعی دیگر" — for when the in-app AI (Gemini) is unavailable, rate-
     limited, or blocked (e.g. no VPN access from Iran): opens ChatGPT pre-filled with a prompt
     that asks for the exact JSON/text shape this tab needs, then lets the person paste ChatGPT's
     answer back in and renders it as the exact same card the in-app AI would have produced.
     `parseAnswer(rawText)` must apply the parsed/validated result to `state` itself (it runs
     inside a try/catch — throwing shows a friendly error instead of a blank card) and return
     nothing; `rerender` is called after a successful import to redraw the tab. */
  function importCardRowHtml(id){
    return `
      <div class="wd-chatgpt-row" style="margin-top:8px;">
        <button type="button" class="btn btn-secondary btn-small" id="${id}-open" style="border-color:#c15f3c;color:#c15f3c;">🗂 دریافت کارت کامل از هوش مصنوعی دیگر</button>
      </div>
      <div id="${id}-panel" style="display:none;margin-top:10px;">
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;">جواب هوش مصنوعی (ChatGPT یا هر مدل دیگه) رو کامل و بدون تغییر کپی کن و اینجا پیست کن — با یک پیست، هر سه تب (دستور زبان، نکات کاربردی، نمونه‌ها) پر می‌شه</div>
        <textarea id="${id}-text" placeholder="پاسخ رو اینجا پیست کن..." style="min-height:90px;"></textarea>
        <div class="actions" style="margin-top:8px;">
          <button type="button" class="btn btn-primary btn-small" id="${id}-submit">✅ ثبت و ساخت کارت</button>
        </div>
        <div id="${id}-err" class="ai-note" style="display:none;margin-top:6px;"></div>
      </div>`;
  }
  function wireImportCardRow(id, promptParts, parseAnswer, rerender){
    const openBtn = tabContent.querySelector('#'+id+'-open');
    if(!openBtn) return;
    const panel = tabContent.querySelector('#'+id+'-panel');
    const textEl = tabContent.querySelector('#'+id+'-text');
    const errEl = tabContent.querySelector('#'+id+'-err');
    openBtn.onclick = ()=>{
      openChatGptWithPrompt({ chatSystemPrompt: promptParts.systemPrompt, userMessage: promptParts.userMessage });
      panel.style.display = 'block';
      textEl.focus();
    };
    tabContent.querySelector('#'+id+'-submit').onclick = ()=>{
      errEl.style.display = 'none';
      try{
        if(!textEl.value.trim()) throw new Error('چیزی پیست نشده');
        parseAnswer(textEl.value);
        rerender();
      }catch(e){
        errEl.textContent = `متن پیست‌شده قابل خواندن نبود — مطمئن شو دقیقاً همون پاسخ هوش مصنوعی رو (بدون توضیح اضافه‌ی خودت) کپی کردی. (${escapeHtml(e.message||'')})`;
        errEl.style.display = 'block';
      }
    };
  }

  function parseExplainImport(raw){
    state.deepExplain = raw.trim();
    state.deepExplainError = '';
    persistExplainToWord(state.deepExplain);
  }
  function parseExamplesImport(raw){
    const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const obj = JSON.parse(cleaned);
    const list = Array.isArray(obj.examples) ? obj.examples.map(e=>({en:(e.en||'').trim(), fa:(e.fa||'').trim()})).filter(e=>e.en) : [];
    if(!list.length) throw new Error('نمونه‌ای در پاسخ پیدا نشد');
    state.moreExamples = list;
    persistExamplesToWord(list);
  }

  /* Saves freshly-fetched "نمونه‌ها" examples onto the word record itself if it doesn't have any
     yet — so words added before this tab was ever opened still end up with reusable saved
     examples (used by the review deck's example builder instead of always calling the AI). Never
     overwrites examples the word already has. */
  function persistExamplesToWord(list){
    if(wordEntry && (!wordEntry.moreExamples || !wordEntry.moreExamples.length) && list && list.length){
      wordEntry.moreExamples = list;
      saveWords();
    }
  }

  /* Same idea as persistExamplesToWord, but for the "دستور زبان" and "نکات کاربردی" tabs — these
     used to only live in the in-memory `state` object for the lifetime of the panel, so opening
     an already-added word's details, generating (or pasting from ChatGPT) fresh grammar/notes,
     then closing the panel silently lost that work. Same never-overwrite rule: if the word
     already has a saved grammar/practicalNotes value, a freshly (re)generated one here won't
     clobber it. */
  function persistGrammarToWord(g){
    if(wordEntry && !wordEntry.grammar && g){
      wordEntry.grammar = g;
      saveWords();
    }
  }
  function persistExplainToWord(text){
    if(wordEntry && !wordEntry.practicalNotes && text){
      wordEntry.practicalNotes = text;
      saveWords();
    }
  }

  /* Applies one pasted answer (from buildFullCardImportPrompt) to all three tabs' state at once —
     دستور زبان، نکات کاربردی، and نمونه‌ها — so a single copy/paste round-trip with an external AI
     fills in the whole card instead of needing to be repeated per tab. */
  function parseFullCardImport(raw){
    const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const obj = JSON.parse(cleaned);
    state.grammarError = '';
    state.grammar = {
      paragraph: (obj.paragraph||'').trim(),
      inContextMeanings: Array.isArray(obj.inContextMeanings) ? obj.inContextMeanings.filter(x=>typeof x==='string' && x.trim()) : [],
      generalMeanings: Array.isArray(obj.generalMeanings) ? obj.generalMeanings.filter(x=>typeof x==='string' && x.trim()) : []
    };
    state.deepExplain = (obj.practicalNotes||'').trim() || 'نکته‌ای دریافت نشد.';
    state.deepExplainError = '';
    const list = Array.isArray(obj.examples) ? obj.examples.map(e=>({en:(e.en||'').trim(), fa:(e.fa||'').trim()})).filter(e=>e.en) : [];
    if(list.length) state.moreExamples = list;
    if(!state.grammar.paragraph && !state.grammar.inContextMeanings.length && !state.grammar.generalMeanings.length && !list.length && !obj.practicalNotes) throw new Error('چیزی در پاسخ قابل تشخیص نبود');
    backfillMeaningFromGrammar(state.grammar);
    if(list.length) persistExamplesToWord(list);
    persistGrammarToWord(state.grammar);
    if(obj.practicalNotes && obj.practicalNotes.trim()) persistExplainToWord(state.deepExplain);
    state.tabLoaded.grammar = true;
    state.tabLoaded.explain = true;
    state.tabLoaded.examples = true;
  }

  /* Same import-prompt + parser + render-fn triple each render*Tab uses for its own "دریافت کارت
     از هوش مصنوعی دیگر" row — exposed per-tab here so the placeholder (before the in-app AI has
     ever been asked) can offer the exact same shortcut. */
  function getImportConfigForTab(tab){
    return { promptParts: buildFullCardImportPrompt(word, sentence, en, state.quickMeaning, dialogueContext), parseAnswer: parseFullCardImport, renderFn: renderTab };
  }

  /* If the word was added before a Persian meaning was ever set (the "بدون معنی، بعداً کامل کن"
     path), and the grammar tab's answer arrives with meanings, back-fill that meaning onto the
     word itself — both the quick-meaning line up top and the saved record — so it's no longer
     empty in "دستور زبان"/manual-edit, and shows up in review too.
     If a meaning was already there (own text, or an earlier single-word AI answer), it's never
     silently overwritten — but if the grammar tab's answer is genuinely richer/different, a small
     🔄 button is offered next to the quick-meaning line so the person can pull in the fuller
     version themselves with one tap, instead of it only ever showing up buried in "دستور زبان". */
  function backfillMeaningFromGrammar(g){
    // Same comma-separated style as the 🤖 quick-meaning button (fetchQuickMeaningsLine), so the
    // top meaning line reads consistently no matter which AI path ends up filling it in. Prefers
    // generalMeanings (the word's meaning overall) over inContextMeanings (specific to one
    // sentence), since this line is the word's permanent saved meaning, shown in review too —
    // not just a note about the one example sentence it happened to be learned from.
    const general = Array.isArray(g.generalMeanings) ? g.generalMeanings.filter(Boolean) : [];
    const inCtx = Array.isArray(g.inContextMeanings) ? g.inContextMeanings.filter(Boolean) : [];
    const richMeaning = (general.length ? general : inCtx).join('، ');
    if(!richMeaning) return;
    if(!state.quickMeaning){
      applyQuickMeaning(richMeaning);
      return;
    }
    if(richMeaning.trim().toLowerCase() !== state.quickMeaning.trim().toLowerCase()){
      offerMeaningUpdate(richMeaning);
    }
  }

  function applyQuickMeaning(meaning){
    state.quickMeaning = meaning;
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(qmEl) qmEl.innerHTML = escapeHtml(meaning);
    if(learnBtn && !alreadyAdded) learnBtn.disabled = false;
    if(wordEntry){
      wordEntry.fa = meaning;
      saveWords();
      renderDrawers();
      if(listPageRedraw) listPageRedraw();
      if(deckEl && currentDeckWord()===wordEntry) renderDeckCard();
    }
  }

  function offerMeaningUpdate(richMeaning){
    const qmEl = overlay.querySelector('#wdQuickMeaning');
    if(!qmEl || qmEl.querySelector('.wd-meaning-update-btn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wd-meaning-update-btn';
    btn.title = 'به‌روزرسانی با معنی کامل‌تر: ' + richMeaning;
    btn.textContent = '🔄';
    btn.onclick = ()=>{ applyQuickMeaning(richMeaning); };
    qmEl.appendChild(btn);
  }

  function dictBoxHtml(g){
    const dictRows = [];
    if(g.inContextMeanings.length){
      dictRows.push(`<div class="wd-dict-row"><span class="wd-dict-word">${escapeHtml(en)}</span><span class="wd-dict-pos">در این جمله</span><span class="wd-dict-meanings">${escapeHtml(g.inContextMeanings.join('، '))}</span></div>`);
    }
    if(g.generalMeanings.length){
      dictRows.push(`<div class="wd-dict-row"><span class="wd-dict-word">${escapeHtml(en)}</span><span class="wd-dict-pos">به‌طور کلی</span><span class="wd-dict-meanings">${escapeHtml(g.generalMeanings.join('، '))}</span></div>`);
    }
    return dictRows.length ? `<div class="wd-dict-box">${dictRows.join('')}</div>` : '';
  }

  function grammarTabHtml(){
    if(state.grammar){
      const paraHtml = state.grammar.paragraph ? `<div class="ai-msg">${escapeHtml(state.grammar.paragraph)}</div>` : '';
      return paraHtml + dictBoxHtml(state.grammar);
    }
    if(state.grammarError) return `<div class="ai-note">${state.grammarError}</div><div id="wdGrammarFreeDictWrap"></div>`;
    return `<div class="ai-msg"><span class="spinner"></span> در حال تحلیل جمله...</div>`;
  }

  function renderGrammarTab(){
    tabContent.innerHTML = `
      <div id="wdGrammarWrap">${grammarTabHtml()}</div>
      ${chatGptButtonHtml('wdGrammarChatGptBtn')}
      ${importCardRowHtml('wdGrammarImport')}`;
    wireChatGptButton('wdGrammarChatGptBtn', ()=> getPromptPartsForTab('grammar'));
    wireImportCardRow('wdGrammarImport', getImportConfigForTab('grammar').promptParts, parseFullCardImport, renderTab);
    if(state.grammarError){
      const wrap = tabContent.querySelector('#wdGrammarWrap');
      if(wrap) mountFreeDictionaryFallback(wrap.querySelector('#wdGrammarFreeDictWrap'), en);
      return;
    }
    if(state.grammar) return;

    fetchGrammarExplanation(settings.key, en, sentence, dialogueContext).then(g=>{
      state.grammar = g;
      backfillMeaningFromGrammar(g);
      persistGrammarToWord(g);
      if(state.activeTab!=='grammar') return;
      const wrap = tabContent.querySelector('#wdGrammarWrap');
      if(wrap) wrap.innerHTML = grammarTabHtml();
    }).catch(e=>{
      state.grammarError = `درخواست ناموفق بود (${escapeHtml(e.message||'')}). محتمل‌ترین دلیل: نبود دسترسی به این سرویس از ایران بدون فیلترشکن، یا نامعتبر بودن کلید API.`;
      if(state.activeTab!=='grammar') return;
      const wrap = tabContent.querySelector('#wdGrammarWrap');
      if(!wrap) return;
      wrap.innerHTML = grammarTabHtml();
      mountFreeDictionaryFallback(wrap.querySelector('#wdGrammarFreeDictWrap'), en);
    });
  }

  function practicalNotesHtml(){
    if(state.deepExplain) return `<div class="ai-msg">${renderMarkdownLite(state.deepExplain)}</div>`;
    if(state.deepExplainError) return `<div class="ai-note">${state.deepExplainError}</div>`;
    return `<div class="ai-msg"><span class="spinner"></span> در حال آماده‌سازی نکات کاربردی...</div>`;
  }

  function renderExplainTab(){
    tabContent.innerHTML = `
      <div id="wdExplainWrap">${practicalNotesHtml()}</div>
      ${chatGptButtonHtml('wdExplainChatGptBtn')}
      ${importCardRowHtml('wdExplainImport')}`;
    wireChatGptButton('wdExplainChatGptBtn', ()=> getPromptPartsForTab('explain'));
    wireImportCardRow('wdExplainImport', getImportConfigForTab('explain').promptParts, parseFullCardImport, renderTab);
    if(state.deepExplain || state.deepExplainError) return;
    fetchPracticalUsageNotes(settings.key, en, state.quickMeaning, sentence, dialogueContext).then(text=>{
      state.deepExplain = text;
      persistExplainToWord(text);
      if(state.activeTab!=='explain') return;
      const wrap = tabContent.querySelector('#wdExplainWrap');
      if(wrap) wrap.innerHTML = practicalNotesHtml();
    }).catch(e=>{
      state.deepExplainError = `درخواست ناموفق بود (${escapeHtml(e.message||'')}). محتمل‌ترین دلیل: نبود دسترسی به این سرویس از ایران بدون فیلترشکن، یا نامعتبر بودن کلید API.`;
      if(state.activeTab!=='explain') return;
      const wrap = tabContent.querySelector('#wdExplainWrap');
      if(!wrap) return;
      wrap.innerHTML = practicalNotesHtml() + '<div id="wdExplainFreeDictWrap"></div>';
      mountFreeDictionaryFallback(wrap.querySelector('#wdExplainFreeDictWrap'), en);
    });
  }

  function moreExamplesHtml(list){
    if(!list || !list.length) return `<div class="ai-note">نمونه‌ی بیشتری دریافت نشد.</div>`;
    return `<div class="wd-example-src" style="margin:12px 2px 6px;">نمونه‌های بیشتر</div>` + list.map(ex=>`
      <div class="wd-example-block">
        <div class="wd-example-en"><span class="en">${escapeHtml(ex.en)}</span><button type="button" class="wd-speak-btn" data-speak="${escapeHtml(ex.en)}" title="پخش">🔊</button></div>
        ${ex.fa ? `<div class="wd-example-fa">${escapeHtml(ex.fa)}</div>` : ''}
      </div>`).join('');
  }

  function renderExamplesTab(){
    let html = '';
    if(sentence){
      html += `<div class="wd-example-block">
        <div class="wd-example-src">نمونه از همین متن</div>
        <div class="wd-example-en"><span class="en">${escapeHtml(sentence)}</span><button type="button" class="wd-speak-btn" data-speak="${escapeHtml(sentence)}" title="پخش">🔊</button></div>
        <div class="wd-example-fa" id="wdSentenceTranslation">${state.sentenceTranslation ? escapeHtml(state.sentenceTranslation) : '<span class="spinner"></span>'}</div>
      </div>`;
    }
    html += `<div id="wdMoreExamplesWrap">${state.moreExamples ? moreExamplesHtml(state.moreExamples) : `<div class="ai-msg"><span class="spinner"></span> در حال دریافت نمونه‌های بیشتر...</div>`}</div>`;
    html += chatGptButtonHtml('wdExamplesChatGptBtn');
    html += importCardRowHtml('wdExamplesImport');
    tabContent.innerHTML = html;
    tabContent.querySelectorAll('[data-speak]').forEach(btn=>{ btn.onclick = (e)=> speakText(btn.dataset.speak, e.currentTarget); });
    wireChatGptButton('wdExamplesChatGptBtn', ()=> getPromptPartsForTab('examples'));
    wireImportCardRow('wdExamplesImport', getImportConfigForTab('examples').promptParts, parseFullCardImport, renderTab);

    if(sentence && !state.sentenceTranslation){
      fetchSentenceTranslation(settings.key, sentence).then(t=>{
        state.sentenceTranslation = t || '';
        if(state.activeTab!=='examples') return;
        const el = tabContent.querySelector('#wdSentenceTranslation');
        if(el) el.innerHTML = state.sentenceTranslation ? escapeHtml(state.sentenceTranslation) : '<span style="opacity:.6;">ترجمه‌ای دریافت نشد.</span>';
      }).catch(()=>{
        if(state.activeTab!=='examples') return;
        const el = tabContent.querySelector('#wdSentenceTranslation');
        if(el) el.innerHTML = '<span style="opacity:.6;">ترجمه ناموفق بود.</span>';
      });
    }

    if(!state.moreExamples){
      const avoid = sentence ? [sentence] : [];
      fetchExampleBatch(settings.key, en, state.quickMeaning, avoid, 4).then(list=>{
        state.moreExamples = list;
        persistExamplesToWord(list);
        if(state.activeTab!=='examples') return;
        const wrap = tabContent.querySelector('#wdMoreExamplesWrap');
        if(wrap){
          wrap.innerHTML = moreExamplesHtml(list);
          wrap.querySelectorAll('[data-speak]').forEach(btn=>{ btn.onclick = (e)=> speakText(btn.dataset.speak, e.currentTarget); });
        }
      }).catch(e=>{
        if(state.activeTab!=='examples') return;
        const wrap = tabContent.querySelector('#wdMoreExamplesWrap');
        if(wrap) wrap.innerHTML = `<div class="ai-note">دریافت نمونه‌های بیشتر ناموفق بود (${escapeHtml(e.message||'')}).</div>`;
      });
    }
  }

  tabsRow.addEventListener('click', (e)=>{
    const btn = e.target.closest('.ep-type-filter-btn');
    if(!btn || btn.dataset.tab===state.activeTab) return;
    state.activeTab = btn.dataset.tab;
    tabsRow.querySelectorAll('.ep-type-filter-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.activeTab));
    renderTab();
  });
  renderTab();
}

/* ---------- Wire up top buttons ---------- */
$('#startReviewBtn').onclick = ()=> startReview();
$('#addWordBtn').onclick = ()=> openQuickWordEntry();
$('#listBtn').onclick = ()=> openListPage();
$('#browseBtn').onclick = ()=> startBrowse();
$('#episodeBtn').onclick = ()=> openEpisodePage();
$('#textImportBtn').onclick = ()=> openTextImportPage();
$('#settingsBtn').onclick = ()=> openSettingsPage();

/* Saves the last-watched-video record on a real close/reload/backgrounding too — not just when
   the episode page's own close button is pressed — so the "resume from where you left off"
   info survives even if the app/tab is closed outright rather than navigated away from inside it. */
window.addEventListener('pagehide', ()=>{ saveVsyncLastState(); flushSyncPush(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){
    saveVsyncLastState();
    flushSyncPush(); // don't let a pending debounced push die with the tab/app
  } else if(document.visibilityState==='visible'){
    pullIfStale(); // catch up on anything pushed from another device while we were away
  }
});

/* ---------- Init ---------- */
(async function init(){
  await loadWords();
  renderDrawers();
})();
</script>
