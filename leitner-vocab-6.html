        <div class="vsync-seek-flash vsync-seek-flash-right" id="epVsyncSeekFlashRight">
          <span class="vsync-seek-flash-icon">⟳</span>10s
        </div>
        <button type="button" class="vsync-center-playpause" id="epVsyncCenterPlayPauseBtn" title="پخش/توقف">▶</button>
        <div class="vsync-seek-row" id="epVsyncSeekRow">
          <span class="vsync-time" id="epVsyncTimeCurrent">0:00</span>
          <div class="vsync-seek-track" id="epVsyncSeekTrack">
            <div class="vsync-seek-fill" id="epVsyncSeekFill"></div>
            <div class="vsync-seek-handle" id="epVsyncSeekHandle"></div>
          </div>
          <span class="vsync-time" id="epVsyncTimeDuration">0:00</span>
          <button type="button" class="vsync-fs-btn vsync-prefs-rotate-btn" id="epVsyncPreFsRotateBtn" title="چرخش و فول‌اسکرین مستقیم">⤾</button>
          <button type="button" class="vsync-fs-btn" id="epVsyncFsBtn" title="فول‌اسکرین">⛶</button>
        </div>
      </div>
    </div>`;
  epVsyncLastRenderedSrc = srcKey;
  const wantedId = epYoutubeId;
  const setYtMsg = (msg)=>{
    const el = holder.querySelector('#epVsyncYtMsg');
    if(!el) return;
    if(msg){ el.textContent = msg; el.style.display = 'flex'; }
    else el.style.display = 'none';
  };
  // If the IFrame API script never calls back (blocked by network/an extension/etc.), don't
  // leave the person staring at "در حال بارگذاری..." forever — say so after a reasonable wait.
  const loadTimeout = setTimeout(()=>{
    if(epYoutubeId===wantedId && epYtPlayer==null){
      setYtMsg('پلیر یوتیوب بارگذاری نشد — اتصال اینترنت یا مسدودکننده‌های تبلیغات/اسکریپت رو چک کن.');
    }
  }, 8000);
  loadYoutubeIframeApi().then(()=>{
    // Another import (or a source switch) may have happened while the API script was loading —
    // bail out instead of building a player for a video that's no longer the current one.
    if(epYoutubeId !== wantedId || epVsyncLastRenderedSrc !== srcKey) return;
    const targetEl = holder.querySelector('#epVsyncYtTarget');
    if(!targetEl) return;
    try{
      epYtPlayer = new YT.Player(targetEl, {
        videoId: wantedId,
        playerVars: { playsinline:1, controls:0, modestbranding:1, rel:0, iv_load_policy:3, fs:0 },
        events:{
          onReady: ()=>{
            clearTimeout(loadTimeout);
            setYtMsg(null);
            const facade = new YtVideoFacade(epYtPlayer);
            if(epVideoLastTime > 0){
              try{ facade.currentTime = Math.min(epVideoLastTime, facade.duration || epVideoLastTime); }catch(e){}
            }
            wireVsyncControls(facade, holder);
          },
          onStateChange: (e)=>{
            const active = epVsyncActiveVideoEl;
            if(!active || !(active instanceof YtVideoFacade)) return;
            if(e.data === YT.PlayerState.PLAYING) active._setPaused(false);
            else if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) active._setPaused(true);
          },
          // Fires for a bad video ID, a private/deleted video, or (most commonly) one whose
          // uploader has disabled embedding — all of which otherwise look like "nothing happened".
          onError: (e)=>{
            clearTimeout(loadTimeout);
            const codes = { 2:'شناسه‌ی ویدیو نامعتبره.', 5:'این ویدیو در پلیر HTML5 قابل پخش نیست.',
              100:'این ویدیو پیدا نشد یا خصوصی/حذف‌شده است.',
              101:'مالک این ویدیو پخش در سایت‌های دیگه (embed) رو غیرفعال کرده.',
              150:'مالک این ویدیو پخش در سایت‌های دیگه (embed) رو غیرفعال کرده.',
              153:'خطای پیکربندی پلیر یوتیوب (۱۵۳) — اگه این فایل رو مستقیم (file://) باز کردی، امتحان کن از یه سرور محلی/آنلاین بازش کنی.' };
            setYtMsg(codes[e.data] || 'این ویدیوی یوتیوب قابل پخش نیست.');
          }
        }
      });
      // Belt-and-suspenders for YouTube's Error 153 ("Video player configuration error"): the
      // page-level <meta name="referrer"> tag should already cover this, but explicitly setting
      // it on the iframe itself too (once the API has created it) costs nothing and some browsers
      // only honor a referrer policy set this way, not via the meta tag alone.
      const ytIframe = holder.querySelector('.vsync-yt-wrap iframe');
      if(ytIframe) ytIframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    }catch(err){
      clearTimeout(loadTimeout);
      setYtMsg('ساخت پلیر یوتیوب با خطا مواجه شد.');
    }
  });
}

/* Wraps each word of a (already-safe, since it's user-supplied local subtitle text) caption
   line in a clickable span, so any word can be tapped during playback. Text is escaped first so
   only the spans this function itself adds ever reach innerHTML. */
/* Turns a caption line into tappable spans. Idiom entries in `levelWords` (multi-word phrases,
   detected by containing whitespace) are matched as a literal case-insensitive substring FIRST
   and wrapped whole in one tappable span — so e.g. "give up" becomes one tap target with the
   idiom's own meaning, instead of "give" and "up" being two separate, individually-meaningless
   word taps. Everything outside an idiom match still gets the normal per-word tokenizing below. */
function wordSpansHtml(text, levelWords, knownWords){
  const raw = text || '';
  const tokenizeWords = (chunk)=> chunk.replace(/([A-Za-z']+)|([^A-Za-z']+)/g, (m, word, rest)=>{
    if(word){
      const lower = word.toLowerCase();
      const isLevelWord = !!levelWords && levelWords.has(lower);
      const isKnown = isLevelWord && !!knownWords && knownWords.has(lower);
      const cls = isKnown ? 'vsync-word vsync-word-known' : (isLevelWord ? 'vsync-word vsync-word-level' : 'vsync-word');
      return `<span class="${cls}" data-w="${escapeHtml(word)}">${escapeHtml(word)}</span>`;
    }
    return escapeHtml(rest);
  });

  const idioms = levelWords ? Array.from(levelWords).filter(w=>/\s/.test(w)).sort((a,b)=>b.length-a.length) : [];
  if(idioms.length===0) return tokenizeWords(raw);

  const pattern = idioms.map(escapeRegExp).join('|');
  let re;
  try{ re = new RegExp(pattern, 'gi'); }catch(e){ return tokenizeWords(raw); }

  let out = '', lastIndex = 0, m;
  while((m = re.exec(raw))){
    out += tokenizeWords(raw.slice(lastIndex, m.index));
    const idiomKnown = !!knownWords && knownWords.has(m[0].toLowerCase());
    const idiomCls = idiomKnown ? 'vsync-word vsync-word-known' : 'vsync-word vsync-word-level vsync-word-idiom';
    out += `<span class="${idiomCls}" data-w="${escapeHtml(m[0])}">${escapeHtml(m[0])}</span>`;
    lastIndex = m.index + m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  out += tokenizeWords(raw.slice(lastIndex));
  return out;
}

/* Re-draws whatever caption is currently showing over the video, right now, using the latest
   level word list — used right after the paste-back handlers in renderSrtAnalyzePanel() add
   AI-picked words, so a caption already on screen (e.g. while the video is paused) updates
   immediately instead of waiting for the next timeupdate tick. */
/* Builds one big prompt covering the WHOLE loaded .srt (epVideoCues), numbered line-by-line, so
   an external AI (ChatGPT or anything else — no in-app API key needed) can translate every line
   in one pass with the surrounding context of the whole episode, instead of one-line-at-a-time.
   The instruction is strict about preserving the exact line count/order, since the result gets
   zipped back onto epVideoCues by index (see renderSrtTranslatePanel's submit handler) — nothing
   here re-times anything, it only ever reuses the original cues' own start/end. */
function buildSrtTranslationPrompt(){
  const numbered = epVideoCues.map((c,i)=> `${i+1}. ${c.text.replace(/\n/g,' ')}`).join('\n');
  const systemPrompt = `تو یک مترجم حرفه‌ای انگلیسی به فارسی هستی. در ادامه، متن زیرنویس یک ویدیو خط‌به‌خط و به ترتیب زمانی، با شماره‌ی هر خط آورده شده. هر خط را به فارسی روان، طبیعی و دقیق ترجمه کن؛ برای فهم بهتر لحن و معنی از خط‌های قبل و بعدش هم به‌عنوان سیاق کلی گفتگو/داستان استفاده کن، اما در خروجی دقیقاً و فقط باید ترجمه‌ی همون خط مربوطه باشه. حتماً همون تعداد خط ورودی را با همون ترتیب برگردان — هیچ خطی را ادغام، حذف یا اضافه نکن، حتی اگر خیلی کوتاه یا ناقص به‌نظر برسد (چون هرکدوم دقیقاً با یک زمان مشخص در ویدیو متناظره).
فقط و فقط یک آرایه‌ی JSON معتبر و خالص از رشته‌ها برگردان — بدون Markdown، بدون فنس \`\`\`json، بدون هیچ توضیح قبل یا بعدش — دقیقاً با ${epVideoCues.length} عضو، به همین ترتیب: ["ترجمه‌ی خط ۱", "ترجمه‌ی خط ۲", ...].`;
  return { systemPrompt, userMessage: numbered };
}

/* The "🌐 ترجمه‌ی کامل زیرنویس" panel: copy-the-prompt / open-ChatGPT / paste-the-answer-back,
   same fallback-to-external-AI pattern used in the word-details tabs, just for the whole .srt at
   once. Uses the clipboard (not the chatgpt.com/?q= URL trick used elsewhere) since a full
   episode's worth of lines is routinely far past any URL length limit. */
function renderSrtTranslatePanel(){
  const panel = episodePageEl && episodePageEl.querySelector('#epSrtTranslatePanel');
  if(!panel) return;
  panel.style.display = 'block';
  if(!epVideoCues.length){
    panel.innerHTML = `<div class="ai-note">اول از بالا یه فایل زیرنویس (.srt) انتخاب کن.</div>`;
    return;
  }
  const already = epFaCues.length===epVideoCues.length && epFaCues.length>0;
  panel.innerHTML = `
    <div class="ai-flow-card">
    <div class="ai-flow-desc">
      ترجمه‌ی هر ${epVideoCues.length} خط رو با یک هوش مصنوعی (ChatGPT یا هر مدل دیگه) بگیر و اینجا پیست کن.
    </div>
    ${already ? `<div class="ai-note">✅ ${epFaCues.length} خط ترجمه فعاله (دکمه‌ی «فا» بالای ویدیو).</div>` : ''}

    <div class="ai-flow-step ai-flow-step-first">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۱</span>کپی درخواست</div>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-small" id="epSrtTransShareBtn">📤 اشتراک‌گذاری / کپی متن درخواست</button>
      </div>
      <div id="epSrtTransCopyMsg" class="ai-flow-hint" style="display:none;"></div>
      <textarea id="epSrtTransPromptBox" readonly class="ai-flow-textarea"></textarea>
    </div>

    <div class="ai-flow-step">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۲</span>پیست جواب</div>
      <textarea id="epSrtTransPasteBox" class="ai-flow-textarea" placeholder="آرایه‌ی JSON پاسخ رو اینجا پیست کن..."></textarea>
    </div>

    <div class="ai-flow-step">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۳</span>ثبت</div>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-small" id="epSrtTransSubmitBtn">✅ ثبت ترجمه</button>
        ${already ? `<button type="button" class="btn btn-ghost btn-small" id="epSrtTransClearBtn">🗑 حذف ترجمه‌ی فعلی</button>` : ''}
      </div>
      <div id="epSrtTransErr" class="ai-note" style="display:none;"></div>
    </div>
    </div>`;

  /* Still one button, one tap: on phones (where navigator.share works and lists the ChatGPT/AI
     app directly), try that first. If share isn't available, gets cancelled, or fails (mainly a
     desktop-browser situation, where there's usually no share target anyway), fall straight
     through to copying the text to the clipboard instead — no second button, no hidden step. */
  panel.querySelector('#epSrtTransShareBtn').onclick = async ()=>{
    const { systemPrompt, userMessage } = buildSrtTranslationPrompt();
    const fullText = systemPrompt + '\n\n' + userMessage;
    const box = panel.querySelector('#epSrtTransPromptBox');
    box.value = fullText;
    const msg = panel.querySelector('#epSrtTransCopyMsg');
    if(navigator.share){
      try{ await navigator.share({ text: fullText }); return; }
      catch(e){ /* cancelled or failed — fall through to clipboard copy below */ }
    }
    try{
      await navigator.clipboard.writeText(fullText);
      if(msg){ msg.textContent = '✅ کپی شد — برو تو ChatGPT (یا هر هوش مصنوعی دیگه) پیستش کن.'; msg.style.display = 'block'; }
    }catch(e){
      box.focus();
      box.select();
      if(msg){ msg.textContent = 'کپی خودکار نشد؛ متن بالا انتخاب شد، Ctrl+C رو بزن.'; msg.style.display = 'block'; }
    }
  };
  panel.querySelector('#epSrtTransSubmitBtn').onclick = ()=>{
    const errEl = panel.querySelector('#epSrtTransErr');
    errEl.style.display = 'none';
    const raw = panel.querySelector('#epSrtTransPasteBox').value;
    try{
      if(!raw.trim()) throw new Error('چیزی پیست نشده');
      const cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
      const arr = JSON.parse(cleaned);
      if(!Array.isArray(arr)) throw new Error('پاسخ باید یک آرایه‌ی JSON باشه');
      if(arr.length !== epVideoCues.length) throw new Error(`تعداد خط‌ها جور در نمیاد (زیرنویس ${epVideoCues.length} خط داره، پاسخ ${arr.length} خط داشت)`);
      epFaCues = epVideoCues.map((c,i)=>({ start:c.start, end:c.end, text:(arr[i]==null?'':String(arr[i])).trim() }));
      epShowFaCaption = true;
      saveVsyncLastState();
      refreshVsyncFaToggleVisibility();
      updateVsyncCaptionNow();
      renderSrtTranslatePanel();
    }catch(e){
      errEl.textContent = `پاسخ قابل خواندن نبود: ${escapeHtml(e.message||'')} — مطمئن شو دقیقاً همون خروجی JSON رو (بدون توضیح اضافه‌ی خودت) کپی کردی.`;
      errEl.style.display = 'block';
    }
  };
  const clearBtn = panel.querySelector('#epSrtTransClearBtn');
  if(clearBtn) clearBtn.onclick = ()=>{
    epFaCues = [];
    saveVsyncLastState();
    refreshVsyncFaToggleVisibility();
    updateVsyncCaptionNow();
    renderSrtTranslatePanel();
  };
}

/* Reveals/hides the "فا" toggle button based on whether a Persian translation is currently
   loaded — called after render, after a successful import, and after restoring one from storage,
   since none of those paths necessarily re-render the whole player. */
function refreshVsyncFaToggleVisibility(){
  if(!episodePageEl) return;
  const btn = episodePageEl.querySelector('#epVsyncFaToggleBtn');
  if(btn) btn.style.display = epFaCues.length ? '' : 'none';
}

function updateVsyncCaptionNow(){
  if(!episodePageEl) return;
  // Not a DOM query: the YouTube path has no <video> element, so this reads whichever video-like
  // object (real <video> or the YtVideoFacade) wireVsyncControls last wired up.
  const videoEl = epVsyncActiveVideoEl;
  const captionText = episodePageEl.querySelector('#epVsyncCaptionText');
  const captionFaText = episodePageEl.querySelector('#epVsyncCaptionFaText');
  if(!videoEl || !captionText) return;
  const idx = findActiveCueIndex(epVideoCues, videoEl.currentTime - epSubOffset);
  if(idx===-1){
    captionText.style.display = 'none'; captionText.innerHTML = '';
  }else{
    captionText.style.display = 'inline-block';
    captionText.innerHTML = wordSpansHtml(epVideoCues[idx].text, buildLevelWordSet(), buildKnownLevelWordSet());
  }
  if(captionFaText){
    // Same cue index as the English line above (epFaCues is index-aligned with epVideoCues), so
    // no separate timing lookup needed — it's on/off/switches together with the English caption.
    const faLine = (epShowFaCaption && idx!==-1 && epFaCues[idx]) ? epFaCues[idx].text : '';
    if(faLine){
      captionFaText.style.display = 'inline-block';
      captionFaText.textContent = faLine;
    }else{
      captionFaText.style.display = 'none'; captionFaText.textContent = '';
    }
  }
}

/* Called when a word inside the synced caption is tapped: pauses the video (and exits
   fullscreen, since an overlay opened on <body> wouldn't be visible over a fullscreen element
   anyway), then opens the normal add-word form pre-filled with that word. */
/* Called when a word inside the synced caption is tapped: pauses the video, then opens the
   new word-detail panel pre-loaded with the real subtitle line (cueText) as context, so its
   grammar/examples tabs are grounded in the actual sentence rather than a generic one. The
   panel mounts inside the fullscreen element itself via getOverlayMountEl(), so it stays
   visible without kicking the person out of fullscreen. */
function handleVsyncWordTap(videoEl, word, cueText, dialogueContext){
  if(!word) return;
  if(videoEl) videoEl.pause();
  // If this word was already picked/translated by the external-AI subtitle analysis (the
  // highlighted, level-matching words), reuse that saved fa/definition/example instead of
  // triggering a fresh lookup — the meaning is already known. Checks vsyncLevelData first (new,
  // dedicated store), then falls back to episodeSuggestions — the older list, already saved/
  // restored before this store existed, so highlights made before this feature still resolve.
  const wLower = word.trim().toLowerCase();
  let known = vsyncLevelData[wLower];
  if(!known){
    const fromSuggestions = episodeSuggestions.find(w=> (w.en||'').trim().toLowerCase()===wLower);
    if(fromSuggestions) known = fromSuggestions;
  }
  const wordObj = known
    ? { en: known.en || word, fa: known.fa || '', example: known.example || '',
        grammar: known.grammar || null, practicalNotes: known.practicalNotes || '',
        moreExamples: (known.moreExamples && known.moreExamples.length) ? known.moreExamples : null }
    : { en: word };
  openWordDetailPanel(wordObj, { sentence: (known && known.example) || cueText || '', context: dialogueContext || '' });
}

/* Builds a small window of surrounding subtitle dialogue (a few cues before/after the tapped
   one) as one plain-text block, with the tapped line marked — passed to the AI grammar/practical-
   notes prompts alongside the exact sentence so the meaning can be worked out from the real
   back-and-forth of the scene, not just one isolated line. Purely extra context: the exact
   sentence used for marking/highlighting the target word is unaffected. */
function buildVsyncDialogueContext(cues, cueIdx, before, after){
  if(!cues || cueIdx==null || cueIdx<0 || !cues[cueIdx]) return '';
  before = (before==null) ? 3 : before;
  after = (after==null) ? 3 : after;
  const start = Math.max(0, cueIdx - before);
  const end = Math.min(cues.length - 1, cueIdx + after);
  if(end<=start) return '';
  const lines = [];
  for(let i=start;i<=end;i++){
    const marker = i===cueIdx ? '>> ' : '   ';
    lines.push(marker + cues[i].text.replace(/\n/g,' '));
  }
  return lines.join('\n');
}

/* Finds the cue that should be showing at time t (seconds). Cues are sorted ascending, so the
   scan can stop as soon as it passes t — fine even for a two-hour movie's worth of lines. */
function findActiveCueIndex(cues, t){
  for(let i=0;i<cues.length;i++){
    if(t>=cues[i].start && t<=cues[i].end) return i;
    if(cues[i].start>t) break;
  }
  return -1;
}

/* Builds a small window of subtitle lines around a given line index — a few lines before and
   after — with the matching line flagged, so a word or idiom can be shown inside its real
   scene/dialogue instead of in isolation. Shared by both the word extractor and the idiom
   fetcher below. */
function buildContextBlock(lines, lineIdx, before, after){
  before = (before==null) ? 2 : before;
  after = (after==null) ? 2 : after;
  const start = Math.max(0, lineIdx - before);
  const end = Math.min(lines.length - 1, lineIdx + after);
  const block = [];
  for(let li = start; li <= end; li++){
    block.push({ text: lines[li], isMatch: li === lineIdx });
  }
  return block;
}

/* Builds a frequency-ranked list of candidate words from real subtitle lines: skips function
   words, words the user already knows, and words that only ever appear capitalized mid-line
   (a decent signal they're a character/place name rather than a word worth learning). For each
   occurrence, also keeps a small window of the surrounding subtitle lines (a few before/after)
   so the word can later be shown inside its real scene/dialogue, not just in isolation. */
function extractSrtVocabulary(lines, knownLowerSet){
  const freq = {};
  const contexts = {};      // word -> array of context blocks: [{text, isMatch}, ...]
  const lastCovered = {};   // word -> last line index already included in a context block, to avoid near-duplicate overlapping blocks
  const midCap = new Set();
  const anyLower = new Set();
  const MAX_EXAMPLES_PER_WORD = 12;
  const CONTEXT_BEFORE = 2;
  const CONTEXT_AFTER = 2;

  lines.forEach((line, lineIdx)=>{
    const matches = [...line.matchAll(/[A-Za-z']+/g)];
    matches.forEach((m, i)=>{
      const raw = m[0];
      const lower = raw.toLowerCase();
      if(lower.length<3 || lower.length>15) return;
      if(SRT_STOPWORDS.has(lower)) return;
      if(knownLowerSet.has(lower)) return;
      const isCap = /^[A-Z]/.test(raw);
      if(isCap && i>0) midCap.add(lower);
      if(!isCap) anyLower.add(lower);
      freq[lower] = (freq[lower]||0) + 1;

      if(!contexts[lower]) contexts[lower] = [];
      const list = contexts[lower];
      const prevCovered = lastCovered[lower];
      if(prevCovered !== undefined && lineIdx <= prevCovered) return; // already inside a previous context block
      if(list.length >= MAX_EXAMPLES_PER_WORD) return;
      const block = buildContextBlock(lines, lineIdx, CONTEXT_BEFORE, CONTEXT_AFTER);
      list.push(block);
      lastCovered[lower] = lineIdx + CONTEXT_AFTER;
    });
  });

  return Object.keys(freq)
    .filter(w => !(midCap.has(w) && !anyLower.has(w)))
    .sort((a,b)=> freq[b]-freq[a])
    .map(w => {
      const blocks = contexts[w] || [];
      const firstMatchLine = blocks.length ? (blocks[0].find(l=>l.isMatch) || {}).text : '';
      return { en:w, count:freq[w], example: firstMatchLine || '', allExamples: blocks };
    });
}

/* Given real candidate words pulled from the subtitle file (with how often each occurs),
   asks the AI to pick the subset worth learning at the user's level and supply meanings —
   it must choose only from this exact list, so every word and example stays grounded in the
   real file rather than being invented. */
async function fetchSrtWordSelection(key, candidates, knownWords, level){
  const knownSample = knownWords.slice(0, 200).join('، ');
  const levelNote = level
    ? `کاربر می‌خواهد کلماتی هم‌سطح ${level} یا بالاتر (طبق چارچوب CEFR) ببیند؛ از میان کاندیدها کلماتی را انتخاب کن که سطحشان تقریباً همین سطح یا سخت‌تر از آن است — کلمات پایین‌تر از این سطح را انتخاب نکن.`
    : (knownSample ? `کلماتی که کاربر از قبل بلد است (برای سنجش سطح او): ${knownSample}.` : 'کاربر هنوز کلمه‌ای ثبت نکرده؛ سطح او را مبتدی تا متوسط در نظر بگیر.');
  const candidateList = candidates.map(c => c.en).join('، ');
  const systemPrompt = 'تو یک مربی یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. در ادامه فهرستی از کلمات واقعی استخراج‌شده از زیرنویس یک فیلم/سریال می‌آید. با توجه به سطح فعلی کاربر، دقیقاً از میان همین فهرست (بدون تغییر املا و بدون افزودن کلمه‌ی تازه) بین ۱۰ تا ۱۵ کلمه انتخاب کن که یادگیری‌شان برای او مفید و هم‌سطح باشد؛ کلمات خیلی بدیهی یا خیلی کمیاب/غیرضروری و همچنین اسم خاص یا نام شخصیت‌ها را انتخاب نکن. برای هر کلمه‌ی انتخابی، معنی فارسی کوتاه و رایج (fa)، یک شرح انگلیسی ساده از معنایش (definition)، و تخمین سطح آن طبق چارچوب CEFR (level, مثل A2 یا B1) بنویس. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown) با این ساختار برگردان: {"words":[{"en":"...","fa":"...","definition":"...","level":"..."}]}.';
  const userMessage = `${levelNote}\nفهرست کلمات کاندید از زیرنویس: ${candidateList}`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned);
  return Array.isArray(obj.words) ? obj.words.map(w=>({
    en:(w.en||'').trim(), fa:(w.fa||'').trim(), definition:(w.definition||'').trim(), level:(w.level||'').trim()
  })).filter(w=>w.en && w.fa) : [];
}

/* Splits a plain pasted text (not a subtitle file) into sentence-ish chunks, so the exact same
   extractSrtVocabulary() context-window logic above can be reused as-is for "افزودن از متن"
   instead of duplicating it for a different kind of input. */
function splitTextIntoSentences(text){
  return text
    .replace(/\r\n/g, '\n')
    .split(/\n+/)
    .flatMap(chunk => chunk.split(/(?<=[.!?])\s+/))
    .map(s=>s.trim())
    .filter(Boolean);
}

/* Same idea and JSON shape as fetchSrtWordSelection above, just worded for a plain pasted text
   ("افزودن از متن" feature) instead of a subtitle file specifically. */
async function fetchTextWordSelection(key, candidates, knownWords, level){
  const knownSample = knownWords.slice(0, 200).join('، ');
  const levelNote = level
    ? `کاربر می‌خواهد کلماتی هم‌سطح ${level} یا بالاتر (طبق چارچوب CEFR) ببیند؛ از میان کاندیدها کلماتی را انتخاب کن که سطحشان تقریباً همین سطح یا سخت‌تر از آن است — کلمات پایین‌تر از این سطح را انتخاب نکن.`
    : (knownSample ? `کلماتی که کاربر از قبل بلد است (برای سنجش سطح او): ${knownSample}.` : 'کاربر هنوز کلمه‌ای ثبت نکرده؛ سطح او را مبتدی تا متوسط در نظر بگیر.');
  const candidateList = candidates.map(c => c.en).join('، ');
  const systemPrompt = 'تو یک مربی یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی. در ادامه فهرستی از کلمات واقعی استخراج‌شده از یک متن انگلیسی که کاربر داده می‌آید. با توجه به سطح فعلی کاربر، دقیقاً از میان همین فهرست (بدون تغییر املا و بدون افزودن کلمه‌ی تازه) بین ۱۰ تا ۲۰ کلمه انتخاب کن که یادگیری‌شان برای او مفید و هم‌سطح باشد؛ کلمات خیلی بدیهی یا خیلی کمیاب/غیرضروری را انتخاب نکن. برای هر کلمه‌ی انتخابی، معنی فارسی کوتاه و رایج (fa)، یک شرح انگلیسی ساده از معنایش (definition)، و تخمین سطح آن طبق چارچوب CEFR (level, مثل A2 یا B1) بنویس. فقط و فقط یک آبجکت JSON معتبر و خالص (بدون Markdown) با این ساختار برگردان: {"words":[{"en":"...","fa":"...","definition":"...","level":"..."}]}.';
  const userMessage = `${levelNote}\nفهرست کلمات کاندید از متن: ${candidateList}`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned);
  return Array.isArray(obj.words) ? obj.words.map(w=>({
    en:(w.en||'').trim(), fa:(w.fa||'').trim(), definition:(w.definition||'').trim(), level:(w.level||'').trim()
  })).filter(w=>w.en && w.fa) : [];
}

/* Finds real idioms/idiomatic expressions in the actual subtitle text (not single words, which
   extractSrtVocabulary already handles locally). Idioms are multi-word phrases, so they can't be
   found with simple frequency counting — this sends a (size-capped, evenly-sampled if needed)
   chunk of the real subtitle lines to the AI and asks it to point out idioms it actually sees,
   quoting the exact line each one came from. Every returned idiom is then checked against the
   real lines and dropped if its quoted line doesn't literally exist in the file, so nothing
   invented slips through. */
async function fetchSrtIdiomSelection(key, lines, knownWords, level){
  const MAX_CHARS = 12000;
  let sampleLines = lines;
  if(lines.join('\n').length > MAX_CHARS){
    const approxTargetLines = Math.max(50, Math.floor(MAX_CHARS/40));
    const step = Math.max(1, Math.ceil(lines.length/approxTargetLines));
    sampleLines = lines.filter((_,i)=> i % step === 0);
  }
  let fullText = sampleLines.join('\n');
  if(fullText.length > MAX_CHARS) fullText = fullText.slice(0, MAX_CHARS);

  const knownSample = knownWords.slice(0, 200).join('، ');
  const levelNote = level
    ? `فقط اصطلاحاتی را انتخاب کن که سطح زبانی‌شان تقریباً ${level} (طبق چارچوب CEFR) است.`
    : 'سطح اصطلاحات پیشنهادی را متناسب با یک زبان‌آموز مبتدی تا متوسط در نظر بگیر.';
  const systemPrompt = 'تو یک مربی زبان انگلیسی برای فارسی‌زبانان هستی. در ادامه بخشی از خطوط واقعی زیرنویس یک فیلم/سریال می‌آید (هر خط در یک سطر جدا). اصطلاحات و عبارات idiomatic انگلیسی (نه تک‌کلمه‌های ساده) را که عیناً و کلمه‌به‌کلمه در همین متن آمده‌اند پیدا کن. ' + levelNote + ' برای هر اصطلاح: دقیقاً همان خط از متن ورودی که اصطلاح در آن آمده را بدون کوچک‌ترین تغییری در فیلد "line" کپی کن (باید عیناً با یکی از خط‌های ورودی یکی باشد)، معنای فارسی کوتاه در "fa"، و توضیح ساده انگلیسی در "definition" بنویس. اگر اصطلاح واقعی پیدا نکردی، آرایه خالی برگردان — چیزی از خودت اختراع نکن. فقط و فقط یک آبجکت JSON خالص (بدون Markdown) با این ساختار برگردان: {"idioms":[{"en":"...","fa":"...","definition":"...","line":"..."}]}';
  const userMessage = `${knownSample ? `کلماتی که کاربر می‌داند: ${knownSample}\n` : ''}متن زیرنویس:\n${fullText}`;
  const raw = await geminiOnce(key, systemPrompt, userMessage);
  let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  const obj = JSON.parse(cleaned);
  const rawIdioms = Array.isArray(obj.idioms) ? obj.idioms : [];

  const lineIndexMap = new Map();
  lines.forEach((l, idx)=>{ if(!lineIndexMap.has(l)) lineIndexMap.set(l, idx); });

  const out = [];
  rawIdioms.forEach(it=>{
    const en = (it.en||'').trim();
    const fa = (it.fa||'').trim();
    const definition = (it.definition||'').trim();
    const line = (it.line||'').trim();
    if(!en || !fa || !line) return;
    if(!lineIndexMap.has(line)) return; // not grounded in the real subtitle text — discard rather than risk a hallucinated example
    out.push({ en, fa, definition, lineIdx: lineIndexMap.get(line) });
  });
  return out;
}

/* Builds one prompt (system + user message) an EXTERNAL AI (ChatGPT or any other model — no
   in-app API key/quota used) can answer in one shot to power the "تحلیل زیرنویس و پیشنهاد کلمات"
   feature (and, since the two now share one AI answer, the in-player highlight set too — see the
   analyze-panel submit handler). Same JSON shape as before, still one round-trip. The AI now picks
   words itself by actually reading the real subtitle lines (always attached, capped/sampled) and
   matching them to the CEFR level — it is NOT restricted to a pre-extracted candidate list anymore
   (previously it could only choose from words the app's own JS vocabulary-extraction had already
   picked out, which meant its "analysis" was really just filtering/leveling that list, not real
   reading). The locally-extracted candidate words (with or without counts) are no longer sent to
   the AI at all — not the words, not the counts, not even as a "priority hint" — the AI picks
   entirely on its own by reading the real subtitle text. The `candidates` param is only still
   accepted here so callers don't need to change their call sites; it's unused inside this
   function now (candidates are still used elsewhere, for grounding the AI's picks against real
   local data — see parseSrtWordResponse). knownWords is still attached so it can actively avoid
   suggesting words the person already knows. Idiom-finding is still only requested when
   includeIdioms is true, reusing the same attached text. */
function buildSrtWordPrompt(candidates, lines, knownWords, level, includeIdioms){
  const levelLabel = level ? (CEFR_LEVELS.find(l=>l.value===level)||{}).label || level : '';

  let systemPrompt = `تو یک مربی یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی، مخصوص یک زبان‌آموز در سطح ${level ? `«${levelLabel}» (${level})` : 'مبتدی تا متوسط (چون هنوز سطح مشخص نکرده)'}. در ادامه‌ی پیام کاربر، خطوط واقعی زیرنویس یک فیلم/سریال می‌آید. با خواندن دقیق خودِ همین متن (نه حدس زدن از روی یک کلمه‌ی تنها)، خودت مستقلاً از میان کلماتی که واقعاً و عیناً در همین متن آمده‌اند (بدون تغییر املا) هرچند کلمه که یادگیری‌شان برای همین کاربر مفید و هم‌سطح ${level ? levelLabel : 'او'} یا کمی بالاتر باشد انتخاب کن (کلمات پایین‌تر از سطح کاربر را انتخاب نکن) — به هیچ تعداد خاصی محدود نباش. کلمات خیلی پایه/بدیهی (مثل be, have, go, this, and)، کلمات خیلی نادر یا غیرضروری، و اسم خاص یا نام شخصیت‌ها را انتخاب نکن. برای هر کلمه‌ی انتخابی، معنی فارسی کوتاه و رایج (fa) را دقیقاً بر اساس همان کاربردی که در متن واقعی زیرنویس دارد بنویس (نه صرفاً معنی عمومی دیکشنری، اگر با کاربرد این متن فرق دارد)، یک شرح انگلیسی ساده از معنایش (definition)، و تخمین سطح آن طبق چارچوب CEFR (level, مثل A2 یا B1) بنویس.`;

  let userMessage = '';
  let schema = '{"words":[{"en":"...","fa":"...","definition":"...","level":"..."}]';

  if(includeIdioms){
    systemPrompt += ' علاوه بر این، از میان همان خطوط واقعی زیرنویس، اصطلاحات و عبارات idiomatic انگلیسی (نه تک‌کلمه‌های ساده) را که عیناً و کلمه‌به‌کلمه در همان متن آمده‌اند پیدا کن، هم‌سطح همان سطح بالا. برای هر اصطلاح: دقیقاً همان خط از متن ورودی که اصطلاح در آن آمده را بدون کوچک‌ترین تغییری در فیلد "line" کپی کن (باید عیناً با یکی از خط‌های ورودی یکی باشد)، معنای فارسی کوتاه در "fa"، و توضیح ساده انگلیسی در "definition" بنویس. اگر اصطلاح واقعی پیدا نکردی، آرایه‌ی idioms را خالی برگردان — چیزی از خودت اختراع نکن.';
    schema += ',"idioms":[{"en":"...","fa":"...","definition":"...","line":"..."}]';
  }

  // Real subtitle text is always attached (capped/sampled so huge files stay a reasonable prompt
  // size) — this is the actual source the AI reads and picks/defines words from now.
  const MAX_CHARS = 12000;
  let sampleLines = lines;
  if(lines.join('\n').length > MAX_CHARS){
    const approxTargetLines = Math.max(50, Math.floor(MAX_CHARS/40));
    const step = Math.max(1, Math.ceil(lines.length/approxTargetLines));
    sampleLines = lines.filter((_,i)=> i % step === 0);
  }
  let fullText = sampleLines.join('\n');
  if(fullText.length > MAX_CHARS) fullText = fullText.slice(0, MAX_CHARS);
  userMessage += `خطوط واقعی زیرنویس:\n${fullText}`;
  if(!level) userMessage += `\n\n(کاربر هنوز سطح زبانش را در ⚙ تنظیمات مشخص نکرده — طبق راهنمای بالا مبتدی تا متوسط در نظر بگیر.)`;
  // Deliberately NOT telling the AI which words the person already knows (used to send that list
  // here with a "don't suggest these again" note): with a large vocabulary that list eats prompt
  // space and still isn't reliable — some already-known words would slip through anyway, and some
  // genuinely new ones could get skipped just for loosely resembling a known one. Instead the AI
  // picks freely from the real text, and afterward every already-known word among its picks is
  // simply highlighted in a different color (see buildKnownLevelWordSet/isWordAlreadyKnown) rather
  // than being filtered out — so nothing worth reviewing is silently lost either way.

  schema += '}';
  systemPrompt += ` فقط و فقط یک آبجکت JSON معتبر و خالص برگردان — بدون Markdown، بدون فنس \`\`\`json، بدون هیچ توضیح قبل یا بعدش — دقیقاً با این ساختار: ${schema}.`;

  return { systemPrompt, userMessage };
}

/* Best-effort JSON object extraction from whatever text a person pasted back from an external AI.
   External chat AIs are inconsistent — a stray "Here's the JSON:" before it, a closing ``` fence
   without an opening one, smart quotes typed/auto-corrected on some phones, a trailing comma
   before a closing bracket, extra blank lines, etc. — so a plain JSON.parse on the raw textarea
   value fails far more often than it should. This tries a series of progressively more forgiving
   fixes and only gives up (throwing the ORIGINAL parse error, which is more informative than any
   later one) once none of them produce valid JSON. Never invents/repairs actual field VALUES —
   only fixes syntax noise around otherwise-intact JSON. */
function extractJsonObject(raw){
  const firstAttempt = (raw||'').trim();
  let firstErr = null;
  try{ return JSON.parse(firstAttempt); }catch(e){ firstErr = e; }

  // Strip ```json / ``` fences wherever they are (not just exactly at the start/end), and any
  // leading/trailing prose the AI added around the object despite being told not to.
  let text = firstAttempt.replace(/```json/gi, '```').replace(/```/g, '').trim();

  // Keep only from the first "{" to the last "}" — drops any "Here is the JSON:" preamble or
  // "Let me know if..." postamble some models add regardless of instructions.
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start !== -1 && end !== -1 && end > start){
    text = text.slice(start, end + 1);
  }
  try{ return JSON.parse(text); }catch(e){ /* keep trying */ }

  // Common small syntax fixes: curly/smart quotes → straight quotes, trailing commas before a
  // closing ] or }.
  let repaired = text
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/,\s*([\]}])/g, '$1');
  try{ return JSON.parse(repaired); }catch(e){ /* keep trying */ }

  // Very common real-world case: the AI quoted a line of dialogue that itself contains quote
  // marks (e.g. "line":"Ugh, "let it go.""), without escaping the inner quotes — breaks JSON
  // syntax even though every field is otherwise intact. Re-tokenize character by character: a
  // quote only ends a string if what follows it (skipping whitespace) looks like a real JSON
  // delimiter (, } ] or :); any other quote is content and gets escaped instead.
  try{
    let out = '';
    let inString = false;
    for(let i = 0; i < repaired.length; i++){
      const ch = repaired[i];
      if(inString){
        if(ch === '\\'){ out += ch + (repaired[i+1]||''); i++; continue; }
        if(ch === '"'){
          let j = i + 1;
          while(j < repaired.length && /\s/.test(repaired[j])) j++;
          const next = repaired[j];
          if(next===undefined || ',}]:'.includes(next)){ out += '"'; inString = false; continue; }
          out += '\\"'; continue;
        }
        out += ch; continue;
      }else{
        if(ch === '"'){ inString = true; out += ch; continue; }
        out += ch; continue;
      }
    }
    return JSON.parse(out);
  }catch(e){ /* keep trying */ }

  // Last resort: some models wrap the whole thing in single quotes instead of double quotes for
  // keys/string values. Only attempt this if plain double-quote parsing truly failed.
  try{
    const asDoubleQuoted = repaired.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, (m, inner) => '"' + inner.replace(/"/g, '\\"') + '"');
    return JSON.parse(asDoubleQuoted);
  }catch(e){ /* give up */ }

  throw firstErr;
}

/* Parses whatever JSON the person pasted back from the external AI and grounds it against the
   real local data — exactly the same grounding fetchSrtWordSelection/fetchSrtIdiomSelection used
   to do after their own (internal) AI call: each word is matched back to its real candidate (for
   its real example line), and each idiom is discarded unless its quoted "line" literally exists
   in the real subtitle text, so nothing invented by the external AI slips through. */
function parseSrtWordResponse(raw, candidates, lines){
  let obj;
  try{
    obj = extractJsonObject(raw);
  }catch(e){
    throw new Error('این متن یک JSON معتبر نیست. مطمئن شو دقیقاً همون خروجی هوش مصنوعی رو (بدون توضیح اضافه‌ی خودت قبل یا بعدش) پیست کردی.');
  }
  if(!obj || typeof obj !== 'object') throw new Error('پاسخ به‌شکل یک آبجکت JSON نبود.');

  const byWord = {};
  (candidates||[]).forEach(c=>{ byWord[c.en] = c; });

  // Not every AI-picked word will be in the (now non-restrictive) candidate list, since the AI
  // is free to pick any real word straight from the text. For those, ground it directly against
  // the real subtitle lines instead: it must appear as a real whole word somewhere in the text,
  // or it's discarded as a likely hallucination — same anti-fabrication guarantee as before, just
  // checked against the source text rather than the pre-extracted list.
  const wordLineIdx = {};
  (lines||[]).forEach((l, idx)=>{
    if(!l) return;
    const matches = l.match(/[A-Za-z']+/g);
    if(!matches) return;
    matches.forEach(m=>{
      const lower = m.toLowerCase();
      if(wordLineIdx[lower]===undefined) wordLineIdx[lower] = idx;
    });
  });

  const wordItems = (Array.isArray(obj.words) ? obj.words : []).map(w=>{
    const en = (w.en||'').trim(), fa = (w.fa||'').trim();
    if(!en || !fa) return null;
    const lower = en.trim().toLowerCase();
    const c = byWord[lower];
    if(c) return { en, fa, definition:(w.definition||'').trim(), example: c.example, allExamples: c.allExamples, type:'word', level:(w.level||'').trim() };
    const idx = wordLineIdx[lower];
    if(idx===undefined) return null; // not found anywhere in the real subtitle text — discard
    const block = buildContextBlock(lines, idx);
    const firstMatchLine = (block.find(l=>l.isMatch) || {}).text || lines[idx] || '';
    return { en, fa, definition:(w.definition||'').trim(), example: firstMatchLine, allExamples:[block], type:'word', level:(w.level||'').trim() };
  }).filter(Boolean);

  const lineIndexMap = new Map();
  (lines||[]).forEach((l, idx)=>{ if(!lineIndexMap.has(l)) lineIndexMap.set(l, idx); });
  const idiomItems = (Array.isArray(obj.idioms) ? obj.idioms : []).map(it=>{
    const en = (it.en||'').trim(), fa = (it.fa||'').trim(), line = (it.line||'').trim();
    if(!en || !fa || !line) return null;
    if(!lineIndexMap.has(line)) return null; // not grounded in the real subtitle text — discard
    const idx = lineIndexMap.get(line);
    return { en, fa, definition:(it.definition||'').trim(), example: lines[idx], allExamples:[buildContextBlock(lines, idx)], type:'idiom' };
  }).filter(Boolean);

  if(wordItems.length===0 && idiomItems.length===0) throw new Error('هیچ کلمه یا اصطلاح معتبری در پاسخ پیدا نشد.');
  return wordItems.concat(idiomItems);
}

/* One-shot version of buildSrtWordPrompt + buildBatchFullCardPrompt merged into a single prompt/
   single AI call, for the "📄📦 همه‌ی مراحل با هم" button: the AI both picks the words/idioms AND
   writes each one's full card (grammar paragraph, in-context/general meanings, practical notes,
   4 example sentences) in the same response, so there's no separate second round trip needed for
   the cards. Reuses the exact same selection instructions/schema fields as the two source prompts
   so parseCombinedAnalyzeCardResponse below can ground/apply results the same way the separate
   flows already do. */
function buildCombinedAnalyzeCardPrompt(candidates, lines, knownWords, level, includeIdioms){
  const levelLabel = level ? (CEFR_LEVELS.find(l=>l.value===level)||{}).label || level : '';

  let systemPrompt = `تو یک مربی یادگیری واژگان زبان انگلیسی برای فارسی‌زبانان هستی، مخصوص یک زبان‌آموز در سطح ${level ? `«${levelLabel}» (${level})` : 'مبتدی تا متوسط (چون هنوز سطح مشخص نکرده)'}. در ادامه‌ی پیام کاربر، خطوط واقعی زیرنویس یک فیلم/سریال می‌آید. با خواندن دقیق خودِ همین متن (نه حدس زدن از روی یک کلمه‌ی تنها)، خودت مستقلاً از میان کلماتی که واقعاً و عیناً در همین متن آمده‌اند (بدون تغییر املا) هرچند کلمه که یادگیری‌شان برای همین کاربر مفید و هم‌سطح ${level ? levelLabel : 'او'} یا کمی بالاتر باشد انتخاب کن (کلمات پایین‌تر از سطح کاربر را انتخاب نکن) — به هیچ تعداد خاصی محدود نباش. کلمات خیلی پایه/بدیهی (مثل be, have, go, this, and)، کلمات خیلی نادر یا غیرضروری، و اسم خاص یا نام شخصیت‌ها را انتخاب نکن.`;

  if(includeIdioms){
    systemPrompt += ' علاوه بر این، از میان همان خطوط واقعی زیرنویس، اصطلاحات و عبارات idiomatic انگلیسی (نه تک‌کلمه‌های ساده) را که عیناً و کلمه‌به‌کلمه در همان متن آمده‌اند پیدا کن، هم‌سطح همان سطح بالا. اگر اصطلاح واقعی پیدا نکردی، آرایه‌ی idioms را خالی برگردان — چیزی از خودت اختراع نکن.';
  }

  systemPrompt += ` برای تک‌تک همه‌ی کلمات/اصطلاحاتی که همین‌طور انتخاب کردی — بدون هیچ استثنا — هم یک معنی فارسی کوتاه و رایج (fa) دقیقاً بر اساس کاربرد واقعی‌اش در همین متن زیرنویس، یک شرح انگلیسی ساده (definition)، تخمین سطح CEFR (level)، و هم یک کارت آموزشی کامل بنویس — دقیقاً به همان کامل‌بودن و جزئیاتی که اگر فقط همان یکی از تو خواسته می‌شد می‌نوشتی. زیاد بودن تعداد کلمات بهانه‌ای برای خلاصه یا کوتاه کردن هیچ‌کدام نیست؛ اگر پاسخ طولانی شود اشکالی ندارد. کارت کامل هر کلمه/اصطلاح شامل این فیلدهاست:
"paragraph": ۲ تا ۳ جمله‌ی فارسی پیوسته و ساده که می‌گوید این کلمه/اصطلاح دقیقاً چه معنایی در همین بافت زیرنویس دارد — فقط اگر واقعاً نکته‌ی مفیدی هست اضافه کن (مثلاً فرق با معنی رایج‌تر)، وگرنه فقط معنی را کوتاه بگو.
"inContextMeanings": آرایه‌ی ۱ تا ۳ معادل فارسی کوتاه مخصوص همین کاربرد.
"generalMeanings": آرایه‌ی ۲ تا ۴ معادل فارسی کوتاه رایج این کلمه به‌طور کلی.
"practicalNotes": متن ساده (نه JSON تو در تو)، با این قالب: هر عنوان با ** ** پررنگ و هر مورد زیرش با «- » شروع شود؛ فقط مواردی که واقعاً نکته‌ی مفیدی دارند: **ترکیب‌های رایج**، **اصطلاح‌ها** (اگر در یک عبارت رایج/فعل دوکلمه‌ای به‌کار می‌رود)، **کلمات مشابه** (۲ تا ۳ مورد با یک تفاوت کوتاه)، **نکته‌ی رایج فارسی‌زبانان** (اگر اشتباه معمولی وجود دارد)، **مترادف‌ها** (۲ تا ۴ مورد، جدا شده با «، »).
"examples": آرایه‌ای با دقیقاً ۴ جمله‌ی نمونه‌ی انگلیسی طبیعی و متفاوت از هم با همین کلمه، هرکدام با فیلد "en" و ترجمه‌ی روان فارسی در "fa"؛ جمله‌ی واقعی خودِ زیرنویس را عیناً تکرار نکن.`;

  let userMessage = '';
  let wordFields = '"en":"...","fa":"...","definition":"...","level":"...","paragraph":"...","inContextMeanings":["..."],"generalMeanings":["..."],"practicalNotes":"...","examples":[{"en":"...","fa":"..."}]';
  let schema = `{"words":[{${wordFields}}]`;
  if(includeIdioms){
    schema += `,"idioms":[{"en":"...","fa":"...","definition":"...","line":"...","paragraph":"...","inContextMeanings":["..."],"generalMeanings":["..."],"practicalNotes":"...","examples":[{"en":"...","fa":"..."}]}]`;
    systemPrompt += ' برای هر اصطلاح، دقیقاً همان خط از متن ورودی که اصطلاح در آن آمده را بدون کوچک‌ترین تغییری در فیلد "line" کپی کن (باید عیناً با یکی از خط‌های ورودی یکی باشد).';
  }
  schema += '}';

  const MAX_CHARS = 12000;
  let sampleLines = lines;
  if(lines.join('\n').length > MAX_CHARS){
    const approxTargetLines = Math.max(50, Math.floor(MAX_CHARS/40));
    const step = Math.max(1, Math.ceil(lines.length/approxTargetLines));
    sampleLines = lines.filter((_,i)=> i % step === 0);
  }
  let fullText = sampleLines.join('\n');
  if(fullText.length > MAX_CHARS) fullText = fullText.slice(0, MAX_CHARS);
  userMessage += `خطوط واقعی زیرنویس:\n${fullText}`;
  if(!level) userMessage += `\n\n(کاربر هنوز سطح زبانش را در ⚙ تنظیمات مشخص نکرده — طبق راهنمای بالا مبتدی تا متوسط در نظر بگیر.)`;

  systemPrompt += ` فقط و فقط یک آبجکت JSON معتبر و خالص برگردان — بدون Markdown، بدون فنس \`\`\`json، بدون هیچ توضیح قبل یا بعدش — دقیقاً با این ساختار: ${schema}.`;

  return { systemPrompt, userMessage };
}

/* Parses the combined prompt's response: grounds the chosen words/idioms against the real text
   exactly like parseSrtWordResponse (so nothing hallucinated slips through), and — since each item
   already carries its full card fields in the same object this time — also splits off a
   `results` map in the exact shape applyBatchFullCardResults expects, so the existing, already-
   tested apply logic can write the cards everywhere (vsyncLevelData, episodeSuggestions, saved
   `words`) without a second AI round trip. Returns { items, results }. */
function parseCombinedAnalyzeCardResponse(raw, candidates, lines){
  let obj;
  try{
    obj = extractJsonObject(raw);
  }catch(e){
    throw new Error('این متن یک JSON معتبر نیست. مطمئن شو دقیقاً همون خروجی هوش مصنوعی رو (بدون توضیح اضافه‌ی خودت قبل یا بعدش) پیست کردی.');
  }
  if(!obj || typeof obj !== 'object') throw new Error('پاسخ به‌شکل یک آبجکت JSON نبود.');

  const byWord = {};
  (candidates||[]).forEach(c=>{ byWord[c.en] = c; });
  const wordLineIdx = {};
  (lines||[]).forEach((l, idx)=>{
    if(!l) return;
    const matches = l.match(/[A-Za-z']+/g);
    if(!matches) return;
    matches.forEach(m=>{
      const lower = m.toLowerCase();
      if(wordLineIdx[lower]===undefined) wordLineIdx[lower] = idx;
    });
  });

  const cardFieldsOf = (w)=>{
    const exList = Array.isArray(w.examples) ? w.examples.map(e=>({en:(e.en||'').trim(), fa:(e.fa||'').trim()})).filter(e=>e.en) : [];
    const grammar = {
      paragraph: (w.paragraph||'').trim(),
      inContextMeanings: Array.isArray(w.inContextMeanings) ? w.inContextMeanings.filter(x=>typeof x==='string' && x.trim()) : [],
      generalMeanings: Array.isArray(w.generalMeanings) ? w.generalMeanings.filter(x=>typeof x==='string' && x.trim()) : []
    };
    const practicalNotes = (w.practicalNotes||'').trim();
    const hasCard = !!(grammar.paragraph || grammar.inContextMeanings.length || grammar.generalMeanings.length || practicalNotes || exList.length);
    return hasCard ? { grammar, practicalNotes, moreExamples: exList } : null;
  };

  const results = {};
  const wordItems = (Array.isArray(obj.words) ? obj.words : []).map(w=>{
    const en = (w.en||'').trim(), fa = (w.fa||'').trim();
    if(!en || !fa) return null;
    const lower = en.trim().toLowerCase();
    const c = byWord[lower];
    let item;
    if(c) item = { en, fa, definition:(w.definition||'').trim(), example: c.example, allExamples: c.allExamples, type:'word', level:(w.level||'').trim() };
    else{
      const idx = wordLineIdx[lower];
      if(idx===undefined) return null; // not found anywhere in the real subtitle text — discard
      const block = buildContextBlock(lines, idx);
      const firstMatchLine = (block.find(l=>l.isMatch) || {}).text || lines[idx] || '';
      item = { en, fa, definition:(w.definition||'').trim(), example: firstMatchLine, allExamples:[block], type:'word', level:(w.level||'').trim() };
    }
    const card = cardFieldsOf(w);
    if(card) results[lower] = card;
    return item;
  }).filter(Boolean);

  const lineIndexMap = new Map();
  (lines||[]).forEach((l, idx)=>{ if(!lineIndexMap.has(l)) lineIndexMap.set(l, idx); });
  const idiomItems = (Array.isArray(obj.idioms) ? obj.idioms : []).map(it=>{
    const en = (it.en||'').trim(), fa = (it.fa||'').trim(), line = (it.line||'').trim();
    if(!en || !fa || !line) return null;
    if(!lineIndexMap.has(line)) return null; // not grounded in the real subtitle text — discard
    const idx = lineIndexMap.get(line);
    const card = cardFieldsOf(it);
    if(card) results[en.trim().toLowerCase()] = card;
    return { en, fa, definition:(it.definition||'').trim(), example: lines[idx], allExamples:[buildContextBlock(lines, idx)], type:'idiom' };
  }).filter(Boolean);

  if(wordItems.length===0 && idiomItems.length===0) throw new Error('هیچ کلمه یا اصطلاح معتبری در پاسخ پیدا نشد.');
  return { items: wordItems.concat(idiomItems), results };
}

/* The "📄 تحلیل زیرنویس و پیشنهاد کلمات" panel: copy-the-prompt / open an external AI (ChatGPT or
   any other) / paste-the-answer-back — same fallback-to-external-AI pattern as
   renderSrtTranslatePanel, used here so this feature never touches the in-app Gemini key/quota.
   mode 'new' builds a fresh prompt from the currently-selected .srt file and REPLACES
   episodeSuggestions; mode 'more' (from the "➕ کلمات بیشتر" button) builds a prompt for the
   remaining, not-yet-shown candidates only (no idioms) and APPENDS to episodeSuggestions. */
function renderSrtAnalyzePanel(mode, panelSelector){
  mode = mode || 'new';
  panelSelector = panelSelector || '#epSrtAnalyzePanel';
  const panel = episodePageEl && episodePageEl.querySelector(panelSelector);
  if(!panel) return;
  const isMore = mode==='more';
  const isCombined = mode==='combined';
  panel.style.display = 'block';
  panel.dataset.mode = mode;
  const fileInput = episodePageEl.querySelector('#epSrtFile');
  const hasPickedFile = !!(fileInput && fileInput.files && fileInput.files[0]);
  // Even with no file freshly picked in the input above (browsers never remember a file across
  // sessions), the raw text of the last .srt that WAS picked is cached in epSyncSrtRawText (see
  // saveVsyncLastState/restoreVsyncSrtFromStorage) — so the analysis can still run off that,
  // and the person doesn't have to re-browse for the same file just to press this button again.
  const hasFile = hasPickedFile || !!epSyncSrtRawText;
  const hasResults = episodeSuggestions.length>0;
  const needsFile = !isMore; // both 'new' and 'combined' need a file; 'more' reuses the existing pool

  panel.innerHTML = `
    <div class="ai-flow-card">
    <div class="ai-flow-badge-row">
      <span class="ai-flow-badge ${isCombined ? 'mode-combined' : (isMore ? 'mode-more' : 'mode-new')}">
        ${isMore ? '➕ کلمات بیشتر' : (isCombined ? '📦 تحلیل + کارت کامل (یکجا)' : '📄 تحلیل زیرنویس')}
      </span>
      <button type="button" id="epSrtAnalyzeHelpBtn" class="ai-flow-help-btn" title="راهنما">ⓘ</button>
    </div>
    <div id="epSrtAnalyzeHelpText" class="ai-flow-desc" style="display:none;">
      ${isMore
        ? 'یک درخواست برای یک دسته‌ی تازه از کلمات (به‌جز کلماتی که همین الان توی فهرست پایین هستن) آماده می‌کنه.'
        : isCombined
          ? 'یک درخواست واحد از روی کلمات واقعی همین زیرنویس آماده می‌کنه تا یک هوش مصنوعی خارجی (ChatGPT یا هر مدل دیگه) هم کلمات مناسب سطحت رو انتخاب و معنی کنه، هم برای همون‌ها کارت آموزشی کامل (دستور زبان، نکات کاربردی، نمونه‌جمله) بسازه — همه در یک پاسخ، بدون استفاده از سهمیه‌ی هوش مصنوعی داخل اپ.'
          : 'یک درخواست از روی کلمات واقعی همین زیرنویس آماده می‌کنه تا یک هوش مصنوعی خارجی (ChatGPT یا هر مدل دیگه) کلمات مناسب سطحت رو انتخاب و معنی کنه — بدون استفاده از سهمیه‌ی هوش مصنوعی داخل اپ.'}
      جواب رو که گرفتی همینجا پیست کن تا به فهرست کلمات پایین اضافه بشه${isCombined ? ' و کارت کامل هرکدوم هم ذخیره بشه' : ''}.
    </div>
    ${(needsFile && !hasFile) ? `<div class="ai-note">اول از بالا یه فایل زیرنویس (.srt) انتخاب کن.</div>` : ''}
    ${(needsFile && hasFile && !hasPickedFile) ? `<div class="ai-note">📌 از همون زیرنویسی که قبلاً برای این قسمت انتخاب کرده بودی (${escapeHtml(epSyncSrtFileName||'')}) استفاده می‌شه — لازم نیست دوباره فایل رو انتخاب کنی.</div>` : ''}

    <div class="ai-flow-step ai-flow-step-first">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۱</span>کپی درخواست</div>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-small" id="epSrtAnalyzeShareBtn" ${(needsFile && !hasFile)?'disabled':''}>📤 اشتراک‌گذاری / کپی متن درخواست</button>
      </div>
      <div id="epSrtAnalyzeCopyMsg" class="ai-flow-hint" style="display:none;"></div>
      <textarea id="epSrtAnalyzePromptBox" readonly class="ai-flow-textarea"></textarea>
    </div>

    <div class="ai-flow-step">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۲</span>پیست جواب</div>
      <textarea id="epSrtAnalyzePasteBox" class="ai-flow-textarea" placeholder="آبجکت JSON پاسخ رو اینجا پیست کن..."></textarea>
    </div>

    <div class="ai-flow-step">
      <div class="ai-flow-step-label"><span class="ai-flow-step-num">۳</span>ثبت</div>
      <div class="actions">
        <button type="button" class="btn btn-primary btn-small" id="epSrtAnalyzeSubmitBtn">✅ ${isMore ? 'افزودن به فهرست' : (isCombined ? 'ثبت کلمات + کارت‌ها' : 'ثبت کلمات')}</button>
        ${(!isMore && hasResults) ? `<button type="button" class="btn btn-ghost btn-small" id="epSrtAnalyzeClearBtn">🗑 حذف پیشنهادهای فعلی</button>` : ''}
      </div>
      <div id="epSrtAnalyzeErr" class="ai-note" style="display:none;"></div>
    </div>
    </div>`;

  const helpBtn = panel.querySelector('#epSrtAnalyzeHelpBtn');
  const helpText = panel.querySelector('#epSrtAnalyzeHelpText');
  if(helpBtn && helpText) helpBtn.onclick = ()=>{
    const showing = helpText.style.display !== 'none';
    helpText.style.display = showing ? 'none' : 'block';
  };

  panel.querySelector('#epSrtAnalyzeShareBtn').onclick = async ()=>{
    const btn = panel.querySelector('#epSrtAnalyzeShareBtn');
    const errEl = panel.querySelector('#epSrtAnalyzeErr');
    errEl.style.display = 'none';
    btn.disabled = true;
    const origText = btn.textContent;
    btn.textContent = 'در حال آماده‌سازی...';
    try{
      let candidates, lines, knownWords, includeIdioms;
      if(isMore){
        if(srtCandidatesPool.length===0) throw new Error('اول یک‌بار «تحلیل زیرنویس» رو انجام بده.');
        const shownLower = new Set(episodeSuggestions.map(w=>w.en.trim().toLowerCase()));
        const remaining = srtCandidatesPool.filter(c=>!shownLower.has(c.en));
        if(remaining.length===0) throw new Error('کلمه‌ی جدید دیگری در این زیرنویس باقی نمانده.');
        candidates = remaining.slice(0, 150);
        lines = srtFullLines;
        knownWords = words.map(w=>w.en).filter(Boolean).concat([...shownLower]);
        includeIdioms = false;
      }else{
        const file = fileInput.files && fileInput.files[0];
        // Use the freshly-picked file if there is one; otherwise fall back to the cached text of
        // whatever .srt was last picked for this episode (see hasFile comment above) instead of
        // forcing the person to re-browse for the exact same file.
        const text = file ? await file.text() : epSyncSrtRawText;
        if(!text) throw new Error('اول یک فایل srt رو انتخاب کن.');
        lines = parseSrtLines(text);
        if(lines.length===0) throw new Error('متنی از این فایل استخراج نشد؛ مطمئن شو فایل srt معتبر است.');
        srtFullLines = lines;
        srtHighlightWord = null;
        knownWords = words.map(w=>w.en).filter(Boolean);
        const knownLower = new Set(knownWords.map(w=>w.trim().toLowerCase()));
        loadWordSet(KNOWN_WORDS_KEY).forEach(w=> knownLower.add(w));
        loadWordSet(IGNORED_WORDS_KEY).forEach(w=> knownLower.add(w));
        srtCandidatesPool = extractSrtVocabulary(lines, knownLower);
        candidates = srtCandidatesPool.slice(0, 150);
        // Idioms are always requested alongside single words now — highlighting in the player
        // treats an idiom as one whole tappable unit too (see wordSpansHtml), so there's no
        // reason to ever skip asking for them.
        includeIdioms = true;
      }

      const { systemPrompt, userMessage } = isCombined
        ? buildCombinedAnalyzeCardPrompt(candidates, lines, knownWords, episodeLevel, includeIdioms)
        : buildSrtWordPrompt(candidates, lines, knownWords, episodeLevel, includeIdioms);
      const fullText = systemPrompt + '\n\n' + userMessage;
      const box = panel.querySelector('#epSrtAnalyzePromptBox');
      box.value = fullText;
      const msg = panel.querySelector('#epSrtAnalyzeCopyMsg');
      if(navigator.share){
        try{ await navigator.share({ text: fullText }); return; }
        catch(e2){ /* cancelled or failed — fall through to clipboard copy below */ }
      }
      try{
        await navigator.clipboard.writeText(fullText);
        if(msg){ msg.textContent = '✅ کپی شد — برو تو ChatGPT (یا هر هوش مصنوعی دیگه) پیستش کن.'; msg.style.display = 'block'; }
      }catch(e3){
        box.focus();
        box.select();
        if(msg){ msg.textContent = 'کپی خودکار نشد؛ متن بالا انتخاب شد، Ctrl+C رو بزن.'; msg.style.display = 'block'; }
      }
    }catch(e){
      errEl.textContent = e && e.message ? e.message : String(e);
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.textContent = origText;
    }
  };

  panel.querySelector('#epSrtAnalyzeSubmitBtn').onclick = ()=>{
    const errEl = panel.querySelector('#epSrtAnalyzeErr');
    errEl.style.display = 'none';
    const raw = panel.querySelector('#epSrtAnalyzePasteBox').value;
    try{
      if(!raw.trim()) throw new Error('چیزی پیست نشده');
      // Same fallback as the highlight panel: use whichever pool/lines is populated, since a
      // response generated from either panel's "share" click grounds correctly against either.
      const groundCandidates = srtCandidatesPool.length ? srtCandidatesPool : vsyncLevelCandidates;
      const groundLines = srtFullLines.length ? srtFullLines : vsyncLevelLines;
      let newItems, combinedResults = null;
      if(isCombined){
        const parsed = parseCombinedAnalyzeCardResponse(raw, groundCandidates, groundLines);
        newItems = parsed.items;
        combinedResults = parsed.results;
      }else{
        newItems = parseSrtWordResponse(raw, groundCandidates, groundLines);
      }
      if(isMore){
        const shownLower = new Set(episodeSuggestions.map(w=>w.en.trim().toLowerCase()));
        const uniqueNew = newItems.filter(w=>!shownLower.has(w.en.trim().toLowerCase()));
        if(uniqueNew.length===0) throw new Error('همه‌ی کلمات این پاسخ از قبل توی فهرست بودن.');
        episodeSuggestions = episodeSuggestions.concat(uniqueNew);
        episodeMoreError = null;
      }else{
        episodeSuggestions = newItems;
        episodeSelected = new Set();
        episodeTypeFilter = 'all';
        episodeError = null;
        episodeIdiomError = null;
      }
      // Same single AI answer now also drives the in-player caption highlight (both words and
      // idioms — an idiom phrase gets highlighted/tapped as one whole unit, see wordSpansHtml)
      // — no separate "های‌لایت" prompt/paste round trip needed anymore; this is the one flow.
      if(episodeSuggestions.length){
        vsyncLevelWords = new Set(episodeSuggestions.map(w=>w.en.trim().toLowerCase()).filter(Boolean));
        episodeSuggestions.forEach(w=>{ const key=w.en.trim().toLowerCase(); if(key) vsyncLevelData[key]=w; });
        vsyncLevelError = '';
        if(vsyncHighlightEnabled === undefined) vsyncHighlightEnabled = true;
      }
      let combinedCardCount = 0;
      if(combinedResults && Object.keys(combinedResults).length){
        // Combined-mode answer already carried each word/idiom's full card — apply it right here
        // with the same tested logic the separate batch-card panel uses, instead of opening a
        // second panel for a second AI round trip.
        combinedCardCount = applyBatchFullCardResults(combinedResults);
      }
      panel.style.display = 'none';
      renderEpisodeResults();
      renderVsyncLevelStatus(combinedCardCount>0 ? `✅ کارت کامل ${combinedCardCount} کلمه/اصطلاح هم همین‌جا ذخیره شد — از این به بعد آفلاین هم در دسترس است.` : '');
      updateVsyncCaptionNow();
      saveVsyncLastState(); // persist right away so the result survives a close/reload immediately, not just on pagehide
    }catch(e){
      errEl.textContent = `پاسخ قابل خواندن نبود: ${escapeHtml(e.message||'')} — مطمئن شو دقیقاً همون خروجی JSON رو (بدون توضیح اضافه‌ی خودت) کپی کردی.`;
      errEl.style.display = 'block';
    }
  };

  const clearBtn = panel.querySelector('#epSrtAnalyzeClearBtn');
  if(clearBtn) clearBtn.onclick = ()=>{
    episodeSuggestions = [];
    episodeSelected = new Set();
    srtHighlightWord = null;
    renderEpisodeResults();
    renderSrtAnalyzePanel('new');
    saveVsyncLastState();
  };
}

/* Reads the pasted text, extracts real candidate words locally (reusing extractSrtVocabulary),
   then asks the AI to pick the ones worth learning at the chosen level and write their meanings —
   exactly like the .srt flow, just fed sentence-split plain text instead of subtitle lines. */
async function runTextImportAnalysis(){
  const settings = loadAiSettings();
  if(!(settings.provider==='google' && settings.key)) return;
  const textArea = textImportPageEl.querySelector('#tiTextArea');
  const text = textArea ? textArea.value.trim() : '';
  if(!text){
    tiError = 'اول یک متن انگلیسی بچسبان.';
    renderTiResults();
    return;
  }
  tiLoading = true; tiError = null; tiSuggestions = []; tiSelected = new Set();
  renderTiResults();
  try{
    const sentences = splitTextIntoSentences(text);
    if(sentences.length===0){ tiError = 'متنی برای تحلیل پیدا نشد.'; return; }
    const knownWords = words.map(w=>w.en).filter(Boolean);
    const knownLower = new Set(knownWords.map(w=>w.trim().toLowerCase()));
    loadWordSet(KNOWN_WORDS_KEY).forEach(w=> knownLower.add(w));
    loadWordSet(IGNORED_WORDS_KEY).forEach(w=> knownLower.add(w));
    const candidates = extractSrtVocabulary(sentences, knownLower).slice(0, 150);
    if(candidates.length===0){ tiError = 'کلمه‌ی جدیدی (غیر از کلمه‌هایی که بلدی) در این متن پیدا نشد.'; return; }
    const candidateByEn = {};
    candidates.forEach(c=>{ candidateByEn[c.en] = c; });
    const picked = await fetchTextWordSelection(settings.key, candidates, knownWords, tiLevel);
    if(picked.length===0){ tiError = 'کلمه‌ی مناسبی برای پیشنهاد در این متن پیدا نشد.'; return; }
    tiSuggestions = picked.map(w=>{
      const c = candidateByEn[w.en.trim().toLowerCase()];
      return { en:w.en, fa:w.fa, definition:w.definition, level:w.level, example: c ? c.example : '' };
    });
    tiSelected = new Set(tiSuggestions.map((_,i)=>i)); // select all by default — one tap away from "add all"
  }catch(e){
    tiError = 'استخراج کلمات از متن ناموفق بود (' + (e && e.message ? e.message : e) + ').';
  }finally{
    tiLoading = false;
    renderTiResults();
  }
}

/* Formats a seconds count as mm:ss or h:mm:ss for the "ادامه از همون‌جا" hint. */
function formatVsyncClock(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* The set of level-matching words currently driving the highlight — sourced from the automatic,
   sync-player-triggered analysis (vsyncLevelWords), NOT from the separate "تحلیل زیرنویس و
   پیشنهاد کلمات" word-suggestion list. This is what both the full-subtitle panel and the live
   video-player caption highlight against, so the highlighting works purely off browsing an .srt
   for the sync player + picking a level — no need to also run/use the word-suggestion feature. */
function buildLevelWordSet(){
  return vsyncHighlightEnabled ? vsyncLevelWords : new Set();
}

/* A word/idiom counts as "already known" for highlighting purposes if it's saved in the vocab box
   (any level, including archived/mastered) or was explicitly marked "✓ بلدم". Idioms (which
   contain whitespace) are checked as a whole phrase the same way. */
function isWordAlreadyKnown(lowerWord){
  if(words.some(w=>(w.en||'').trim().toLowerCase()===lowerWord)) return true;
  return loadWordSet(KNOWN_WORDS_KEY).has(lowerWord);
}

/* Subset of the current highlight set (vsyncLevelWords) that's already known — used so the caption
   highlight and full-subtitle view can mark those in a different color instead of the normal
   "new word" green/orange, since the AI itself is no longer told to skip them (see
   buildSrtWordPrompt) and may legitimately re-pick a word the person already knows. */
function buildKnownLevelWordSet(){
  const set = buildLevelWordSet();
  const out = new Set();
  set.forEach(w=>{ if(isWordAlreadyKnown(w)) out.add(w); });
  return out;
}

/* Builds the HTML for one subtitle line, wrapping every occurrence of any word in `levelWords`
   (the level-picked word/idiom list) in a <mark class="srt-level-hit">, and every occurrence of
   `activeWord` (the single word the person tapped "دیدن در متن کامل زیرنویس" on, if any) in
   <mark class="srt-hit"> instead so it stands out from the rest. Whole-word matching is used for
   single words; a plain (still case-insensitive) substring match is used for idioms, since
   they're multi-word phrases. */
function highlightLineHtml(text, levelWords, activeWord, knownWords){
  const activeNorm = activeWord ? activeWord.trim().toLowerCase() : '';
  const targets = new Set(levelWords || []);
  if(activeNorm) targets.add(activeNorm);
  if(targets.size===0) return escapeHtml(text);
  // Longer phrases first, so e.g. an idiom is matched whole rather than one of its words alone.
  const sorted = Array.from(targets).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(sorted.length===0) return escapeHtml(text);
  const pattern = sorted.map(w=>{
    const esc = escapeRegExp(w);
    return /\s/.test(w) ? esc : ('\\b' + esc + '\\b');
  }).join('|');
  let re;
  try{ re = new RegExp(pattern, 'gi'); }catch(e){ return escapeHtml(text); }
  let out = '', lastIndex = 0, m;
  while((m = re.exec(text))){
    out += escapeHtml(text.slice(lastIndex, m.index));
    const lower = m[0].trim().toLowerCase();
    let cls;
    if(lower===activeNorm) cls = 'srt-hit';
    else if(knownWords && knownWords.has(lower)) cls = 'srt-known-hit';
    else cls = 'srt-level-hit';
    out += `<mark class="${cls}">${escapeHtml(m[0])}</mark>`;
    lastIndex = m.index + m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  out += escapeHtml(text.slice(lastIndex));
  return out;
}

/* Renders the whole uploaded subtitle as a scrollable list of lines, highlighting every
   occurrence of `srtHighlightWord` (set when the user taps "دیدن در متن کامل زیرنویس" on a
   word card) so the word can be seen inside its real surrounding dialogue. When scrollToMatch
   is true, the panel auto-scrolls to the first highlighted line. */
function renderSrtFullPanel(scrollToMatch){
  const body = episodePageEl && episodePageEl.querySelector('#epFullSrtBody');
  if(!body) return;
  if(srtFullLines.length===0){ body.innerHTML=''; return; }
  const levelWords = buildLevelWordSet();
  const knownWords = buildKnownLevelWordSet();
  body.innerHTML = srtFullLines.map((line, idx)=>{
    const html = highlightLineHtml(line, levelWords, srtHighlightWord, knownWords);
    const isHit = !!srtHighlightWord && html.indexOf('class="srt-hit"')!==-1;
    return `<div class="srt-line${isHit?' srt-line-hit':''}" data-idx="${idx}">${html}</div>`;
  }).join('');
  if(scrollToMatch && srtHighlightWord){
    const first = body.querySelector('.srt-line-hit');
    if(first) first.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}

function renderEpisodeResults(){
  const box = episodePageEl && episodePageEl.querySelector('#epResults');
  if(!box) return;

  if(episodeLoading){
    box.innerHTML = `<div class="ai-note"><span class="spinner"></span> در حال پیدا کردن کلمات مناسب...</div>`;
    return;
  }
  if(episodeError){
    box.innerHTML = `<div class="ai-note">${escapeHtml(episodeError)}</div>`;
    return;
  }
  if(episodeSuggestions.length===0){
    box.innerHTML = '';
    return;
  }

  box.innerHTML = `
    ${episodeIdiomError ? `<div class="ai-note">${escapeHtml(episodeIdiomError)}</div>` : ''}

    ${srtFullLines.length>0 ? `
      <div class="srt-full-wrap" id="epFullSrtWrap">
        <div class="srt-full-head">
          <span>📜 متن کامل زیرنویس</span>
          ${srtHighlightWord ? `<span class="srt-full-active">کلمه‌ی نشان‌داده‌شده: <b dir="ltr">${escapeHtml(srtHighlightWord)}</b></span>` : ''}
        </div>
        <div class="srt-full-body" id="epFullSrtBody"></div>
      </div>` : ''}

    <div class="selection-banner" id="epSelBanner" style="display:none;">
      <span id="epSelCount"></span>
      <button class="btn btn-primary btn-icon btn-small" id="epAddBtn" title="افزودن به فهرست لغات">➕</button>
    </div>
    ${(()=>{
      const wordCount = episodeSuggestions.filter(w=>w.type!=='idiom').length;
      const idiomCount = episodeSuggestions.filter(w=>w.type==='idiom').length;
      if(wordCount>0 && idiomCount>0){
        return `
        <div class="ep-type-filter-row">
          <div class="ep-type-filter-btn ${episodeTypeFilter==='all'?'active':''}" data-filter="all">همه (${episodeSuggestions.length})</div>
          <div class="ep-type-filter-btn ${episodeTypeFilter==='word'?'active':''}" data-filter="word">🔤 کلمات (${wordCount})</div>
          <div class="ep-type-filter-btn ${episodeTypeFilter==='idiom'?'active':''}" data-filter="idiom">🗣️ اصطلاحات (${idiomCount})</div>
        </div>`;
      }
      return '';
    })()}
    ${episodeSuggestions.map((w,i)=>{
      if(episodeTypeFilter==='word' && w.type==='idiom') return '';
      if(episodeTypeFilter==='idiom' && w.type!=='idiom') return '';
      const isActive = srtHighlightWord && srtHighlightWord.trim().toLowerCase()===w.en.trim().toLowerCase();
      const alreadyKnown = isWordAlreadyKnown(w.en.trim().toLowerCase());
      return `
      <div class="ep-word-card ${episodeSelected.has(i)?'selected':''}" data-idx="${i}">
        <input type="checkbox" ${episodeSelected.has(i)?'checked':''}>
        <div style="flex:1;">
          <div class="ep-en-row">
            <div class="ep-en">${escapeHtml(w.en)}</div>
            ${w.type==='idiom' ? `<span class="ep-type-badge idiom">🗣️ اصطلاح</span>` : ''}
            ${w.level ? `<span class="ep-level-badge">${escapeHtml(w.level)}</span>` : ''}
            ${alreadyKnown ? `<span class="ep-known-badge">✓ قبلاً بلدی</span>` : ''}
          </div>
          <div class="ep-fa">${escapeHtml(w.fa)}</div>
          ${w.definition ? `<div class="ep-def">${escapeHtml(w.definition)}</div>` : ''}
          ${w.example ? `<div class="ep-ex">${escapeHtml(w.example)}</div>` : ''}
          <div class="ep-tools-row">
            <button type="button" class="btn btn-secondary btn-icon btn-small ep-tools-btn" data-idx="${i}" title="دیکشنری و ابزارها">🔗</button>
            <button type="button" class="btn btn-secondary btn-icon btn-small ep-ai-btn" data-idx="${i}" title="دستیار هوشمند">🤖</button>
            <button type="button" class="btn btn-secondary btn-icon btn-small ep-explain-btn" data-idx="${i}" title="توضیح کامل کلمه">📖</button>
          </div>
          ${srtFullLines.length>0 ? `
            <button class="btn btn-secondary btn-small ep-show-in-srt-btn ${isActive?'active':''}" data-idx="${i}" style="margin-top:6px;">
