    --brass-tint:#f5e9cb;
    --sage:#66845f;
    --sage-dark:#4f6b49;
    --sage-tint:#eef3ea;
    --rust:#b3564f;
    --rust-dark:#953f39;
    --line:#d8c9a3;
    --line-soft:#e6d9b8;
    --shadow-sm: 0 2px 8px rgba(34,48,63,.08);
    --shadow: 0 8px 24px rgba(34,48,63,.12);
    --shadow-lg: 0 16px 40px rgba(34,48,63,.16);
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 20% -10%, #fffdf6 0%, var(--parchment) 45%, #ede0c3 100%);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    -webkit-tap-highlight-color:transparent;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }
  .en{ font-family:'Lora', serif; }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== Header ===== */
  header{
    padding:26px 20px 20px;
    text-align:center;
    position:relative;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--brass-dark);
    font-weight:700;
    text-transform:uppercase;
  }
  header h1{
    margin:8px 0 5px;
    font-size:27px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .settings-icon-btn{
    position:absolute; top:16px; left:16px;
    width:40px; height:40px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow-sm);
    color:var(--ink-soft);
    transition:transform .12s ease, box-shadow .12s ease, color .12s ease;
  }
  .settings-icon-btn:active{ transform:scale(.94); box-shadow:none; color:var(--brass-dark); }

  .wrap{max-width:920px;margin:0 auto;padding:0 16px;}

  /* ===== Word of the day (AI suggestion based on the user's own vocabulary) ===== */
  .wod-card{
    position:relative;
    background: linear-gradient(180deg, #fffdf6 0%, #fbf3dd 100%);
    border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow: var(--shadow);
    padding:16px 18px 18px; margin:16px 0 20px;
    text-align:center;
    overflow:hidden;
  }
  .wod-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, var(--brass), var(--sage));
  }
  .wod-close{
    position:absolute; top:12px; left:12px; background:rgba(255,255,255,.6); border:1px solid var(--line-soft); box-shadow:none;
    color:var(--ink-faint); font-size:13px; width:26px; height:26px; padding:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .wod-close:active{ background:rgba(34,48,63,.08); }
  .wod-head{
    font-size:11px; font-weight:700; color:var(--brass-dark);
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    margin:2px auto 14px; padding:5px 14px;
    background:rgba(171,132,70,.12); border-radius:999px;
    letter-spacing:.03em;
  }
  .wod-clickable{
    cursor:pointer; border-radius:var(--radius-sm);
    background:rgba(255,255,255,.55); border:1px solid var(--line-soft);
    padding:14px 12px 12px; margin-bottom:12px;
  }
  .wod-clickable:active{ opacity:.85; }
  .wod-word{ font-size:27px; font-weight:700; color:var(--ink); direction:ltr; margin-bottom:4px; }
  .wod-meaning{ font-size:16px; font-weight:700; color:var(--sage-dark); margin-bottom:8px; }
  .wod-definition{ font-size:12.5px; color:var(--ink-soft); line-height:1.85; margin:0 auto 10px; max-width:480px; direction:ltr; padding-top:8px; border-top:1px dashed var(--line-soft); }
  .wod-example{ background:rgba(255,255,255,.7); border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; color:var(--ink-soft); max-width:460px; margin:0 auto 12px; }
  .wod-example .en{ display:block; direction:ltr; color:var(--ink); margin-bottom:3px; }
  .wod-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .wod-actions .btn{ padding:9px 18px; font-size:12.5px; }
  .wod-actions .btn-icon{ padding:0; width:38px; height:38px; font-size:15px; }
  .wod-added{ font-size:12.5px; font-weight:700; color:var(--sage-dark); background:var(--sage-tint); padding:7px 14px; border-radius:999px; }
  .wod-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.85; padding:0 4px; }

  /* ===== Cabinet (signature element) ===== */
  .cabinet{
    background: linear-gradient(180deg, #7d5d37, #5c4425);
    border-radius: var(--radius-lg);
    padding:20px 16px 20px;
    box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,.05);
    margin: 18px 0 24px;
  }
  .cabinet-top{
    display:flex; justify-content:space-between; align-items:center;
    color:#f3e6c8; padding:0 6px 16px;
  }
  .cabinet-top .today{
    font-size:13px; font-weight:600; opacity:.92; letter-spacing:.01em;
  }
  .cabinet-top .due-badge{
    background:var(--rust);
    color:#fff8ef;
    padding:7px 15px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.28);
  }
  .drawers{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .drawer{
    background: linear-gradient(180deg, #ede1c2, #e0d1a6);
    border-radius:12px;
    padding:13px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow: 0 2px 0 rgba(0,0,0,.13), inset 0 1px 0 rgba(255,255,255,.55);
    border:1px solid #cbb87f;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    position:relative;
  }
  .drawer:active{ transform: scale(.985); }
  .drawer:hover{ transform: translateX(-3px); }
  .drawer .handle{
    width:30px; height:7px; border-radius:6px;
    background: linear-gradient(180deg, var(--brass), var(--brass-dark));
    box-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .drawer .label{
    display:flex; align-items:center; gap:11px;
    font-weight:700; color:var(--ink);
    font-size:14px;
  }
  .drawer .interval{
    font-size:11px; color:var(--ink-soft); font-weight:500;
  }
  .drawer .counts{
    display:flex; align-items:center; gap:7px;
  }
  .chip{
    background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:11.5px; font-weight:700;
    color:var(--ink-soft);
  }
  .chip.due{ background:var(--rust); color:#fff; border-color:var(--rust-dark); }
  .drawer.mastered{
    background: linear-gradient(180deg, #e2ecdd, #d2e2cb);
    border-color:#a9c2a1;
  }

  /* ===== Action buttons ===== */
  .actions{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:24px;
  }
  /* Dashboard button grid: two even columns, with the main "start review" button spanning
     the full row above them (kept out of the generic .actions rule since that class is
     reused all over the app for simple 1–3 button rows). */
  .home-actions{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:26px;
  }
  .home-actions #startReviewBtn{ grid-column:1 / -1; padding:11px 16px; font-size:13px; box-shadow:0 4px 11px rgba(79,107,73,.28); }
  .btn{
    border:none; border-radius:var(--radius-sm); padding:13px 18px;
    font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow:var(--shadow); }
  .btn:active{ transform: translateY(0) scale(.98); box-shadow:none; }
  .btn-primary{ background: linear-gradient(180deg, var(--sage), var(--sage-dark)); color:#fdfaf0; box-shadow:0 6px 16px rgba(79,107,73,.32); padding:15px 18px; font-size:14.5px; }
  .btn-secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); box-shadow:none; border:1px dashed var(--line); }
  /* Destructive actions (delete word, etc.) — same weight as btn-ghost so it doesn't compete
     with primary actions, but colored with the palette's warning tone (--rust) so it actually
     reads as "careful, this removes something" instead of blending in with neutral/cancel
     buttons that use the same dashed-ghost look. */
  .btn-danger{ background:transparent; color:var(--rust-dark); box-shadow:none; border:1px solid var(--rust); }
  .btn-danger:active{ background:var(--rust); color:#fff8ef; }
  .btn-small{ padding:8px 12px; font-size:12px; border-radius:9px; }
  .btn:disabled{ opacity:.42; cursor:not-allowed; transform:none; box-shadow:none; }
  /* Compact icon-only buttons — used wherever a long button label can be replaced by a single
     recognizable icon (with a native tooltip via title=""), to save horizontal space. */
  .btn-icon{ padding:0; width:46px; height:46px; border-radius:50%; font-size:19px; flex:none; }
  .btn-icon.btn-small{ width:36px; height:36px; font-size:15px; }

  /* ===== Quick actions — unified equal-size grid for all secondary home-page entry points
     (add / list / browse / episode / text-import), replacing the old mismatched
     icon-row + ribbon-row combo so every button reads at the same visual weight. ===== */
  .quick-actions-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; margin-bottom:20px;
  }
  .qa-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 6px;
    box-shadow:var(--shadow-sm);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .qa-btn:hover{ transform: translateY(-1px); box-shadow:var(--shadow); }
  .qa-btn:active{ transform: translateY(0) scale(.98); box-shadow:none; }
  .qa-btn .qa-icon{ font-size:19px; line-height:1; }
  .qa-btn .qa-label{ font-size:11px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }

  /* ===== Panels / Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(34,48,63,.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; backdrop-filter: blur(3px);
  }
  @media(min-width:640px){ .overlay{ align-items:center; } }
  .panel{
    background:var(--panel);
    width:100%; max-width:560px;
    border-radius: 22px 22px 0 0;
    padding:20px 20px 24px;
    box-shadow:0 -12px 44px rgba(0,0,0,.28);
    max-height:88vh; overflow-y:auto;
    animation: slideup .22s cubic-bezier(.2,.8,.3,1);
  }
  @media(min-width:640px){ .panel{ border-radius:var(--radius-lg); } }
  @keyframes slideup{ from{ transform:translateY(28px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--line-soft); }
  .panel-head h2{ margin:0; font-size:17px; font-weight:800; }
  .close-x{ background:var(--parchment-dark); border:none; font-size:17px; color:var(--ink-soft); box-shadow:none; padding:6px 10px; border-radius:50%; line-height:1; }
  .close-x:active{ background:var(--line); }

  /* ===== In-app dictionary frame viewer ===== */
  .frame-overlay-backdrop{
    position:fixed; inset:0; background:rgba(20,16,8,.35); z-index:59;
    animation:foBackdropIn .18s ease;
  }
  @keyframes foBackdropIn{ from{ opacity:0; } to{ opacity:1; } }
  /* A bottom sheet by default — enough height to read/interact with the dictionary without the
     rest of the app (video, word detail) being completely replaced behind it. .fo-expanded is an
     explicit opt-in the person taps for, not the default, since most look-ups are quick. */
  .frame-overlay{
    position:fixed; left:0; right:0; bottom:0; top:auto; height:70vh; max-height:70vh;
    background:var(--panel);
    z-index:60; display:flex; flex-direction:column;
    border-radius:18px 18px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.28);
    animation:foSheetIn .2s ease;
    transition:height .2s ease, border-radius .2s ease;
  }
  @keyframes foSheetIn{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .frame-overlay.fo-expanded{ height:100vh; max-height:100vh; border-radius:0; }
  .frame-overlay .fo-handle{ width:38px; height:4px; border-radius:999px; background:var(--line); margin:8px auto 0; flex:0 0 auto; }
  .frame-overlay .fo-head{
    display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap;
    border-bottom:1px solid var(--line-soft); background:var(--panel);
    flex:0 0 auto;
  }
  .frame-overlay .fo-title{ flex:1 1 auto; min-width:0; font-size:13.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frame-overlay .fo-btn{
    background:var(--parchment-dark); border:none; font-size:12.5px; font-weight:700;
    color:var(--ink); box-shadow:none; padding:7px 11px; border-radius:10px; line-height:1; white-space:nowrap;
  }
  .frame-overlay .fo-btn:active{ background:var(--line); }
  .frame-overlay .fo-close{ font-size:16px; padding:7px 10px; border-radius:50%; }
  .frame-overlay .fo-body{ position:relative; flex:1 1 auto; min-height:0; }
  .frame-overlay iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; background:#fff; }
  .frame-overlay .fo-hint{
    position:absolute; left:0; right:0; bottom:0; padding:8px 12px;
    font-size:11.5px; color:var(--ink-soft); background:var(--panel);
    border-top:1px solid var(--line-soft); text-align:center;
  }

  label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 0 6px; }
  input[type=text], textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; font-family:inherit; font-size:14px; background:#fffef9; color:var(--ink);
    transition:border-color .12s ease;
  }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--sage); }
  select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 13px; font-family:inherit; font-size:13.5px; background:#fffef9; color:var(--ink);
    appearance:none; -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: 18px calc(1em + 2px), 13px calc(1em + 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-left:32px;
  }
  select:focus{ outline:none; border-color:var(--sage); }
  input.en, textarea.en{ font-family:'Lora', serif; direction:ltr; text-align:left; }
  textarea{ min-height:70px; resize:vertical; }

  /* ===== Flashcard ===== */
  .card{
    background:var(--panel);
    border-radius:var(--radius-lg);
    padding:28px 22px 24px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    position:relative;
    margin-bottom:16px;
  }
  .card .box-tag{
    position:absolute; top:16px; left:16px;
    font-size:10.5px; color:var(--brass-dark); font-weight:700;
    background:var(--brass-tint); padding:5px 11px; border-radius:999px;
    letter-spacing:.02em;
  }
  .card .word{
    font-size:33px; font-weight:600; text-align:center; color:var(--ink);
    margin:20px 0 6px; direction:ltr;
  }
  .card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:20px; }

  .linkrow{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:20px; }
  .link-btn{
    text-decoration:none; font-size:12px; font-weight:700;
    padding:8px 13px; border-radius:9px;
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:#fffef9; color:var(--ink);
    transition:background .12s ease;
  }
  .link-btn:active{ background:var(--parchment-dark); }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .reveal-box{
    border-top:1px dashed var(--line); margin-top:4px; padding-top:18px;
  }
  .fa-meaning{ font-size:19px; font-weight:700; text-align:center; margin-bottom:10px; }
  .example{ background:var(--parchment-dark); border-radius:var(--radius-sm); padding:11px 15px; font-size:13.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.7; }
  .example .en{ display:block; margin-bottom:3px; color:var(--ink); }

  .note-area{ margin-top:8px; }

  .grade-row{ display:flex; gap:10px; margin-top:20px; }
  .grade-row .btn{ flex:1; justify-content:center; }

  .empty{
    text-align:center; padding:56px 20px; color:var(--ink-soft);
  }
  .empty .big{ font-size:42px; margin-bottom:12px; }

  /* ===== Word list — compact wrapping chip grid ===== */
  #listItems{ display:flex; flex-wrap:wrap; gap:7px; }
  .list-item{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:7px 9px 7px 13px; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; -webkit-user-select:none; user-select:none;
    touch-action:manipulation; transition:background .12s ease, border-color .12s ease;
  }
  .list-item:active{ background:var(--parchment-dark); }
  .list-item.selected{ background:var(--sage-tint); border-color:var(--sage); }
  .list-item .li-word{ font-family:'Lora',serif; font-weight:600; font-size:14.5px; direction:ltr; }
  .list-item .li-check{ width:14px; height:14px; pointer-events:none; }
  .li-actions{ display:flex; }
  .icon-btn{ background:transparent; border:none; box-shadow:none; font-size:12px; padding:3px 5px; color:var(--ink-soft); border-radius:6px; }
  .icon-btn:active{ background:rgba(34,48,63,.07); }

  .help-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; border:1px solid var(--line);
    background:#fffef9; color:var(--ink-soft); font-size:11px; font-weight:700;
    vertical-align:middle; margin:0 6px; cursor:pointer; padding:0; box-shadow:none;
  }
  .help-toggle:active{ background:var(--parchment-dark); }

  /* ===== Compact tool reorder list (Settings > دیکشنری و ابزارها) ===== */
  .tool-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 2px; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .tool-row:last-child{ border-bottom:none; }
  .tool-row .tool-row-label{ display:flex; align-items:center; gap:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool-row .tool-row-actions{ display:flex; gap:0; flex-shrink:0; }
  .tool-row .icon-btn{ padding:4px 7px; font-size:12px; line-height:1; }
  .tool-row .icon-btn:disabled{ opacity:.3; }
  .search-input{ margin-bottom:12px; }
  .list-hint{ font-size:12px; color:var(--ink-soft); margin:0 0 16px; line-height:1.7; }

  .lang-toggle{ display:flex; gap:6px; margin:2px 0 4px; }
  .lang-btn{
    flex:1; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:9px; padding:8px 10px; font-size:12.5px; font-weight:700; box-shadow:none;
  }
  .lang-btn.active{ background:linear-gradient(180deg, var(--sage), var(--sage-dark)); color:#fdfaf0; border-color:var(--sage-dark); }

  /* ===== AI assistant ===== */
  .ai-msg{ background:var(--parchment-dark); border-radius:var(--radius-sm); padding:13px 15px; font-size:13.5px; line-height:1.9; margin-bottom:10px; }
  .ai-msg div{ margin:2px 0; }
  .ai-msg ul{ margin:4px 0 4px 0; padding-inline-start:20px; }
  .ai-msg li{ margin:2px 0; }
  .ai-msg code{ background:rgba(34,48,63,.08); padding:2px 6px; border-radius:5px; font-family:'Lora',monospace; font-size:12.5px; direction:ltr; display:inline-block; }
  .ai-msg.user{ background:var(--sage-tint); }
  .ai-suggestions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .suggestion-chip{
    font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px;
    border:1px solid var(--line); background:#fffef9; color:var(--brass-dark); cursor:pointer;
    transition:background .12s ease;
  }
  .suggestion-chip:active{ background:var(--parchment-dark); }
  .ai-note{
    font-size:12px; color:var(--ink-soft); background:var(--brass-tint); border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:16px; line-height:1.9;
  }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* ===== Inline AI suggestion in the add-word form ===== */
  .field-label-row{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 6px; }
  .field-label-row label{ margin:0; }
  .suggest-trigger{
    background:transparent; border:none; box-shadow:none; padding:3px 5px;
    font-size:12px; font-weight:700; color:var(--brass-dark); display:inline-flex; align-items:center; gap:4px;
  }
  .suggest-trigger:disabled{ opacity:.4; cursor:not-allowed; }
  .suggest-box{
    background:var(--brass-tint); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; margin-top:9px; font-size:13px; line-height:1.8; color:var(--ink);
  }
  .suggest-box .suggest-text{ margin-bottom:9px; }
  .suggest-box .suggest-text .en{ direction:ltr; display:inline-block; }
  .suggest-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .suggest-actions .btn{ padding:7px 12px; font-size:12px; border-radius:9px; }

  /* ===== Word detail panel (📖 توضیح کامل کلمه / tap on a subtitle word) ===== */
  .wd-header{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; row-gap:8px; }
  .wd-word-group, .wd-tools-group{ display:flex; align-items:center; gap:10px; }
  .wd-tools-group{ position:relative; padding-inline-start:12px; }
  .wd-tools-group::before{ content:''; position:absolute; inset-inline-start:0; top:50%; transform:translateY(-50%); width:1px; height:22px; background:var(--line); }
  .wd-word{ font-family:'Lora',serif; font-weight:700; font-size:27px; direction:ltr; color:var(--ink); }
  .wd-speak-btn{
    background:var(--parchment-dark); border:1px solid var(--line); border-radius:50%;
    width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center;
    font-size:15px; box-shadow:none; padding:0; color:var(--brass-dark); flex-shrink:0;
  }
  .wd-speak-btn:active{ background:var(--line); }
  .wd-quickmeaning{ text-align:center; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:16px; min-height:20px; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  /* بیاموز/فست‌دیکشنری shortcuts: same circular chip as the other header icons, just a bold
     single English letter instead of an emoji glyph, colored to match each site's brand so
     they're still easy to tell apart from the 🔗/🤖/📕 icons at a glance without needing a
     dedicated row or extra label text. */
  .wd-letter-btn{ font-family:'Lora',serif; font-weight:800; font-size:14px; }
  .wd-meaning-update-btn{
    background:var(--parchment-dark); border:1px solid var(--line); border-radius:50%;
    width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; box-shadow:none; padding:0; color:var(--brass-dark); flex-shrink:0;
  }
  .wd-meaning-update-btn:active{ background:var(--line); }
  .wd-qm-freedict-row{ display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; }
  .wd-qm-freedict-line{ font-size:13px; font-weight:500; color:var(--ink-soft); direction:ltr; }
  .wd-tab-placeholder{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:22px 0; }
  .wd-tab-placeholder .wd-chatgpt-row{ margin:0 !important; }

  /* Shown when the tapped word turns out to be part of an idiom/phrasal verb in its real
     sentence — either grounded locally against the analyzed idiom list, or checked live via AI. */
  .wd-idiom-box{
    background:#e6eef9; border:1px solid #c7d9f0; border-radius:var(--radius-sm);
    padding:11px 13px; margin-bottom:16px;
  }
  .wd-idiom-head{ font-size:12.5px; font-weight:700; color:#2b579a; margin-bottom:4px; }
  .wd-idiom-phrase{ direction:ltr; unicode-bidi:embed; }
  .wd-idiom-fa{ font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:3px; }
  .wd-idiom-def{ font-size:12px; color:var(--ink-soft); direction:ltr; text-align:left; margin-bottom:9px; }
  .wd-idiom-box .btn{ width:100%; justify-content:center; }

  .wd-freq{ display:flex; align-items:center; gap:9px; margin-bottom:18px; }
  .wd-freq-label{ font-size:11px; color:var(--ink-soft); flex-shrink:0; }
  .wd-freq-track{ flex:1; height:7px; border-radius:999px; background:var(--line); overflow:hidden; }
  .wd-freq-fill{ height:100%; background:linear-gradient(90deg, var(--sage), var(--sage-dark)); border-radius:999px; }
  .wd-freq-count{ font-size:11.5px; font-weight:700; color:var(--brass-dark); flex-shrink:0; direction:ltr; }
  .wd-history{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; margin-bottom:18px; }
  .wd-history-label{ font-size:11px; color:var(--ink-soft); flex-shrink:0; font-weight:700; }
  .wd-history-detail{ font-size:11.5px; color:var(--ink); }

  .wd-status-row{ display:flex; gap:8px; margin-bottom:18px; }
  .wd-status-row .btn{ flex:1; justify-content:center; padding:10px 4px; font-size:11.5px; }

  #wdTabContent{ margin-top:4px; }
  .wd-dict-box{ background:var(--parchment-dark); border-radius:var(--radius); padding:4px 15px; margin-top:14px; }
  .wd-dict-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:9px 0; }
  .wd-dict-row + .wd-dict-row{ border-top:1px dashed var(--line); }
  .wd-dict-word{ font-family:'Lora',serif; font-weight:700; direction:ltr; font-size:14px; color:var(--ink); }
  .wd-dict-pos{ font-size:11px; font-weight:700; color:var(--brass-dark); direction:ltr; }
  .wd-dict-meanings{ font-size:13px; color:var(--ink); }

  /* ---------- Free dictionary (dictionaryapi.dev) fallback box — shown when the in-app AI
     (Gemini) has no key configured, or when an AI call fails, so the person still gets real
     definitions/examples/synonyms with no key and no quota. ---------- */
  .wd-freedict-box{ background:var(--parchment-dark); border-radius:var(--radius); padding:14px 15px; margin-top:12px; margin-bottom:16px; }
  .wd-freedict-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .wd-freedict-title{ font-size:11px; font-weight:700; color:var(--brass-dark); letter-spacing:.2px; }
  .wd-freedict-phonetic{ font-family:'Lora',serif; direction:ltr; font-size:13px; color:var(--ink-soft); }
  .wd-freedict-group{ margin-bottom:12px; }
  .wd-freedict-group:last-child{ margin-bottom:0; }
  .wd-freedict-pos{ display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:var(--sage); border-radius:20px; padding:2px 11px; margin-bottom:7px; direction:ltr; }
  .wd-freedict-deflist{ margin:0; padding-inline-start:19px; }
  .wd-freedict-def{ font-size:13px; color:var(--ink); margin:6px 0; }
  .wd-freedict-example{ font-size:12px; color:var(--ink-soft); font-style:italic; direction:ltr; text-align:left; margin-top:3px; }
  .wd-freedict-fa{ font-size:12.5px; color:var(--sage-dark); margin-top:3px; }
  .wd-freedict-fa:empty{ display:none; }
  .wd-freedict-syn-row{ margin-top:5px; display:flex; flex-wrap:wrap; gap:5px; }
  .wd-freedict-syn-chip{ font-size:11px; background:rgba(34,48,63,.07); border-radius:20px; padding:2px 10px; direction:ltr; color:var(--ink-soft); }
  .wd-freedict-note{ font-size:11px; color:var(--ink-soft); margin-top:8px; text-align:center; }
  .wd-freedict-loadbtn-row{ margin-top:10px; text-align:center; }

  .wd-example-block{ background:var(--parchment-dark); border-radius:var(--radius); padding:13px 15px; margin-bottom:11px; }
  .wd-example-src{ font-size:11px; font-weight:700; color:var(--brass-dark); margin-bottom:7px; }
  .wd-example-en{ font-family:'Lora',serif; direction:ltr; text-align:left; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .wd-example-en .en{ flex:1; }
  .wd-example-en .wd-speak-btn{ width:26px; height:26px; font-size:12px; }
  .wd-example-fa{ font-size:13px; color:var(--ink-soft); margin-top:5px; }

  footer{ text-align:center; color:var(--ink-faint); font-size:11px; margin-top:32px; line-height:1.7; padding:0 24px; }

  /* ===== Generic full page (word list / settings) ===== */
  .page-full{
    position:fixed; inset:0; z-index:40;
    background: radial-gradient(1200px 800px at 20% -10%, #fffdf6 0%, var(--parchment) 45%, #ede0c3 100%);
    display:flex; flex-direction:column; height:100dvh;
  }
  .page-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; flex-shrink:0; border-bottom:1px solid var(--line); background:rgba(255,250,240,.6);
  }
  .page-top h2{ margin:0; font-size:17px; font-weight:800; }
  .page-body{ flex:1; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .settings-page .page-body{ padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .settings-section{
    margin-bottom:10px; background:var(--panel); border:1px solid var(--line-soft);
    border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .settings-section summary{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px; cursor:pointer; list-style:none; -webkit-tap-highlight-color:transparent;
  }
  .settings-section summary::-webkit-details-marker{ display:none; }
  .settings-section summary::marker{ content:''; }
  .settings-section summary:active{ background:var(--parchment-dark); }
  .ss-title{ display:flex; align-items:center; gap:10px; min-width:0; }
  .ss-icon{ font-size:16px; flex-shrink:0; }
  .ss-title-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ss-title-main{ font-size:13.5px; font-weight:800; color:var(--brass-dark); letter-spacing:.01em; }
  .ss-caption{ font-size:10.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ss-chev{ font-size:11px; color:var(--ink-faint); flex-shrink:0; transition:transform .2s ease; }
  .settings-section[open] .ss-chev{ transform:rotate(180deg); }
  .settings-section[open] summary{ border-bottom:1px solid var(--line-soft); }
  .ss-body{ padding:14px 15px 16px; }
  .settings-section label{ margin:12px 0 5px; }
  .settings-section label:first-child{ margin-top:0; }
  .settings-section .ai-note{ margin-bottom:12px; padding:10px 12px; }
  .settings-section .actions{ margin-bottom:0; justify-content:flex-start; }
  .selection-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--sage-tint); border:1px solid var(--sage); border-radius:var(--radius-sm);
    padding:11px 15px; margin-bottom:14px; font-size:13px; font-weight:700; color:var(--sage-dark);
  }

  /* ===== Episode word-suggestion page ===== */
  .ep-filter-row{ display:flex; gap:10px; margin-top:10px; }
  .ep-filter-row > div{ flex:1; }
  .ep-checkbox-label{
    display:flex; align-items:center; gap:8px; margin:10px 0 10px;
    font-size:13.5px; color:var(--ink); cursor:pointer;
  }
  .ep-checkbox-label input[type=checkbox]{ width:auto; margin:0; }
  .ep-word-card{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);
    padding:13px 15px; margin-bottom:10px; cursor:pointer;
    transition:background .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .ep-word-card.selected{ background:var(--sage-tint); border-color:var(--sage); }
  .ep-word-card input[type=checkbox]{ margin-top:4px; flex-shrink:0; pointer-events:none; }
  .ep-en-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ep-word-card .ep-en{ font-family:'Lora',serif; font-weight:700; font-size:16px; direction:ltr; }
  .ep-type-badge{
    font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:700;
    background:#f0e6d2; color:#7a5c00; direction:rtl; flex-shrink:0;
  }
  .ep-type-badge.idiom{ background:#e6eef9; color:#2b579a; }
  .ep-level-badge{
    font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:800;
    background:#fffef9; color:var(--brass-dark); border:1px solid var(--line); direction:ltr; flex-shrink:0;
  }
  /* Marks a suggestion the person already knows (saved in the box, or tapped "✓ بلدم") — the AI
     is no longer told to avoid these when picking (see buildSrtWordPrompt), so this is how they're
     told apart at a glance in the suggestion list, same blue used for the video-caption variant. */
  .ep-known-badge{
    font-size:10.5px; padding:3px 9px; border-radius:999px; font-weight:800;
    background:#e3eefc; color:#2b5fa3; direction:rtl; flex-shrink:0;
  }
  .ep-word-card .ep-fa{ font-weight:700; margin:3px 0 5px; }
  .ep-word-card .ep-ex{ font-size:12.5px; color:var(--ink-soft); direction:ltr; text-align:left; }
  .ep-word-card .ep-def{ font-size:12px; color:var(--ink-soft); direction:ltr; text-align:left; margin-bottom:5px; }
  .ep-tools-row{ display:flex; gap:6px; margin:6px 0 2px; }
  .ep-show-in-srt-btn{ direction:rtl; }
  .ep-show-in-srt-btn.active{ background:var(--sage-tint); border-color:var(--sage); color:var(--sage-dark); }
  .ep-type-filter-row{ display:flex; gap:8px; margin-bottom:16px; }
  .ep-type-filter-btn{
    flex:1; text-align:center; padding:9px 6px; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid var(--line); background:var(--panel); font-size:13px; font-weight:600; color:var(--ink-soft);
    transition:background .12s ease;
  }
  .ep-type-filter-btn.active{ background:var(--sage); border-color:var(--sage); color:#fff; }
  input[type=file]{ width:100%; font-size:12.5px; }

  /* Full-subtitle reference panel */
  .srt-full-wrap{
    border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; margin-bottom:16px;
    background:var(--panel); box-shadow:var(--shadow-sm);
  }
  .srt-full-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
    font-weight:700; font-size:14px; color:var(--brass-dark);
  }
  .srt-full-active{ font-size:12px; font-weight:700; color:var(--sage-dark); direction:rtl; }
  .srt-full-body{
    max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 11px; background:var(--bg,#f7f5f0); margin-top:10px;
  }
  .srt-line{
    font-size:12.5px; color:var(--ink-soft); direction:ltr; text-align:left; padding:3px 0;
  }
  .srt-line-hit{
    color:var(--ink); background:var(--sage-tint); border-radius:6px; padding:5px 7px; margin:2px -7px;
  }
  .srt-hit{
    background:#f0e6d2; color:#7a5c00; font-weight:700; border-radius:4px; padding:0 2px;
  }
  /* Words that match the currently-analyzed level word list get this softer, distinct highlight
     everywhere in the full-subtitle panel — separate from .srt-hit, which marks the one word the
     person specifically tapped to look at. */
  .srt-level-hit{
    background:var(--sage-tint); color:var(--sage-dark); font-weight:700; border-radius:4px; padding:0 2px;
  }
  /* Same idea as .srt-level-hit but for a level word the person already knows (in the vocab box
     or marked "✓ بلدم") — kept visually distinct (blue instead of green) so it's clear at a
     glance this one doesn't need fresh attention. */
  .srt-known-hit{
    background:#e3eefc; color:#2b5fa3; font-weight:700; border-radius:4px; padding:0 2px;
  }

  /* Offline video + subtitle sync player — top-level "فیلم" page cards */
  .vsync-wrap{
    border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:16px;
    background:var(--panel); box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .vsync-head{
    display:flex; align-items:center; gap:9px;
    font-weight:800; font-size:13.5px; color:var(--brass-dark); letter-spacing:.01em;
    padding:14px 16px; margin:0; border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(171,132,70,.06), transparent 90%);
  }
  .vsync-body{ padding:15px 16px 16px; }
  .vsync-body .actions{ margin-bottom:0; justify-content:flex-start; }
  .vsync-body .ai-note{ margin-bottom:14px; padding:10px 12px; }
  /* Each of the three AI-assist tools is one plain row: label on the right, action button on the
     left, separated by a thin divider so the whole card reads as one tidy list with a consistent
     vertical rhythm — still no extra card/description clutter, matching the app's flat style. */
  .ai-tool-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 0; border-top:1px solid var(--line-soft);
  }
  .ai-tool-row:first-child{ border-top:none; padding-top:0; }
  .ai-tool-row .btn{ flex-shrink:0; }
  .ai-tool-title{ font-size:13px; font-weight:700; color:var(--ink); line-height:1.5; display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ai-tool-badge{
    font-size:10px; font-weight:800; color:var(--sage-dark); background:var(--sage-tint);
    border-radius:999px; padding:2px 8px; letter-spacing:.01em;
  }
  /* The share→paste→submit flow that opens under the analyze/translate rows: a distinct tinted
     card with numbered steps, so it reads as one guided sequence instead of a loose stack of
     buttons and textareas glued together. */
  .ai-flow-card{
    background:var(--parchment); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    padding:14px 15px 15px;
  }
  .ai-flow-badge-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .ai-flow-badge{
    display:inline-block; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px;
  }
  .ai-flow-badge.mode-new{ background:rgba(60,160,255,.15); color:#2b7cc4; }
  .ai-flow-badge.mode-combined{ background:rgba(124,92,255,.15); color:#6b4fd6; }
  .ai-flow-badge.mode-more{ background:var(--panel); color:var(--ink-soft); border:1px solid var(--line-soft); }
  .ai-flow-help-btn{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    color:var(--ink-soft); font-size:12px; line-height:1; cursor:pointer; flex:none; padding:0;
  }
  .ai-flow-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.85; margin-bottom:10px; }
  .ai-flow-card .ai-note{ margin-bottom:10px; }
  .ai-flow-step{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--line-soft); }
  .ai-flow-step.ai-flow-step-first{ margin-top:2px; padding-top:0; border-top:none; }
  .ai-flow-step-label{
    display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;
    color:var(--brass-dark); margin-bottom:9px;
  }
  .ai-flow-step-num{
    width:20px; height:20px; border-radius:50%; background:var(--brass-tint); color:var(--brass-dark);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .ai-flow-step .actions{ margin-bottom:0; }
  .ai-flow-hint{ font-size:11.5px; color:var(--sage-dark); margin-top:7px; }
  .ai-flow-textarea{ margin-top:9px; min-height:100px; }
  .ai-flow-textarea[readonly]{ font-size:11.5px; direction:ltr; text-align:left; min-height:80px; background:var(--panel); }
  /* Compact highlight-status bar under the "پیشنهاد کلمات و اصطلاحات" row — a single slim row
     instead of a full-width note box, so it reads as a quick status/toggle rather than a
     separate content block competing with the rest of the card. */
  .vsync-hl-status{ font-size:12.5px; color:var(--ink-soft); line-height:1.7; }
  .vsync-hl-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--sage-tint); border:1px solid var(--sage); border-radius:var(--radius-sm);
    padding:9px 12px;
  }
  .vsync-hl-toggle{ display:flex; align-items:center; gap:7px; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--sage-dark); }
  .vsync-hl-toggle input[type=checkbox]{ width:auto; margin:0; }
  .vsync-hl-bar .btn{ flex-shrink:0; }
  /* Native <input type=file> is visually hidden; its paired <label> (styled as an ordinary
     btn-secondary pill, in Persian) is the only thing the person actually sees/taps — keeps every
     file-picker on this page looking like the rest of the app's buttons instead of the browser's
     own unstyled, English-only "Choose File" control. */
  .file-input-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .file-pick-btn{ cursor:pointer; }
  .vsync-inputs{ display:flex; flex-direction:column; gap:9px; margin-bottom:2px; }
  /* Each file field now reads as one tidy pill-shaped row (soft fill, own border/radius) instead
     of the label/button/filename floating loosely on the bare card background. */
  .file-pick-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--parchment); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .file-pick-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); min-width:64px; flex-shrink:0; }
  .file-pick-name{ font-size:11.5px; color:var(--ink-faint); direction:ltr; text-align:left; flex:1; min-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }

    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

  /* The caption box itself ignores taps (so the video/controls beneath stay reachable), but

  .vsync-caption{

    flex-direction:column; align-items:center; gap:3px;
    pointer-events:none; padding:0 10px; z-index:1;

  .vsync-caption-text{
    background:transparent; color:#ffe140; font-size:calc(17px * var(--cap-scale, 1)); font-weight:800; line-height:1.5;
    padding:0 10px; border-radius:0; direction:ltr; text-align:center; max-width:100%;

      -1.5px 0 0 #000, 1.5px 0 0 #000, 0 -1.5px 0 #000, 0 1.5px 0 #000,

    text-shadow:
      -2.5px -2.5px 0 #000, 2.5px -2.5px 0 #000, -2.5px 2.5px 0 #000, 2.5px 2.5px 0 #000,
      -2.5px 0 0 #000, 2.5px 0 0 #000, 0 -2.5px 0 #000, 0 2.5px 0 #000,
      0 3px 10px rgba(0,0,0,.55);

  /* Persian translation line, shown right under the English caption — plain white (not the
     English caption's yellow) so the two are easy to tell apart at a glance, smaller since it's
     a reading aid rather than the primary caption, and not word-clickable (no vocab lookup on it,
     that's what the English line above is for). */
  .vsync-caption-fa{
    color:#fff; font-size:calc(14px * var(--cap-scale, 1)); font-weight:700;
    direction:rtl; text-align:center;

  .vsync-word{ pointer-events:auto; cursor:pointer; border-radius:4px; padding:0 1px; }
  .vsync-word:active{ background:rgba(255,255,255,.28); }
  /* Marks a caption word that's part of the currently-analyzed level word list, so the level
     picked in "سطح زبان" is visible live on top of the playing video, not just in the word list.

     distinguishable, keeping the same black outline for readability. */
  .vsync-word-level{
    color:#8bef6a; text-decoration:underline; text-decoration-color:#8bef6a; text-decoration-thickness:2px;
    text-underline-offset:3px; font-weight:800;

  /* Idioms/expressions are highlighted as one tappable unit (not word-by-word) in a distinct
     color from single level words, so it's visually clear it's a whole phrase with its own

  .vsync-word-idiom{
    color:#ffb454; text-decoration-color:#ffb454;

  /* A level word the person already knows (in the vocab box or marked "✓ بلدم") gets this blue
     instead of the normal green/orange — the AI is no longer told to skip already-known words

  .vsync-word-known{
    color:#7ec8ff; text-decoration:underline; text-decoration-color:#7ec8ff; text-decoration-thickness:2px;
    text-underline-offset:3px; font-weight:800;

     players use so icon-only buttons stay legible over a bright frame without every single

     2) and ignores taps so it never steals the gesture layer's clicks. */
  .vsync-player::before{
    content:''; position:absolute; inset:0 0 auto 0; height:64px; z-index:1; pointer-events:none;

  .vsync-btn-row{

  }
  .vsync-sync-badge{
    pointer-events:none; background:rgba(15,15,15,.6); color:#fff; font-size:11px; font-weight:700;
    border:1px solid rgba(255,255,255,.14);

  }
  .vsync-fs-btn{
    pointer-events:auto; flex-shrink:0;
    background:rgba(15,15,15,.55); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:15px; line-height:1;
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease, background .12s ease;

  .vsync-fs-btn:active{ transform:scale(.9); background:rgba(0,0,0,.75); }
  /* Every top-of-player icon button (caption toggle, فا toggle, rotate) shares one visual
     language: a uniform circular "glass" chip — translucent dark fill, a hairline border for
     definition against busy video frames, and a gentle press-scale instead of a hard color
     flash — rather than the old flat, mismatched-size rectangles. */
  .vsync-cap-size-btn{
    pointer-events:auto;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    background:rgba(15,15,15,.55); color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:50%;
    font-size:14px; font-weight:800; padding:0; cursor:pointer; line-height:1;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .vsync-cap-size-btn:active{ transform:scale(.9); background:rgba(0,0,0,.75); }
  .vsync-cap-size-btn.active{ background:var(--brass-dark,#8a6a1f); border-color:rgba(255,255,255,.3); }
  /* Subtitle size, position, AND sync offset used to be up to three separate rows sitting
     permanently at the top of the video — most of that space spent on settings people touch
     once and then leave alone for the rest of the video. They're all folded behind the single
     🔤 toggle now: tap it, this flyout pops up right under the main row (wrapping onto a second
     line on narrower screens rather than running off-screen), tap it again to put it away. It
     intentionally sits *above* anything behind it (z-index) rather than pushing content down,
     since it's only ever open for a moment. */
  .vsync-cap-flyout{
    position:absolute; left:10px; top:52px; z-index:5; pointer-events:auto;
    direction:ltr;
    display:flex; align-items:center; justify-content:flex-start; gap:16px; row-gap:10px; flex-wrap:wrap; max-width:min(82vw, 270px);
    animation:vsyncFlyoutIn .16s ease;

  @keyframes vsyncFlyoutIn{ from{ opacity:0; transform:translateY(-6px) scale(.96); } to{ opacity:1; transform:none; } }
  .vsync-flyout-group{

     otherwise invisible so it never competes with the actual controls. */

    transform:translate(-50%,-50%);

    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;

     tap, the way Chrome and every other video app shows one. It rides the same show/hide cycle
     as everything else in .vsync-controls-layer, which already means it stays put whenever the
     video is paused (the auto-hide timer only ever starts while playing) and otherwise fades in
     on a tap and back out after a few seconds, same as the rest. */
  .vsync-center-playpause{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:3; pointer-events:auto;
    width:60px; height:60px; border-radius:50%;

    width:38px; height:38px; align-items:center; justify-content:center;
    background:rgba(15,15,15,.55); color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:50%;
    font-size:16px; padding:0; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .vsync-player.vsync-fs-active .vsync-rotate-btn{ display:flex; }
  .vsync-player.vsync-fs-active .vsync-prefs-rotate-btn{ display:none; }
  .vsync-rotate-btn:active{ transform:scale(.9); background:rgba(0,0,0,.75); }

  .vsync-player.vsync-rotate{

    width:100vh !important; height:100vw !important; margin:0 !important;
    transform:translate(-50%,-50%) rotate(90deg) !important;
    z-index:2147483647; border-radius:0;
  }
  .vsync-player.vsync-rotate video{
    width:100% !important; height:100% !important; max-height:none !important; object-fit:contain;
  }
  /* All the floating controls (rotate button + the 3 button rows) live in one wrapper so they
     can be repositioned as a unit for the "force landscape" CSS-rotate fallback above. Normally
     (not rotated) this wrapper is just a plain full-size layer sitting over the player — each
     button row keeps using its own left/top/right exactly as before, no change in that case.
     In `.vsync-rotate` mode, though, the player itself is rotated 90° (with width/height swapped)
     to fake landscape on a portrait screen — and every descendant rotates right along with it.

     stack, and rows anchored to the same edge end up landing on top of each other, so everything
     piled up in one corner instead of spanning all four. This wrapper cancels that rotation back
     out for just the controls (same fixed-centered-and-rotated trick as the player itself, only
     with the opposite angle and swapped dimensions), so the buttons render upright and land at
     the actual screen corners the person sees — same layout as the non-rotated case, just correct
     for the rotated video underneath it. */
  .vsync-controls-layer{ position:absolute; inset:0; pointer-events:none; z-index:2; transition:opacity .25s ease; opacity:1; }
  .vsync-player.vsync-rotate .vsync-controls-layer{
    position:fixed !important; inset:auto !important; top:50% !important; left:50% !important;
    width:100vw !important; height:100vh !important;
    transform:translate(-50%,-50%) rotate(-90deg) !important;

     playback, tap the video to bring them back. The invisible gesture layer below stays tappable

  .vsync-player.vsync-controls-hidden .vsync-controls-layer,
  .vsync-player.vsync-controls-hidden .vsync-controls-layer *{ pointer-events:none !important; }

     the whole video. It now covers the full height — the scrub bar below is ours too (see
     .vsync-seek-row), sitting in a higher z-index, so it stays fully reachable on top of this
     regardless. Sits *below* the caption text in z-index too, so tapping a caption word still
     reaches the word for lookup instead of being swallowed here. `touch-action:none` is the

     page-scroll gesture (usually within the first couple of pixels) and takes over before this

  .vsync-seek-track{
    position:relative; flex:1; height:18px; display:flex; align-items:center; cursor:pointer;
    touch-action:none;
  }
  .vsync-seek-track::before{
    content:''; position:absolute; left:0; right:0; height:4px;
    background:rgba(255,255,255,.3); border-radius:999px;
  }
  .vsync-seek-fill{ position:absolute; left:0; height:4px; background:#fff; border-radius:999px; width:0%; }
  .vsync-seek-handle{
    position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; left:0%;

<script>
const BOX_INTERVALS = {1:1, 2:2, 3:4, 4:7, 5:15}; // days

const STORAGE_KEY = 'leitner-words-v1';

let words = [];

/* Two small standalone localStorage sets, separate from the main `words` box system:
   - KNOWN_WORDS: words the person tapped "✓ بلدم" on — they don't want them added to a
     review box, but also don't want them re-suggested as "new" vocabulary from subtitles.
   - IGNORED_WORDS: words the person tapped "🚫 نادیده بگیر" on — never worth suggesting
     again from subtitle analysis (names, junk, etc), regardless of frequency. */
const KNOWN_WORDS_KEY = 'leitner-known-words-v1';
const IGNORED_WORDS_KEY = 'leitner-ignored-words-v1';
function loadWordSet(key){

  saveWordSet(KNOWN_WORDS_KEY, s);

function markWordIgnored(en){

const $ = sel => document.querySelector(sel);

function todayISO(){ return new Date().toISOString(); }
function addDays(date, days){ const d = new Date(date); d.setDate(d.getDate()+days); return d.toISOString(); }

/* ---------- Sync provider selection ---------- */
/* Which remote backend (if any) is active: 'none' | 'github' | 'drive'. Defaults to 'github'
   if a GitHub sync was already configured before this setting existed, so upgrading doesn't
   silently disconnect anyone. */
const SYNC_PROVIDER_KEY = 'leitner-sync-provider-v1';
function loadSyncProvider(){
  try{
    const raw = localStorage.getItem(SYNC_PROVIDER_KEY);
    if(raw) return raw;
  }catch(e){}
  const g = loadGithubSync();
  return (g.repo && g.token) ? 'github' : 'none';
}
function saveSyncProvider(p){ try{ localStorage.setItem(SYNC_PROVIDER_KEY, p); }catch(e){} }

/* Returns {provider, s} for whichever provider is active AND fully configured, or null. */
function activeSyncConfig(){
  const provider = loadSyncProvider();
  if(provider==='github'){
    const s = loadGithubSync();
    if(s.repo && s.token) return {provider:'github', s};
  } else if(provider==='drive'){
    const s = loadDriveSync();
    if(s.url && s.secret) return {provider:'drive', s};
  }
  return null;
}

async function loadWords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    words = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('خواندن داده‌ها ناموفق بود', e);
    words = [];
  }
  // If a remote sync provider is configured, try to pull the latest version first
  const cfg = activeSyncConfig();
  if(cfg){
    try{
      const remote = cfg.provider==='github' ? await githubFetchFile(cfg.s) : await driveFetchFile(cfg.s);
      if(remote){
        words = remote.words;
        if(cfg.provider==='github') githubSha = remote.version; else driveVersion = remote.version;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); // keep an offline cache
      }
    }catch(e){
      console.error('دریافت از سرویس ابری ناموفق بود، از نسخه محلی استفاده می‌شود', e);
    }
  }
}

let syncPushTimer = null;
let syncPushPending = false; // true whenever there are local edits not yet confirmed pushed
async function saveWords(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }catch(e){
    console.error('ذخیره‌سازی ناموفق بود', e);
    alert('ذخیره‌سازی با مشکل مواجه شد. ممکن است حافظه مرورگر پر باشد.');
  }
  const cfg = activeSyncConfig();
  if(cfg){
    syncPushPending = true;
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(()=>{ syncPushTimer = null; pushRemote(cfg); }, 1200); // debounce so rapid edits become one commit
  }
}

async function pushRemote(cfg, opts){
  if(cfg.provider==='github') return pushToGithub(cfg.s, false, opts);
  if(cfg.provider==='drive') return pushToDrive(cfg.s, false, opts);
}

/* Forces any pending (debounced) push to go out right away, instead of waiting for the
   timer. Called whenever the app is about to be backgrounded/closed — on mobile especially,
   the 1.2s debounce window often never gets to run otherwise, so edits silently never reach
   the cloud and each device quietly drifts back to "only my own local storage". keepalive:true
   asks the browser to let the request finish even after the page itself is gone. */
function flushSyncPush(){
  const cfg = activeSyncConfig();
  if(!cfg) return;
  if(syncPushTimer){ clearTimeout(syncPushTimer); syncPushTimer = null; }
  if(syncPushPending) pushRemote(cfg, {keepalive:true});
}

/* Called whenever the app comes back to the foreground. Cheaply checks whether the remote
   file has moved on since we last saw it (i.e. edited from another device) and, if so and
   we don't have our own unpushed edits sitting around, pulls it in — otherwise you'd only
   ever see another device's changes after a full page reload. */
async function pullIfStale(){
  if(syncPushPending || syncPushTimer) return; // don't clobber edits we haven't pushed yet
  const cfg = activeSyncConfig();
  if(!cfg) return;
  try{
    const remote = cfg.provider==='github' ? await githubFetchFile(cfg.s) : await driveFetchFile(cfg.s);
    const localVersion = cfg.provider==='github' ? githubSha : driveVersion;
    if(remote && remote.version !== localVersion){
      words = remote.words;
      if(cfg.provider==='github') githubSha = remote.version; else driveVersion = remote.version;
      await saveWordsLocalOnly();
      renderDrawers();
      if(typeof listPageRedraw === 'function' && listPageRedraw) listPageRedraw();
      updateSyncStatus('لغت‌های تازه از دستگاه دیگر دریافت شد — ' + new Date().toLocaleTimeString('fa-IR'));
    }
  }catch(e){
    console.error('بررسی نسخه‌ی سرویس ابری ناموفق بود', e);
  }
}

/* ---------- GitHub sync (stores the word list in a file inside your own repo) ---------- */
const GITHUB_SYNC_KEY = 'leitner-github-sync-v1';
let githubSha = null;
function loadGithubSync(){
  try{
    const raw = localStorage.getItem(GITHUB_SYNC_KEY);
    return raw ? JSON.parse(raw) : {repo:'', path:'leitner-words-data.json', branch:'main', token:''};
  }catch(e){ return {repo:'', path:'leitner-words-data.json', branch:'main', token:''}; }
}
function saveGithubSync(s){
  try{ localStorage.setItem(GITHUB_SYNC_KEY, JSON.stringify(s)); }catch(e){}
}
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function base64ToUtf8(str){ return decodeURIComponent(escape(atob(str))); }

async function githubFetchFile(sync){
  const url = `https://api.github.com/repos/${sync.repo}/contents/${encodeURIComponent(sync.path)}?ref=${encodeURIComponent(sync.branch||'main')}`;
  const res = await fetch(url, {
    headers:{ 'Authorization':'token '+sync.token, 'Accept':'application/vnd.github+json' }
  });
  if(res.status===404) return null; // file doesn't exist yet — that's fine, first save will create it
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  const parsed = JSON.parse(base64ToUtf8(data.content));
  return { words: parsed, version: data.sha };
}

async function pushToGithub(sync, retry, opts){
  opts = opts || {};
  try{
    const url = `https://api.github.com/repos/${sync.repo}/contents/${encodeURIComponent(sync.path)}`;
    const body = {
      message: `بروزرسانی لغت‌ها (${words.length} لغت) — ${new Date().toLocaleString('fa-IR')}`,
      content: utf8ToBase64(JSON.stringify(words, null, 2)),
      branch: sync.branch||'main'
    };
    if(githubSha) body.sha = githubSha;
    const res = await fetch(url, {
      method:'PUT',
      headers:{ 'Authorization':'token '+sync.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify(body),
      keepalive: !!opts.keepalive // lets the request finish even if the page is being unloaded right now
    });
    if(res.status===409 && !retry){
      // someone/something else updated the file — refetch the sha once and retry
      const fresh = await githubFetchFile(sync);
      if(fresh) githubSha = fresh.version;
      return pushToGithub(sync, true, opts);
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    githubSha = data.content.sha;
    syncPushPending = false;
    updateSyncStatus('آخرین همگام‌سازی: ' + new Date().toLocaleTimeString('fa-IR'));
  }catch(e){
    console.error('ارسال به گیت‌هاب ناموفق بود', e);
    updateSyncStatus('همگام‌سازی ناموفق بود — بررسی کن توکن و اتصال اینترنت درست باشد.');
    // leave syncPushPending = true so the next save/flush attempt tries again
  }
}

/* ---------- Google Drive sync (via a small Apps Script "Web App" bridge you deploy once —
   see the setup instructions in the Settings page for the actual script to paste). No OAuth
   popups: the script runs under your Google account permanently once deployed, and the app
   just talks to it with a URL + a secret you make up yourself, same shape as the GitHub token. ---------- */
const DRIVE_SYNC_KEY = 'leitner-drive-sync-v1';
/* The Apps Script that needs to be deployed once (see Settings page instructions). Kept here
   as a plain string so the Settings page can show/copy it — this text never runs inside this
   HTML file itself, it only runs once pasted into script.google.com. */
const DRIVE_APPS_SCRIPT_CODE = `function doGet(e) {
  var props = PropertiesService.getScriptProperties();
  var secret = props.getProperty('SECRET');
  if (!secret || e.parameter.secret !== secret) {
    return json_({ error: 'unauthorized' });
  }
  var fileId = props.getProperty('FILE_ID');
  if (!fileId) {
    return json_({ words: null });
  }
  var file = DriveApp.getFileById(fileId);
  var data = JSON.parse(file.getBlob().getDataAsString());
  return json_({ words: data.words, updatedAt: data.updatedAt });
}

function doPost(e) {
  var props = PropertiesService.getScriptProperties();
  var secret = props.getProperty('SECRET');
  var body = JSON.parse(e.postData.contents);
  if (!secret || body.secret !== secret) {
    return json_({ error: 'unauthorized' });
  }
  var fileId = props.getProperty('FILE_ID');
  var current = null;
  var file;
  if (fileId) {
    file = DriveApp.getFileById(fileId);
    current = JSON.parse(file.getBlob().getDataAsString());
  }
  if (current && body.expectedUpdatedAt && current.updatedAt !== body.expectedUpdatedAt) {
    return json_({ conflict: true, currentUpdatedAt: current.updatedAt });
  }
  var updatedAt = new Date().toISOString();
  var payload = JSON.stringify({ words: body.words, updatedAt: updatedAt });
  if (!fileId) {
    var folders = DriveApp.getFoldersByName('Leitner Vocab Sync');
    var folder = folders.hasNext() ? folders.next() : DriveApp.createFolder('Leitner Vocab Sync');
    file = folder.createFile('leitner-words-data.json', payload, MimeType.PLAIN_TEXT);
    props.setProperty('FILE_ID', file.getId());
  } else {
    file.setContent(payload);
  }
  return json_({ updatedAt: updatedAt });
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;
let driveVersion = null; // the remote file's updatedAt timestamp, used like githubSha for conflict checks
function loadDriveSync(){
  try{
    const raw = localStorage.getItem(DRIVE_SYNC_KEY);
    return raw ? JSON.parse(raw) : {url:'', secret:''};
  }catch(e){ return {url:'', secret:''}; }
}
function saveDriveSync(s){
  try{ localStorage.setItem(DRIVE_SYNC_KEY, JSON.stringify(s)); }catch(e){}
}

async function driveFetchFile(sync){
  const url = sync.url + (sync.url.includes('?') ? '&' : '?') + 'secret=' + encodeURIComponent(sync.secret);
  const res = await fetch(url, { method:'GET' });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  if(!data.words) return null; // nothing saved yet — first push will create it
  return { words: data.words, version: data.updatedAt || null };
}

async function pushToDrive(sync, retry, opts){
  opts = opts || {};
  try{
    const res = await fetch(sync.url, {
      method:'POST',
      // deliberately text/plain (not application/json) so this stays a CORS "simple request" —
      // Apps Script web apps don't handle preflight OPTIONS requests reliably
      headers:{ 'Content-Type':'text/plain;charset=UTF-8' },
      body: JSON.stringify({ secret: sync.secret, words, expectedUpdatedAt: driveVersion }),
      keepalive: !!opts.keepalive
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(data.conflict && !retry){
      // someone/something else updated the file — take its updatedAt and retry once
      driveVersion = data.currentUpdatedAt || null;
      return pushToDrive(sync, true, opts);
    }
    driveVersion = data.updatedAt;
    syncPushPending = false;
    updateSyncStatus('آخرین همگام‌سازی: ' + new Date().toLocaleTimeString('fa-IR'));
  }catch(e){
    console.error('ارسال به گوگل‌درایو ناموفق بود', e);
    updateSyncStatus('همگام‌سازی ناموفق بود — بررسی کن آدرس اسکریپت و رمز درست باشد.');
    // leave syncPushPending = true so the next save/flush attempt tries again
  }
}

function updateSyncStatus(text){
  const el = document.getElementById('syncStatusLine');
  if(el) el.textContent = text;
}
